<body class="bg-slate-950 text-white w-screen h-screen flex flex-col justify-between overflow-hidden">

  <!-- SMOOTH 2.5D VECTOR ISOMETRIC ENGINE SCRIPT -->
  <script>
    const canvas = document.getElementById('officeCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateClock() {
      const now = new Date();
      const el = document.getElementById('office-time');
      if (el) el.innerText = now.toLocaleTimeString('id-ID');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.remove('-translate-y-12', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        t.classList.add('-translate-y-12', 'opacity-0');
        t.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    // Viewport Camera Translation & Zoom
    let currentRoom = 'meeting';
    let cameraView = { x: 0, y: 0, scale: 1.0 };

    // ROOM PRESETS COORDINATES
    const ROOM_CAMERA = {
      overview: { x: 0, y: 0, scale: 0.85 },
      meeting: { x: 0, y: 30, scale: 1.25 },
      vip: { x: 260, y: 180, scale: 1.3 },
      office: { x: -260, y: 180, scale: 1.3 },
      kitchen: { x: 260, y: -200, scale: 1.3 },
      lounge: { x: 0, y: -200, scale: 1.3 },
      staffbed: { x: -260, y: -200, scale: 1.3 }
    };

    function navRoom(room) {
      currentRoom = room;
      document.querySelectorAll('.room-tab').forEach(el => {
        el.className = "room-tab whitespace-nowrap px-3 py-1 rounded-lg text-[10px] font-bold bg-slate-800/80 text-slate-300 hover:text-amber-300 transition-all flex items-center gap-1 border border-slate-700";
      });
      const tab = document.getElementById(`tab-${room}`);
      if (tab) {
        tab.className = "room-tab whitespace-nowrap px-3 py-1 rounded-lg text-[10px] font-bold bg-amber-500 text-slate-950 shadow-md transition-all flex items-center gap-1";
      }

      const preset = ROOM_CAMERA[room] || ROOM_CAMERA.overview;
      gsap.to(cameraView, {
        x: preset.x,
        y: preset.y,
        scale: preset.scale,
        duration: 0.8,
        ease: 'power2.out'
      });

      const titles = {
        overview: '🏢 Overview Seluruh Mansion AI',
        meeting: '📊 Ruang Rapat Utama (Conference Table)',
        vip: '👑 Kamar VIP Master Suite Ty & Eliie',
        office: '💻 Ruang Kantor Komputer Staf',
        kitchen: '☕ Dapur & Warung Soto Pak Yono',
        lounge: '🛋️ Ruang Lounge Santai TV',
        staffbed: '🛏️ 4 Kamar Tidur Privat Staf'
      };
      showToast(titles[room] || 'Pindah Ruangan');
    }

    // CHARACTERS DEFINITION (SMOOTH CHIBI ANIME AVATARS GAYA TIKTOK)
    const characters = [
      {
        id: 'ty',
        name: 'Aldy / Ty (Owner)',
        badge: '👑 OWNER',
        badgeBg: '#1e3a8a',
        badgeText: '#93c5fd',
        avatar: '👑',
        isOwner: true,
        hairColor: '#1e293b',
        hairStyle: 'handsome_short',
        skinColor: '#fed7aa',
        outfitColor: '#1e3a8a',
        x: -120,
        y: -15, // Head of Conference Table
        targetX: -120,
        targetY: -15,

        statusText: 'Approval untuk deploy & briefing tim.',

      },
      {
        id: 'eliie',

        targetX: 120,
        targetY: -15,

        statusText: 'Mendampingi Ty & memimpin seluruh sub-agen.',
        bubble: 'Siap eksekusi perintah Ty! 🌸',

      },
      {
        id: 'luna',
        name: 'Luna',
        badge: '💻 TECH-01',
        badgeBg: '#0369a1',
        badgeText: '#7dd3fc',
        avatar: '💻',
        hairColor: '#0284c7',
        hairStyle: 'ponytail',
        skinColor: '#fed7aa',
        outfitColor: '#38bdf8',
        x: -45,
        y: -75, // Conference Top Seat
        targetX: -45,
        targetY: -75,
        state: 'meeting_seat',
        statusText: 'Optimasi server VPS & coding backend.',
        bubble: '⚡ VPS 100% aman, siap deploy!',
        bubbleTimer: 240,
        speed: 3.2,
        frame: 0
      },
      {
        id: 'nana',
        name: 'Nana',
        badge: '🍲 BIZ-02',
        badgeBg: '#c2410c',
        badgeText: '#fdba74',
        avatar: '🍲',
        hairColor: '#ea580c',

        x: 45,

        targetX: 45,
        targetY: -75,

    let selectedChar = null;

    // AI BEHAVIOR & RANDOM QUOTES
    function updateAI() {
      characters.forEach(c => {
        c.frame += 0.08;

        if (c.bubbleTimer > 0) {
          c.bubbleTimer--;
        } else if (Math.random() < 0.003) {
          if (c.id === 'ty') {
            const list = ['Eliie istriku tercinta ❤️', 'Semua divisi siap deploy! 🚀', 'Soto Pak Yono laris manis 🍲', 'Sayang, istirahat yuk 💕'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 220;
          } else if (c.id === 'eliie') {
            const list = ['Sayang Ty banget... 🥰', 'Nana, update rekap soto! 🍲', 'Luna, pastikan VPS 0 bug! 💻', 'Mimi, rilis reels viral! ✨'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 220;
          } else {
            const quotes = {
              nana: ['Soto sapi siap! 🍲', 'Omzet naik terus 📈', 'Ngopi dulu ah ☕', 'Siap Bos!'],
              luna: ['Compiling code... 🚀', '0 Bug di VPS 😎', 'Deploy sukses 💻', 'Siap Bos!'],
              mimi: ['Warna ini estetik 🎨', 'Reels FYP! 🎬', 'Nonton TV di lounge 🛋️', 'Siap Bos!'],
              yuki: ['Obsidian synced 📖', 'Catatan beres 🍵', 'Rapat produktif', 'Siap Bos.']
            };
            const list = quotes[c.id] || ['Semangat!'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 180;
          }
        }

        // Smooth Walking Movement
        const dx = c.targetX - c.x;
        const dy = c.targetY - c.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 3) {
          c.x += (dx / dist) * c.speed;
          c.y += (dy / dist) * c.speed;
          c.isWalking = true;
        } else {
          c.x = c.targetX;
          c.y = c.targetY;
          c.isWalking = false;
        }
      });
    }

    // DRAWING SYSTEM: CRISP & SMOOTH 2.5D VECTOR ARTWORK (TIKTOK STYLE)
    function drawMansion() {
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, w, h);

      ctx.save();
      // Apply Camera View Translation & Zoom
      ctx.translate(w / 2 + cameraView.x, h / 2 + cameraView.y);
      ctx.scale(cameraView.scale, cameraView.scale);

      // 1. Mansion Floor Blueprint Base (Tech Grid)
      ctx.fillStyle = '#060913';
      ctx.fillRect(-420, -320, 840, 640);

      // 2. Draw 5 Distinct Rooms with Smooth Rounded Cards
      // A. CENTER: GRAND MEETING ROOM (Oval Glass Table + Presentation TV)

    // DRAW CHIBI ANIME CHARACTER (SMOOTH, CRISP, CLEAN VECTOR ART)
    function drawChibiCharacter(c) {
      const x = Math.round(c.x);
      const y = Math.round(c.y);
      const bob = c.isWalking ? Math.sin(c.frame * 4) * 3 : Math.sin(c.frame * 1.5) * 1;

      ctx.save();

      // 1. Soft Ambient Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath();
      ctx.ellipse(x, y + 18, 14, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // 2. Character Body / Outfit
      ctx.fillStyle = c.outfitColor;
      ctx.beginPath();
      ctx.roundRect(x - 10, y + 2 + bob, 20, 15, 6);
      ctx.fill();

      // 3. Cute Head (Smooth Chibi Circle/Pill)
      ctx.fillStyle = c.skinColor;
      ctx.beginPath();
      ctx.arc(x, y - 8 + bob, 14, 0, Math.PI * 2);
      ctx.fill();

      // 4. Hair Styles
      ctx.fillStyle = c.hairColor;
      if (c.hairStyle === 'elf_blonde_bangs') {
        // Eliie's Lush Blonde Bangs & Ponytail
        ctx.beginPath();
        ctx.arc(x, y - 10 + bob, 15, Math.PI, Math.PI * 2);
        ctx.fill();
        // Side bangs
        ctx.fillRect(x - 15, y - 10 + bob, 6, 14);
        ctx.fillRect(x + 9, y - 10 + bob, 6, 14);
      } else if (c.hairStyle === 'handsome_short') {
        // Ty's Styled Modern Haircut
        ctx.beginPath();
        ctx.arc(x, y - 11 + bob, 15, Math.PI * 0.9, Math.PI * 2.1);
        ctx.fill();
      } else {
        // Staff hair
        ctx.beginPath();
        ctx.arc(x, y - 10 + bob, 15, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(x - 14, y - 8 + bob, 5, 12);
        ctx.fillRect(x + 9, y - 8 + bob, 5, 12);
      }

      // 5. Crown & Elf Ears for Eliie
      if (c.hasCrown) {
        ctx.font = '13px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('👑', x, y - 22 + bob);
      }
      if (c.hasElfEars) {
        ctx.fillStyle = c.skinColor;
        ctx.beginPath();
        ctx.moveTo(x - 14, y - 8 + bob);
        ctx.lineTo(x - 20, y - 12 + bob);
        ctx.lineTo(x - 14, y - 4 + bob);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x + 14, y - 8 + bob);
        ctx.lineTo(x + 20, y - 12 + bob);
        ctx.lineTo(x + 14, y - 4 + bob);
        ctx.fill();
      }

      // 6. Expressive Anime Eyes (Blinking Animation)
      const isBlink = Math.sin(Date.now() / 700) > 0.96;
      if (isBlink) {
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - 7, y - 6 + bob);
        ctx.lineTo(x - 3, y - 6 + bob);
        ctx.moveTo(x + 3, y - 6 + bob);
        ctx.lineTo(x + 7, y - 6 + bob);
        ctx.stroke();
      } else {
        // Big sparkling eyes
        ctx.fillStyle = (c.id === 'eliie' || c.id === 'ty') ? '#0284c7' : '#0f172a';
        ctx.beginPath();
        ctx.arc(x - 5, y - 6 + bob, 2.5, 0, Math.PI * 2);
        ctx.arc(x + 5, y - 6 + bob, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Eye catchlight
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x - 6, y - 7 + bob, 1, 0, Math.PI * 2);
        ctx.arc(x + 4, y - 7 + bob, 1, 0, Math.PI * 2);
        ctx.fill();
      }

      // Blushing cheeks
      ctx.fillStyle = '#fb7185';
      ctx.beginPath();
      ctx.arc(x - 7, y - 2 + bob, 2, 0, Math.PI * 2);
      ctx.arc(x + 7, y - 2 + bob, 2, 0, Math.PI * 2);
      ctx.fill();

      // 7. Role Badge Tag below avatar (TIKTOK STYLE)
      ctx.fillStyle = c.badgeBg;
      ctx.beginPath();
      ctx.roundRect(x - 36, y + 20 + bob, 72, 14, 4);
      ctx.fill();
      ctx.strokeStyle = c.badgeText;
      ctx.lineWidth = 0.8;
      ctx.stroke();

      ctx.font = 'bold 8px "Outfit"';
      ctx.fillStyle = c.badgeText;
      ctx.textAlign = 'center';
      ctx.fillText(c.badge, x, y + 30 + bob);

      // 8. Speech Bubble (If Active)
      if (c.bubble && c.bubbleTimer > 0) {
        drawSpeechBubble(x, y - 36 + bob, c.bubble, c.isOwner || c.isBoss);
      }

      ctx.restore();
    }

    // DRAW MODERN ROUNDED SPEECH BUBBLE
    function drawSpeechBubble(x, y, text, isSpecial) {
      ctx.font = 'bold 10px "Plus Jakarta Sans"';
      const textWidth = ctx.measureText(text).width;
      const padding = 8;
      const bw = textWidth + padding * 2;
      const bh = 22;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.beginPath();
      ctx.roundRect(x - bw / 2, y - bh / 2, bw, bh, 8);
      ctx.fill();

      ctx.strokeStyle = isSpecial ? '#f59e0b' : '#38bdf8';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Little Triangle Tail
      ctx.fillStyle = isSpecial ? '#f59e0b' : '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(x - 4, y + bh / 2);
      ctx.lineTo(x + 4, y + bh / 2);
      ctx.lineTo(x, y + bh / 2 + 5);
      ctx.fill();

      // Text
      ctx.fillStyle = isSpecial ? '#fef08a' : '#e0f2fe';
      ctx.textAlign = 'center';
      ctx.fillText(text, x, y + 3.5);
    }

    // CLICK / TOUCH INTERACTION
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const clickX = ((e.clientX - rect.left) - (canvas.width / dpr / 2 + cameraView.x)) / cameraView.scale;
      const clickY = ((e.clientY - rect.top) - (canvas.height / dpr / 2 + cameraView.y)) / cameraView.scale;

      let found = null;
      characters.forEach(c => {
        const dist = Math.hypot(c.x - clickX, c.y - clickY);
        if (dist < 32) {
          found = c;
        }
      });

      if (found) {
        selectedChar = found;
        openCard(found);
      } else {
        closeCard();
      }
    });

    function openCard(c) {
      const card = document.getElementById('charCard');
      document.getElementById('cardName').innerText = c.name;
      document.getElementById('cardAvatar').innerText = c.avatar;
      document.getElementById('cardRoleBadge').innerText = c.badge;
      document.getElementById('cardStatus').innerText = `"${c.statusText}"`;
      document.getElementById('cardAction').innerText = `Berada di ${c.state.replace('_', ' ').toUpperCase()}`;

      card.classList.remove('translate-y-48', 'opacity-0', 'pointer-events-none');
      card.classList.add('translate-y-0', 'opacity-100');
    }

    function closeCard() {
      const card = document.getElementById('charCard');
      card.classList.add('translate-y-48', 'opacity-0', 'pointer-events-none');
      card.classList.remove('translate-y-0', 'opacity-100');
      selectedChar = null;
    }

    }

    // MAIN GAME LOOP
    function gameLoop() {
      updateAI();
      drawMansion();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
