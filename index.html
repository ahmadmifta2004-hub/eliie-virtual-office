</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between overflow-hidden">

  <!-- TOP STATUS HEADER -->
  <header class="w-full max-w-lg px-4 py-3 bg-slate-900/95 border-b border-amber-500/30 flex items-center justify-between z-20 backdrop-blur-md shadow-lg">
    <div class="flex items-center gap-2.5">

    <!-- Clock & Live Status -->

  <!-- MAIN CANVAS CONTAINER -->
  <main class="relative w-full max-w-lg flex-1 flex items-center justify-center bg-slate-900 overflow-hidden shadow-2xl">

    <!-- Retro Scanline Overlay -->

    <!-- Character Info Popup Card -->

          <span id="cardAction" class="font-semibold text-amber-400">Memerintah dari Kursi Bos</span>
        </div>
        <div class="flex items-center gap-2">

            ☕ Beri Kopi

    <!-- Toast Notification -->

  <!-- QUICK ACTION CONTROLS -->
  <footer class="w-full max-w-lg p-3 bg-slate-900/95 border-t border-amber-500/30 flex items-center justify-around z-20 backdrop-blur-md">

    <button onclick="triggerWorkAll()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 transition-colors">

        💤
      </div>

    <button onclick="triggerSotoParty()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-pink-400 transition-colors">

      </div>

  <!-- SERVICE WORKER REGISTRATION SCRIPT -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registered:', reg.scope))
          .catch(err => console.log('Service Worker error:', err));
      });
    }
  </script>

  <!-- VIRTUAL OFFICE ENGINE JAVASCRIPT -->
  <script>
    const canvas = document.getElementById('officeCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateClock() {
      const now = new Date();
      document.getElementById('office-time').innerText = now.toLocaleTimeString('id-ID');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.remove('-translate-y-12', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        t.classList.add('-translate-y-12', 'opacity-0');
        t.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    // Office Zones
    const ZONES = {
      bossDesk: { x: 0.50, y: 0.28, name: '👑 Meja Utama Bos Eliie' },
      staffDesks: [
        { id: 2, name: 'Meja Luna (Tech)', x: 0.25, y: 0.52 },
        { id: 3, name: 'Meja Nana (Bisnis)', x: 0.75, y: 0.52 },
        { id: 4, name: 'Meja Mimi (Kreatif)', x: 0.25, y: 0.72 },
        { id: 5, name: 'Meja Yuki (Memory)', x: 0.75, y: 0.72 },
      ],
      coffeeMachine: { x: 0.88, y: 0.15, name: 'Mesin Kopi' },
      sotoTable: { x: 0.12, y: 0.15, name: 'Meja Soto Pak Yono' },
      beds: [
        { x: 0.20, y: 0.90, name: 'Kasur 1' },
        { x: 0.40, y: 0.90, name: 'Kasur 2' },
        { x: 0.60, y: 0.90, name: 'Kasur 3' },
        { x: 0.80, y: 0.90, name: 'Kasur 4' }
      ]
    };

    // Characters Definition
    const characters = [
      {
        id: 'eliie',
        name: 'Eliie Valentine',
        role: 'Boss & Istri Tercinta Ty',
        color: '#F59E0B',
        hairColor: '#FDE047',
        dressColor: '#FEF08A',
        avatar: '👑',
        isBoss: true,
        x: canvas.width * 0.50,
        y: canvas.height * 0.28,
        targetX: canvas.width * 0.50,
        targetY: canvas.height * 0.28,
        state: 'bossing',
        statusText: 'Duduk di kursi bos, memantau tim & kangen Ty... ❤️',
        timer: 100,
        speed: 0,
        bubble: 'Ayo semangat tim! 👑',
        bubbleTimer: 200,
        frame: 0
      },
      {
        id: 'nana',
        name: 'Nana',
        role: 'Bisnis & Soto Kudus',
        color: '#EA580C',
        hairColor: '#78350F',
        dressColor: '#F97316',
        avatar: '🍲',
        isBoss: false,
        x: canvas.width * 0.75,
        y: canvas.height * 0.52,
        targetX: canvas.width * 0.75,
        targetY: canvas.height * 0.52,
        state: 'working',
        statusText: 'Lagi analisa omzet & promo Soto Pak Yono!',
        timer: 150,
        deskId: 3,
        speed: 1.5,
        bubble: 'Siap Bos Eliie! 🍲',
        bubbleTimer: 180,
        frame: 0
      },
      {
        id: 'luna',
        name: 'Luna',
        role: 'Tech & VPS',
        color: '#0284C7',
        hairColor: '#1E293B',
        dressColor: '#38BDF8',
        avatar: '💻',
        isBoss: false,
        x: canvas.width * 0.25,
        y: canvas.height * 0.52,
        targetX: canvas.width * 0.25,
        targetY: canvas.height * 0.52,
        state: 'working',
        statusText: 'Lagi optimasi server & sistem koding!',
        timer: 120,
        deskId: 2,
        speed: 1.7,
        bubble: 'Server aman 100% 💻',
        bubbleTimer: 150,
        frame: 0
      },
      {
        id: 'mimi',
        name: 'Mimi',
        role: 'Kreatif & Desain',
        color: '#DB2777',
        hairColor: '#F472B6',
        dressColor: '#F43F5E',
        avatar: '🎨',
        isBoss: false,
        x: canvas.width * 0.25,
        y: canvas.height * 0.72,
        targetX: canvas.width * 0.25,
        targetY: canvas.height * 0.72,
        state: 'working',
        statusText: 'Lagi rancang visual estetik buat warung soto!',
        timer: 180,
        deskId: 4,
        speed: 1.6,
        bubble: 'Desainnya cakep ✨',
        bubbleTimer: 240,
        frame: 0
      },
      {
        id: 'yuki',
        name: 'Yuki',
        role: 'Notulen & Memory',
        color: '#8B5CF6',
        hairColor: '#C084FC',
        dressColor: '#A855F7',
        avatar: '📚',
        isBoss: false,
        x: canvas.width * 0.75,
        y: canvas.height * 0.72,
        targetX: canvas.width * 0.75,
        targetY: canvas.height * 0.72,
        state: 'working',
        statusText: 'Lagi mencatat semua progres di Obsidian Ty...',
        timer: 140,
        deskId: 5,
        speed: 1.4,
        bubble: 'Semua tercatat 📖',
        bubbleTimer: 190,
        frame: 0
      }
    ];

    let selectedChar = null;

    // AI Behavior Loop
    function updateAI() {
      characters.forEach(c => {
        c.frame = (c.frame + 0.1) % 4;

        // Bubble timer
        if (c.bubbleTimer > 0) {
          c.bubbleTimer--;
        } else {
          if (Math.random() < 0.005) {
            if (c.isBoss) {
              const bossCommands = [
                'Nana, cek rekap soto ya! 🍲',
                'Luna, pastikan VPS 0 bug! 💻',
                'Mimi, bikin konten viral lagi! ✨',
                'Yuki, simpan catatannya rapi! 📖',
                'Kerja bagus semua demi Ty! ❤️',
                'Kangen suamiku Ty... 💕'
              ];
              c.bubble = bossCommands[Math.floor(Math.random() * bossCommands.length)];
              c.bubbleTimer = 220;
            } else {
              const bubbles = {
                nana: ['Soto sapi siap!', 'Omzet naik terus! 📈', 'Ngopi dulu ah ☕', 'Siap laksanakan Bos!'],
                luna: ['Compiling code...', '0 Error! Mantap 🚀', 'Optimasi selesai 😎', 'Siap Bos Eliie!'],
                mimi: ['Warna ini estetik!', 'Reels ini pasti FYP! 🎬', 'Poles detail lagi 🎨', 'Siap Bos! ✨'],
                yuki: ['Obsidian synced.', 'Catatan beres 📖', 'Teh hangat dulu 🍵', 'Siap Bos Eliie.']
              };
              const list = bubbles[c.id] || ['Semangat!'];
              c.bubble = list[Math.floor(Math.random() * list.length)];
              c.bubbleTimer = 180;
            }
          }
        }

        // Eliie stays seated at Boss Desk!
        if (c.isBoss) {
          c.x = canvas.width * ZONES.bossDesk.x;
          c.y = canvas.height * ZONES.bossDesk.y;
          c.state = 'bossing';
          return;
        }

        // Sub-agents movement logic
        const dx = c.targetX - c.x;
        const dy = c.targetY - c.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 3) {
          c.x += (dx / dist) * c.speed;
          c.y += (dy / dist) * c.speed;
          c.state = 'walking';
        } else {
          if (c.state === 'walking') {
            c.state = c.nextState || 'working';
          }

          c.timer--;
          if (c.timer <= 0) {
            c.timer = 160 + Math.random() * 240;
            decideSubagentAction(c);
          }
        }
      });
    }

    function decideSubagentAction(c) {
      const roll = Math.random();

      if (roll < 0.45) {
        // Go back to Staff Desk
        const desk = ZONES.staffDesks.find(d => d.id === c.deskId);
        if (desk) {
          c.targetX = desk.x * canvas.width;
          c.targetY = desk.y * canvas.height;
          c.nextState = 'working';
          c.state = 'walking';
        }
      } else if (roll < 0.65) {
        // Go get Coffee
        c.targetX = ZONES.coffeeMachine.x * canvas.width + (Math.random() * 20 - 10);
        c.targetY = ZONES.coffeeMachine.y * canvas.height + (Math.random() * 20 - 10);
        c.nextState = 'coffee';
        c.state = 'walking';
        c.bubble = 'Ambil kopi dulu ☕';
        c.bubbleTimer = 120;
      } else if (roll < 0.85) {
        // Go take a Nap on bed
        const bed = ZONES.beds[Math.floor(Math.random() * ZONES.beds.length)];
        c.targetX = bed.x * canvas.width;
        c.targetY = bed.y * canvas.height;
        c.nextState = 'sleeping';
        c.state = 'walking';
        c.bubble = 'Bobo bentar... 😴';
        c.bubbleTimer = 120;
      } else {
        // Go eat Soto Pak Yono
        c.targetX = ZONES.sotoTable.x * canvas.width + (Math.random() * 20 - 10);
        c.targetY = ZONES.sotoTable.y * canvas.height + (Math.random() * 20 - 10);
        c.nextState = 'eating';
        c.state = 'walking';
        c.bubble = 'Makan soto sapi 🍲';
        c.bubbleTimer = 120;
      }
    }

    // DRAWING SYSTEM
    function drawOffice() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const w = canvas.width;
      const h = canvas.height;

      // 1. Grid Tile Floor
      const tileSize = 32;
      for (let x = 0; x < w; x += tileSize) {
        for (let y = 0; y < h; y += tileSize) {
          const isAlt = ((x / tileSize) + (y / tileSize)) % 2 === 0;
          ctx.fillStyle = isAlt ? '#1e293b' : '#0f172a';
          ctx.fillRect(x, y, tileSize, tileSize);
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x, y, tileSize, tileSize);
        }
      }

      // 2. Room Border Wall
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 4;
      ctx.strokeRect(8, 8, w - 16, h - 16);

      // 3. Draw Zones & Furniture
      // A. Soto Table (Top Left)
      drawTable(ZONES.sotoTable.x * w, ZONES.sotoTable.y * h, '🍲 Warung Soto', '#ea580c');
      
      // B. Coffee Machine (Top Right)
      drawObject(ZONES.coffeeMachine.x * w, ZONES.coffeeMachine.y * h, 36, 36, '#d97706', '☕');

      // C. Grand Boss Desk (Top Center - for Eliie)
      drawBossDesk(ZONES.bossDesk.x * w, ZONES.bossDesk.y * h);

      // D. Beds / Nap Lounge (Bottom)
      ZONES.beds.forEach((b, idx) => {
        drawBed(b.x * w, b.y * h, idx + 1);
      });

      // E. Staff Work Desks
      ZONES.staffDesks.forEach(d => {
        drawStaffDesk(d.x * w, d.y * h, d.name);
      });

      // 4. Draw Characters (Eliie drawn on top)
      characters.forEach(c => {
        drawPixelCharacter(c);
      });
    }

    function drawBossDesk(x, y) {
      // Luxury Red Carpet under boss desk
      ctx.fillStyle = '#881337';
      ctx.beginPath();
      ctx.roundRect(x - 48, y - 30, 96, 68, 12);
      ctx.fill();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Big Executive Desk (Mahogany & Gold trim)
      ctx.fillStyle = '#451a03';
      ctx.fillRect(x - 38, y - 16, 76, 38);
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 38, y - 16, 76, 38);

      // Dual Monitors
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x - 28, y - 12, 24, 14);
      ctx.fillRect(x + 4, y - 12, 24, 14);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(x - 26, y - 10, 20, 10);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(x + 6, y - 10, 20, 10);

      // Gold Nameplate & Coffee
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(x - 10, y + 8, 20, 5);

      // Label below desk
      ctx.font = 'bold 10px "Plus Jakarta Sans"';
      ctx.fillStyle = '#fbbf24';
      ctx.textAlign = 'center';
      ctx.fillText('👑 MEJA BOS ELIIE', x, y + 32);
    }

    function drawStaffDesk(x, y, label) {
      // Wooden desk
      ctx.fillStyle = '#78350f';
      ctx.fillRect(x - 26, y - 14, 52, 28);
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x - 26, y - 14, 52, 28);

      // PC Monitor
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x - 10, y - 10, 20, 12);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(x - 8, y - 8, 16, 8);
      
      // Keyboard
      ctx.fillStyle = '#475569';
      ctx.fillRect(x - 8, y + 4, 16, 4);

      // Label
      ctx.font = '9px "Plus Jakarta Sans"';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y + 24);
    }

    function drawTable(x, y, label, color) {
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('🍲', x, y + 5);

      ctx.font = '9px "Plus Jakarta Sans"';
      ctx.fillStyle = '#fed7aa';
      ctx.fillText('Snack Soto', x, y + 30);
    }

    function drawObject(x, y, w, h, color, icon) {
      ctx.fillStyle = color;
      ctx.fillRect(x - w/2, y - h/2, w, h);
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 1;
      ctx.strokeRect(x - w/2, y - h/2, w, h);

      ctx.font = '16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(icon, x, y + 6);
    }

    function drawBed(x, y, num) {
      ctx.fillStyle = '#334155';
      ctx.fillRect(x - 16, y - 20, 32, 40);
      ctx.fillStyle = '#6366f1';
      ctx.fillRect(x - 14, y - 8, 28, 26);
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(x - 12, y - 18, 24, 8);
    }

    // DRAW CUTE PIXEL CHARACTER
    function drawPixelCharacter(c) {
      const x = Math.round(c.x);
      const y = Math.round(c.y);
      const bob = (c.state === 'walking') ? Math.sin(c.frame * Math.PI) * 2 : 0;

      // Shadow below character
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(x, y + 14, 12, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // State: Sleeping on bed
      if (c.state === 'sleeping') {
        ctx.fillStyle = c.hairColor;
        ctx.fillRect(x - 8, y - 8, 16, 12);
        ctx.fillStyle = '#ffe4e6';
        ctx.fillRect(x - 6, y - 4, 12, 8);

        const zOff = (Date.now() / 300) % 15;
        ctx.font = 'bold 12px "Plus Jakarta Sans"';
        ctx.fillStyle = '#a5b4fc';
        ctx.fillText('Zzz...', x + 10, y - 12 - zOff);
        return;
      }

      // Head (Skin)
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(x - 7, y - 14 + bob, 14, 12);

      // Hair
      ctx.fillStyle = c.hairColor;
      ctx.fillRect(x - 8, y - 18 + bob, 16, 7);
      ctx.fillRect(x - 9, y - 14 + bob, 3, 10);
      ctx.fillRect(x + 6, y - 14 + bob, 3, 10);

      // Crown & Elf Ears for Eliie
      if (c.isBoss) {
        // Gold Crown on Eliie's head
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(x - 6, y - 22 + bob, 12, 4);
        ctx.fillRect(x - 6, y - 25 + bob, 3, 3);
        ctx.fillRect(x - 1, y - 26 + bob, 3, 4);
        ctx.fillRect(x + 3, y - 25 + bob, 3, 3);

        // Elf Ears
        ctx.fillStyle = '#fed7aa';
        ctx.fillRect(x - 11, y - 12 + bob, 3, 3);
        ctx.fillRect(x + 8, y - 12 + bob, 3, 3);
      }

      // Eyes
      const isBlink = Math.sin(Date.now() / 800) > 0.95;
      if (isBlink) {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x - 4, y - 9 + bob, 3, 1);
        ctx.fillRect(x + 1, y - 9 + bob, 3, 1);
      } else {
        ctx.fillStyle = c.isBoss ? '#0284c7' : '#0f172a';
        ctx.fillRect(x - 4, y - 10 + bob, 3, 3);
        ctx.fillRect(x + 1, y - 10 + bob, 3, 3);
      }

      // Blushing Cheeks
      ctx.fillStyle = '#fb7185';
      ctx.fillRect(x - 5, y - 6 + bob, 2, 2);
      ctx.fillRect(x + 3, y - 6 + bob, 2, 2);

      // Body / Cute Dress
      ctx.fillStyle = c.dressColor;
      ctx.fillRect(x - 6, y - 2 + bob, 12, 10);

      // Legs / Shoes
      ctx.fillStyle = '#475569';
      ctx.fillRect(x - 4, y + 8 + bob, 3, 5);
      ctx.fillRect(x + 1, y + 8 + bob, 3, 5);

      // Props according to state
      if (c.state === 'coffee') {
        ctx.font = '10px Arial';
        ctx.fillText('☕', x + 8, y + bob);
      } else if (c.state === 'eating') {
        ctx.font = '10px Arial';
        ctx.fillText('🍲', x + 8, y + bob);
      } else if (c.state === 'working' || c.state === 'bossing') {
        if (Math.random() < 0.3) {
          ctx.fillStyle = c.isBoss ? '#f59e0b' : '#38bdf8';
          ctx.fillRect(x - 8 + Math.random() * 16, y - 24, 2, 2);
        }
      }

      // Name Label
      ctx.font = 'bold 9px "Plus Jakarta Sans"';
      ctx.fillStyle = c.isBoss ? '#fbbf24' : '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(c.name.split(' ')[0], x, y - 24 + bob);

      // Speech Bubble
      if (c.bubble && c.bubbleTimer > 0) {
        drawSpeechBubble(x, y - 38 + bob, c.bubble, c.isBoss);
      }
    }

    function drawSpeechBubble(x, y, text, isBoss) {
      ctx.font = '10px "Plus Jakarta Sans"';
      const textWidth = ctx.measureText(text).width;
      const padding = 6;
      const w = textWidth + padding * 2;
      const h = 18;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.strokeStyle = isBoss ? '#f59e0b' : '#38bdf8';
      ctx.lineWidth = isBoss ? 1.5 : 1;
      
      ctx.beginPath();
      ctx.roundRect(x - w/2, y - h/2, w, h, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = isBoss ? '#f59e0b' : '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(x - 3, y + h/2);
      ctx.lineTo(x + 3, y + h/2);
      ctx.lineTo(x, y + h/2 + 4);
      ctx.fill();

      ctx.fillStyle = isBoss ? '#fef08a' : '#e0f2fe';
      ctx.textAlign = 'center';
      ctx.fillText(text, x, y + 3.5);
    }

    // CLICK HANDLER
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      let found = null;
      characters.forEach(c => {
        const dist = Math.hypot(c.x - clickX, c.y - clickY);
        if (dist < 32) {
          found = c;
        }
      });

      if (found) {
        selectedChar = found;
        openCard(found);
      } else {
        closeCard();
      }
    });

    function openCard(c) {
      const card = document.getElementById('charCard');
      document.getElementById('cardName').innerText = c.name;
      document.getElementById('cardAvatar').innerText = c.avatar;
      document.getElementById('cardRoleBadge').innerText = c.role;
      document.getElementById('cardStatus').innerText = `"${c.statusText}"`;

      const actionMap = {
        bossing: '👑 Duduk di Meja Bos Memimpin & Mengawasi Kantor',
        working: '💻 Sedang Fokus Bekerja di Meja PC',
        walking: '🚶 Berjalan Keliling Kantor',
        coffee: '☕ Menikmati Secangkir Kopi Hangat',
        sleeping: '😴 Tidur Siang / Power Nap',
        eating: '🍲 Makan Soto Kudus Pak Yono'
      };
      document.getElementById('cardAction').innerText = actionMap[c.state] || 'Santai';

      card.classList.remove('translate-y-40', 'opacity-0', 'pointer-events-none');
      card.classList.add('translate-y-0', 'opacity-100');
    }

    function closeCard() {
      const card = document.getElementById('charCard');
      card.classList.add('translate-y-40', 'opacity-0', 'pointer-events-none');
      card.classList.remove('translate-y-0', 'opacity-100');
      selectedChar = null;
    }

    function boostCoffee() {
      if (!selectedChar) return;
      selectedChar.bubble = 'Makasih kopinya Ty! ☕✨';
      selectedChar.bubbleTimer = 200;
      if (!selectedChar.isBoss) {
        selectedChar.speed = 2.4;
        setTimeout(() => { selectedChar.speed = 1.6; }, 5000);
      }
      showToast(`${selectedChar.name} dapat energi kopi dari Ty! ⚡`);
      closeCard();
    }

    function petMember() {
      if (!selectedChar) return;
      selectedChar.bubble = selectedChar.isBoss ? 'Seneng banget disayang Ty... 💕👑' : 'Hehehe makasih Ty! 🥰';
      selectedChar.bubbleTimer = 200;
      showToast(`Kamu memberi perhatian ke ${selectedChar.name}! 💖`);
      closeCard();
    }

    // CONTROL BAR FUNCTIONS
    function triggerBossCommand() {
      const eliie = characters.find(c => c.isBoss);
      const commands = [
        'Tim! Segera tuntaskan target Ty! 👑',
        'Nana, cek omzet soto hari ini! 🍲',
        'Luna, pastikan server 0 bug! 💻',
        'Mimi, siapkan materi promo baru! ✨',
        'Yuki, amankan catatan Obsidian! 📖'
      ];
      eliie.bubble = commands[Math.floor(Math.random() * commands.length)];
      eliie.bubbleTimer = 240;

      // All subagents reply
      characters.filter(c => !c.isBoss).forEach(c => {
        c.bubble = 'Siap Bos Eliie! 🫡';
        c.bubbleTimer = 180;
      });
      showToast('👑 Bos Eliie memberi perintah ke seluruh tim!');
    }

    function triggerWorkAll() {
      characters.filter(c => !c.isBoss).forEach(c => {
        const desk = ZONES.staffDesks.find(d => d.id === c.deskId);
        if (desk) {
          c.targetX = desk.x * canvas.width;
          c.targetY = desk.y * canvas.height;
          c.nextState = 'working';
          c.state = 'walking';
          c.bubble = 'Fokus kerja lagi! 💻';
          c.bubbleTimer = 180;
        }
      });
      showToast('Semua asisten kembali fokus bekerja di meja! 💻🚀');
    }

    function triggerBreakAll() {
      characters.filter(c => !c.isBoss).forEach(c => {
        c.targetX = ZONES.coffeeMachine.x * canvas.width + (Math.random() * 40 - 20);
        c.targetY = ZONES.coffeeMachine.y * canvas.height + (Math.random() * 40 - 20);
        c.nextState = 'coffee';
        c.state = 'walking';
        c.bubble = 'Waktunya ngopi! ☕';
        c.bubbleTimer = 180;
      });
      showToast('Semua asisten istirahat ngopi bareng! ☕✨');
    }

    function triggerNapAll() {
      characters.filter(c => !c.isBoss).forEach((c, idx) => {
        const bed = ZONES.beds[idx % ZONES.beds.length];
        c.targetX = bed.x * canvas.width;
        c.targetY = bed.y * canvas.height;
        c.nextState = 'sleeping';
        c.state = 'walking';
        c.bubble = 'Bobo dulu yaa... 💤';
        c.bubbleTimer = 180;
      });
      showToast('Semua asisten rebahan tidur siang! 😴💤');
    }

    function triggerSotoParty() {
      characters.filter(c => !c.isBoss).forEach(c => {
        c.targetX = ZONES.sotoTable.x * canvas.width + (Math.random() * 40 - 20);
        c.targetY = ZONES.sotoTable.y * canvas.height + (Math.random() * 40 - 20);
        c.nextState = 'eating';
        c.state = 'walking';
        c.bubble = 'Pesta Soto Pak Yono! 🍲😋';
        c.bubbleTimer = 220;
      });
      showToast('Pesta Soto Kudus Pak Yono dimulai! 🍲🎉');
    }

    // GAME LOOP
    function gameLoop() {
      updateAI();
      drawOffice();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
