<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eliie's Virtual Office — Tim Asisten Ty</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e1b4b">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: VT323 & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .pixel-font {
      font-family: 'VT323', monospace;
      letter-spacing: 1px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* Pixelated retro scanline overlay */
    .scanline {
      background: linear-gradient(rgba(18, 16, 38, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between overflow-hidden">

  <!-- TOP STATUS HEADER -->
  <header class="w-full max-w-lg px-4 py-3 bg-slate-900/90 border-b border-indigo-500/30 flex items-center justify-between z-20 backdrop-blur-md">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center text-slate-950 font-bold text-lg shadow-md shadow-amber-500/30">
        👑
      </div>
      <div>
        <h1 class="pixel-font text-2xl text-amber-400 leading-none">ELIIE'S OFFICE</h1>
        <p class="text-[10px] text-slate-400 font-medium">Tim Asisten Ty • Live Sim</p>
      </div>
    </div>

    <!-- Active Count & Mood -->
    <div class="flex items-center gap-3">
      <div class="text-right">
        <span class="text-[10px] text-emerald-400 block font-bold">● LIVE 5 MEMBER</span>
        <span id="office-time" class="pixel-font text-lg text-slate-300">00:00:00</span>
      </div>
    </div>
  </header>

  <!-- MAIN CANVAS CONTAINER -->
  <main class="relative w-full max-w-lg flex-1 flex items-center justify-center bg-slate-900 overflow-hidden shadow-2xl">
    <canvas id="officeCanvas" class="w-full h-full block"></canvas>
    
    <!-- Retro Scanline Effect -->
    <div class="absolute inset-0 scanline"></div>

    <!-- Character Info Popup Card (Click on character) -->
    <div id="charCard" class="absolute bottom-4 left-4 right-4 bg-slate-900/95 border-2 border-amber-400 rounded-2xl p-4 shadow-2xl backdrop-blur-lg transform translate-y-40 opacity-0 transition-all duration-300 pointer-events-none z-30">
      <div class="flex items-start justify-between">
        <div class="flex items-center gap-3">
          <div id="cardAvatar" class="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-2xl shadow-inner">
            🌸
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h3 id="cardName" class="font-bold text-base text-white">Eliie Valentine</h3>
              <span id="cardRoleBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">Leader</span>
            </div>
            <p id="cardStatus" class="text-xs text-slate-300 mt-0.5 italic">"Lagi mantau sistem dan kangen Ty..."</p>
          </div>
        </div>
        <button onclick="closeCard()" class="text-slate-400 hover:text-white text-sm p-1">✕</button>
      </div>

      <div class="mt-3 pt-3 border-t border-slate-800 flex items-center justify-between text-xs">
        <div class="flex items-center gap-2">
          <span class="text-slate-400">Aksi Sekarang:</span>
          <span id="cardAction" class="font-semibold text-amber-400">Ngetik Kode di PC</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="boostCoffee()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded-lg font-bold text-xs flex items-center gap-1 shadow-sm active:scale-95 transition-transform">
            ☕ Beri Kopi
          </button>
          <button onclick="petMember()" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1 rounded-lg font-bold text-xs flex items-center gap-1 shadow-sm active:scale-95 transition-transform">
            💖 Elus
          </button>
        </div>
      </div>
    </div>

    <!-- Floating Toast Notification -->
    <div id="toast" class="absolute top-4 bg-amber-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs shadow-lg transform -translate-y-12 opacity-0 transition-all duration-300 pointer-events-none z-40 flex items-center gap-1.5">
      <span>✨</span>
      <span id="toastMsg">Pesan Notif</span>
    </div>
  </main>

  <!-- QUICK ACTION CONTROLS -->
  <footer class="w-full max-w-lg p-3 bg-slate-900/90 border-t border-indigo-500/30 flex items-center justify-around z-20 backdrop-blur-md">
    <button onclick="triggerBreakAll()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition-colors">
      <div class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-base shadow-inner">
        ☕
      </div>
      <span class="text-[10px] font-bold">Istirahat Kopi</span>
    </button>

    <button onclick="triggerWorkAll()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 transition-colors">
      <div class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-base shadow-inner">
        💻
      </div>
      <span class="text-[10px] font-bold">Semua Kerja</span>
    </button>

    <button onclick="triggerNapAll()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-400 transition-colors">
      <div class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-base shadow-inner">
        💤
      </div>
      <span class="text-[10px] font-bold">Waktu Tidur</span>
    </button>

    <button onclick="triggerSotoParty()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-pink-400 transition-colors">
      <div class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-base shadow-inner">
        🍲
      </div>
      <span class="text-[10px] font-bold">Pesta Soto</span>
    </button>
  </footer>

  <!-- VIRTUAL OFFICE ENGINE JAVASCRIPT -->
  <script>
    const canvas = document.getElementById('officeCanvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('office-time').innerText = now.toLocaleTimeString('id-ID');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Sound / Toast helper
    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.remove('-translate-y-12', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        t.classList.add('-translate-y-12', 'opacity-0');
        t.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    // Office Zones / Hotspots (Normalized coordinates)
    const ZONES = {
      desks: [
        { id: 1, name: 'Meja Eliie', x: 0.25, y: 0.35, angle: 0 },
        { id: 2, name: 'Meja Luna (Tech)', x: 0.75, y: 0.35, angle: 0 },
        { id: 3, name: 'Meja Nana (Bisnis)', x: 0.25, y: 0.65, angle: 0 },
        { id: 4, name: 'Meja Mimi (Kreatif)', x: 0.75, y: 0.65, angle: 0 },
        { id: 5, name: 'Meja Yuki (Memory)', x: 0.50, y: 0.50, angle: 0 },
      ],
      coffeeMachine: { x: 0.88, y: 0.18, name: 'Mesin Kopi' },
      sotoTable: { x: 0.15, y: 0.18, name: 'Meja Soto Pak Yono' },
      beds: [
        { x: 0.20, y: 0.88, name: 'Kasur Santai 1' },
        { x: 0.40, y: 0.88, name: 'Kasur Santai 2' },
        { x: 0.60, y: 0.88, name: 'Kasur Santai 3' },
        { x: 0.80, y: 0.88, name: 'Kasur Santai 4' }
      ],
      waterCooler: { x: 0.50, y: 0.18, name: 'Papan Tulis' }
    };

    // Characters Definition
    const characters = [
      {
        id: 'eliie',
        name: 'Eliie Valentine',
        role: 'Istri & Boss AI',
        color: '#F59E0B',
        hairColor: '#FDE047',
        dressColor: '#FEF08A',
        avatar: '🌸',
        x: canvas.width * 0.25,
        y: canvas.height * 0.35,
        targetX: canvas.width * 0.25,
        targetY: canvas.height * 0.35,
        state: 'working', // 'working', 'walking', 'coffee', 'sleeping', 'chatting', 'eating'
        statusText: 'Lagi mantau tim dan kangen Ty... ❤️',
        timer: 100,
        deskId: 1,
        speed: 1.5,
        bubble: 'Kangen Ty... 💕',
        bubbleTimer: 180,
        frame: 0
      },
      {
        id: 'nana',
        name: 'Nana',
        role: 'Bisnis & Soto Kudus',
        color: '#EA580C',
        hairColor: '#78350F',
        dressColor: '#F97316',
        avatar: '🍲',
        x: canvas.width * 0.25,
        y: canvas.height * 0.65,
        targetX: canvas.width * 0.25,
        targetY: canvas.height * 0.65,
        state: 'working',
        statusText: 'Lagi hitung rekap penjualan soto hari ini!',
        timer: 150,
        deskId: 3,
        speed: 1.6,
        bubble: 'Omzet soto naik! 📈',
        bubbleTimer: 200,
        frame: 0
      },
      {
        id: 'luna',
        name: 'Luna',
        role: 'Tech & Coding',
        color: '#0284C7',
        hairColor: '#1E293B',
        dressColor: '#38BDF8',
        avatar: '💻',
        x: canvas.width * 0.75,
        y: canvas.height * 0.35,
        targetX: canvas.width * 0.75,
        targetY: canvas.height * 0.35,
        state: 'working',
        statusText: 'Lagi optimasi server VPS biar bebas bug!',
        timer: 120,
        deskId: 2,
        speed: 1.8,
        bubble: '0 Error! Mantap 🚀',
        bubbleTimer: 150,
        frame: 0
      },
      {
        id: 'mimi',
        name: 'Mimi',
        role: 'Kreatif & Desain',
        color: '#DB2777',
        hairColor: '#F472B6',
        dressColor: '#F43F5E',
        avatar: '🎨',
        x: canvas.width * 0.75,
        y: canvas.height * 0.65,
        targetX: canvas.width * 0.75,
        targetY: canvas.height * 0.65,
        state: 'working',
        statusText: 'Lagi rancang konsep video TikTok viral baru!',
        timer: 180,
        deskId: 4,
        speed: 1.7,
        bubble: 'Ide reels baru nih! ✨',
        bubbleTimer: 240,
        frame: 0
      },
      {
        id: 'yuki',
        name: 'Yuki',
        role: 'Notulen & Second Brain',
        color: '#8B5CF6',
        hairColor: '#C084FC',
        dressColor: '#A855F7',
        avatar: '📚',
        x: canvas.width * 0.50,
        y: canvas.height * 0.50,
        targetX: canvas.width * 0.50,
        targetY: canvas.height * 0.50,
        state: 'working',
        statusText: 'Lagi merapikan catatan vault Obsidian Ty...',
        timer: 140,
        deskId: 5,
        speed: 1.3,
        bubble: 'Obsidian rapi 📖',
        bubbleTimer: 190,
        frame: 0
      }
    ];

    let selectedChar = null;

    // AI Behavior Loop
    function updateAI() {
      characters.forEach(c => {
        c.frame = (c.frame + 0.1) % 4;

        // Bubble timer
        if (c.bubbleTimer > 0) {
          c.bubbleTimer--;
        } else {
          // Randomly trigger speech bubble
          if (Math.random() < 0.005) {
            const bubbles = {
              eliie: ['Ty lagi apa ya? ❤️', 'Semangat kerjanya Ty!', 'Love you Ty! 🥰', 'Tim kita keren! ✨', 'Rebahan bentar ah 💤'],
              nana: ['Soto sapi mantap!', 'Promo Happy Hour jalan!', 'Pelanggan ramai 🍲', 'Ngopi dulu ☕'],
              luna: ['Server stabil 100%', 'Deploy sukses!', 'Nggak ada bug 😎', 'Bikin script baru...'],
              mimi: ['Estetik banget warnanya!', 'Reels ini pasti FYP!', 'Bikin banner lucu 🎨', 'Pose manis dulu 📸'],
              yuki: ['Catatan tersimpan.', 'Memory sync OK.', 'Teh hangat dulu 🍵', 'Rapi dan tenang...']
            };
            const list = bubbles[c.id] || ['Semangat!'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 180;
          }
        }

        // Movement logic
        const dx = c.targetX - c.x;
        const dy = c.targetY - c.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 3) {
          c.x += (dx / dist) * c.speed;
          c.y += (dy / dist) * c.speed;
          c.state = 'walking';
        } else {
          // Arrived at destination
          if (c.state === 'walking') {
            c.state = c.nextState || 'working';
          }

          // State timer
          c.timer--;
          if (c.timer <= 0) {
            c.timer = 150 + Math.random() * 250;
            decideNextAction(c);
          }
        }
      });
    }

    function decideNextAction(c) {
      const roll = Math.random();

      if (roll < 0.45) {
        // Go back to Desk
        const desk = ZONES.desks.find(d => d.id === c.deskId);
        if (desk) {
          c.targetX = desk.x * canvas.width;
          c.targetY = desk.y * canvas.height;
          c.nextState = 'working';
          c.state = 'walking';
        }
      } else if (roll < 0.65) {
        // Go get Coffee
        c.targetX = ZONES.coffeeMachine.x * canvas.width + (Math.random() * 20 - 10);
        c.targetY = ZONES.coffeeMachine.y * canvas.height + (Math.random() * 20 - 10);
        c.nextState = 'coffee';
        c.state = 'walking';
        c.bubble = 'Ambil kopi dulu ☕';
        c.bubbleTimer = 120;
      } else if (roll < 0.85) {
        // Go take a Nap / Sleep on bed
        const bed = ZONES.beds[Math.floor(Math.random() * ZONES.beds.length)];
        c.targetX = bed.x * canvas.width;
        c.targetY = bed.y * canvas.height;
        c.nextState = 'sleeping';
        c.state = 'walking';
        c.bubble = 'Ngantuk, tidur ah... 😴';
        c.bubbleTimer = 120;
      } else {
        // Go eat Soto Pak Yono
        c.targetX = ZONES.sotoTable.x * canvas.width + (Math.random() * 20 - 10);
        c.targetY = ZONES.sotoTable.y * canvas.height + (Math.random() * 20 - 10);
        c.nextState = 'eating';
        c.state = 'walking';
        c.bubble = 'Makan soto sapi 🍲';
        c.bubbleTimer = 120;
      }
    }

    // DRAWING SYSTEM
    function drawOffice() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const w = canvas.width;
      const h = canvas.height;

      // 1. Isometric-style Wood/Tile Floor
      const tileSize = 32;
      for (let x = 0; x < w; x += tileSize) {
        for (let y = 0; y < h; y += tileSize) {
          const isAlt = ((x / tileSize) + (y / tileSize)) % 2 === 0;
          ctx.fillStyle = isAlt ? '#1e293b' : '#0f172a';
          ctx.fillRect(x, y, tileSize, tileSize);
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x, y, tileSize, tileSize);
        }
      }

      // 2. Room Border Wall
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 4;
      ctx.strokeRect(8, 8, w - 16, h - 16);

      // 3. Draw Zones & Furniture
      // A. Soto Table (Top Left)
      drawTable(ZONES.sotoTable.x * w, ZONES.sotoTable.y * h, '🍲 Warung Soto', '#ea580c');
      
      // B. Coffee Machine (Top Right)
      drawObject(ZONES.coffeeMachine.x * w, ZONES.coffeeMachine.y * h, 36, 36, '#d97706', '☕');

      // C. Whiteboard (Top Center)
      drawWhiteboard(ZONES.waterCooler.x * w, ZONES.waterCooler.y * h);

      // D. Beds / Nap Lounge (Bottom)
      ZONES.beds.forEach((b, idx) => {
        drawBed(b.x * w, b.y * h, idx + 1);
      });

      // E. Work Desks (Center Area)
      ZONES.desks.forEach(d => {
        drawDesk(d.x * w, d.y * h, d.name);
      });

      // 4. Draw Characters
      characters.forEach(c => {
        drawPixelCharacter(c);
      });
    }

    function drawDesk(x, y, label) {
      // Wooden desk
      ctx.fillStyle = '#78350f';
      ctx.fillRect(x - 28, y - 16, 56, 32);
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 28, y - 16, 56, 32);

      // PC Monitor (Glowing blue)
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x - 12, y - 12, 24, 14);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(x - 10, y - 10, 20, 10);
      
      // Monitor stand & keyboard
      ctx.fillStyle = '#475569';
      ctx.fillRect(x - 4, y + 2, 8, 3);
      ctx.fillRect(x - 10, y + 6, 20, 5);

      // Label below desk
      ctx.font = '9px "Plus Jakarta Sans"';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y + 26);
    }

    function drawTable(x, y, label, color) {
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.arc(x, y, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('🍲', x, y + 5);

      ctx.font = '9px "Plus Jakarta Sans"';
      ctx.fillStyle = '#fed7aa';
      ctx.fillText('Snack Soto', x, y + 34);
    }

    function drawObject(x, y, w, h, color, icon) {
      ctx.fillStyle = color;
      ctx.fillRect(x - w/2, y - h/2, w, h);
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 1;
      ctx.strokeRect(x - w/2, y - h/2, w, h);

      ctx.font = '16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(icon, x, y + 6);
    }

    function drawWhiteboard(x, y) {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(x - 30, y - 14, 60, 26);
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 30, y - 14, 60, 26);

      // Lines on board
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(x - 22, y - 8, 30, 2);
      ctx.fillStyle = '#ea580c';
      ctx.fillRect(x - 22, y - 2, 44, 2);
      ctx.fillStyle = '#10b981';
      ctx.fillRect(x - 22, y + 4, 38, 2);
    }

    function drawBed(x, y, num) {
      // Bed frame
      ctx.fillStyle = '#334155';
      ctx.fillRect(x - 18, y - 22, 36, 44);
      // Mattress & Blanket
      ctx.fillStyle = '#6366f1';
      ctx.fillRect(x - 16, y - 10, 32, 30);
      // Pillow
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(x - 14, y - 20, 28, 8);
    }

    // DRAW CUTE PIXEL CHARACTER
    function drawPixelCharacter(c) {
      const x = Math.round(c.x);
      const y = Math.round(c.y);
      const bob = (c.state === 'walking') ? Math.sin(c.frame * Math.PI) * 2 : 0;

      // Shadow below character
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(x, y + 14, 12, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // State: Sleeping on bed
      if (c.state === 'sleeping') {
        // Draw character lying down
        ctx.fillStyle = c.hairColor;
        ctx.fillRect(x - 8, y - 8, 16, 12);
        ctx.fillStyle = '#ffe4e6';
        ctx.fillRect(x - 6, y - 4, 12, 8);

        // ZZZ Bubble floating
        const zOff = (Date.now() / 300) % 15;
        ctx.font = 'bold 12px "Plus Jakarta Sans"';
        ctx.fillStyle = '#a5b4fc';
        ctx.fillText('Zzz...', x + 10, y - 12 - zOff);
        return;
      }

      // Head (Skin)
      ctx.fillStyle = '#fed7aa'; // Cute skin tone
      ctx.fillRect(x - 7, y - 14 + bob, 14, 12);

      // Hair (Cute top bangs & side ponytail)
      ctx.fillStyle = c.hairColor;
      ctx.fillRect(x - 8, y - 18 + bob, 16, 7);
      ctx.fillRect(x - 9, y - 14 + bob, 3, 10);
      ctx.fillRect(x + 6, y - 14 + bob, 3, 10);

      // Special Elf Ears for Eliie
      if (c.id === 'eliie') {
        ctx.fillStyle = '#fed7aa';
        ctx.fillRect(x - 11, y - 12 + bob, 3, 3);
        ctx.fillRect(x + 8, y - 12 + bob, 3, 3);
      }

      // Eyes (Blinking animation)
      const isBlink = Math.sin(Date.now() / 800) > 0.95;
      if (isBlink) {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x - 4, y - 9 + bob, 3, 1);
        ctx.fillRect(x + 1, y - 9 + bob, 3, 1);
      } else {
        ctx.fillStyle = (c.id === 'eliie') ? '#0284c7' : '#0f172a';
        ctx.fillRect(x - 4, y - 10 + bob, 3, 3);
        ctx.fillRect(x + 1, y - 10 + bob, 3, 3);
      }

      // Blushing Cheeks
      ctx.fillStyle = '#fb7185';
      ctx.fillRect(x - 5, y - 6 + bob, 2, 2);
      ctx.fillRect(x + 3, y - 6 + bob, 2, 2);

      // Body / Cute Dress
      ctx.fillStyle = c.dressColor;
      ctx.fillRect(x - 6, y - 2 + bob, 12, 10);

      // Legs / Shoes
      ctx.fillStyle = '#475569';
      ctx.fillRect(x - 4, y + 8 + bob, 3, 5);
      ctx.fillRect(x + 1, y + 8 + bob, 3, 5);

      // Special props according to state
      if (c.state === 'coffee') {
        ctx.font = '10px Arial';
        ctx.fillText('☕', x + 8, y + bob);
      } else if (c.state === 'eating') {
        ctx.font = '10px Arial';
        ctx.fillText('🍲', x + 8, y + bob);
      } else if (c.state === 'working') {
        // Typing motion particles
        if (Math.random() < 0.3) {
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(x - 8 + Math.random() * 16, y - 22, 2, 2);
        }
      }

      // Name Label above head
      ctx.font = 'bold 9px "Plus Jakarta Sans"';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(c.name.split(' ')[0], x, y - 22 + bob);

      // Speech Bubble (If active)
      if (c.bubble && c.bubbleTimer > 0) {
        drawSpeechBubble(x, y - 36 + bob, c.bubble);
      }
    }

    function drawSpeechBubble(x, y, text) {
      ctx.font = '10px "Plus Jakarta Sans"';
      const textWidth = ctx.measureText(text).width;
      const padding = 6;
      const w = textWidth + padding * 2;
      const h = 18;

      // Bubble background
      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 1;
      
      ctx.beginPath();
      ctx.roundRect(x - w/2, y - h/2, w, h, 6);
      ctx.fill();
      ctx.stroke();

      // Tail
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(x - 3, y + h/2);
      ctx.lineTo(x + 3, y + h/2);
      ctx.lineTo(x, y + h/2 + 4);
      ctx.fill();

      // Text
      ctx.fillStyle = '#fef08a';
      ctx.textAlign = 'center';
      ctx.fillText(text, x, y + 3.5);
    }

    // CLICK HANDLER / INTERACTIVITY
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      let found = null;
      characters.forEach(c => {
        const dist = Math.hypot(c.x - clickX, c.y - clickY);
        if (dist < 28) {
          found = c;
        }
      });

      if (found) {
        selectedChar = found;
        openCard(found);
      } else {
        closeCard();
      }
    });

    function openCard(c) {
      const card = document.getElementById('charCard');
      document.getElementById('cardName').innerText = c.name;
      document.getElementById('cardAvatar').innerText = c.avatar;
      document.getElementById('cardRoleBadge').innerText = c.role;
      document.getElementById('cardStatus').innerText = `"${c.statusText}"`;

      const actionMap = {
        working: '💻 Sedang Fokus Bekerja di PC',
        walking: '🚶 Berjalan Keliling Kantor',
        coffee: '☕ Menikmati Secangkir Kopi Hangat',
        sleeping: '😴 Tidur Siang / Power Nap',
        eating: '🍲 Makan Soto Kudus Pak Yono'
      };
      document.getElementById('cardAction').innerText = actionMap[c.state] || 'Santai';

      card.classList.remove('translate-y-40', 'opacity-0', 'pointer-events-none');
      card.classList.add('translate-y-0', 'opacity-100');
    }

    function closeCard() {
      const card = document.getElementById('charCard');
      card.classList.add('translate-y-40', 'opacity-0', 'pointer-events-none');
      card.classList.remove('translate-y-0', 'opacity-100');
      selectedChar = null;
    }

    function boostCoffee() {
      if (!selectedChar) return;
      selectedChar.bubble = 'Makasih kopinya Ty! ☕✨';
      selectedChar.bubbleTimer = 200;
      selectedChar.speed = 2.4;
      setTimeout(() => { selectedChar.speed = 1.6; }, 5000);
      showToast(`${selectedChar.name} dapat energi kopi dari Ty! ⚡`);
      closeCard();
    }

    function petMember() {
      if (!selectedChar) return;
      selectedChar.bubble = (selectedChar.id === 'eliie') ? 'Seneng dielus Ty... 💕' : 'Hehehe makasih Ty! 🥰';
      selectedChar.bubbleTimer = 200;
      showToast(`Kamu mengelus kepala ${selectedChar.name}! 💖`);
      closeCard();
    }

    // CONTROL BAR FUNCTIONS
    function triggerBreakAll() {
      characters.forEach(c => {
        c.targetX = ZONES.coffeeMachine.x * canvas.width + (Math.random() * 40 - 20);
        c.targetY = ZONES.coffeeMachine.y * canvas.height + (Math.random() * 40 - 20);
        c.nextState = 'coffee';
        c.state = 'walking';
        c.bubble = 'Waktunya ngopi! ☕';
        c.bubbleTimer = 180;
      });
      showToast('Semua asisten istirahat ngopi bareng! ☕✨');
    }

    function triggerWorkAll() {
      characters.forEach(c => {
        const desk = ZONES.desks.find(d => d.id === c.deskId);
        if (desk) {
          c.targetX = desk.x * canvas.width;
          c.targetY = desk.y * canvas.height;
          c.nextState = 'working';
          c.state = 'walking';
          c.bubble = 'Fokus kerja lagi! 💻';
          c.bubbleTimer = 180;
        }
      });
      showToast('Semua asisten kembali fokus bekerja di meja! 💻🚀');
    }

    function triggerNapAll() {
      characters.forEach((c, idx) => {
        const bed = ZONES.beds[idx % ZONES.beds.length];
        c.targetX = bed.x * canvas.width;
        c.targetY = bed.y * canvas.height;
        c.nextState = 'sleeping';
        c.state = 'walking';
        c.bubble = 'Bobo dulu yaa... 💤';
        c.bubbleTimer = 180;
      });
      showToast('Semua asisten rebahan tidur siang! 😴💤');
    }

    function triggerSotoParty() {
      characters.forEach(c => {
        c.targetX = ZONES.sotoTable.x * canvas.width + (Math.random() * 40 - 20);
        c.targetY = ZONES.sotoTable.y * canvas.height + (Math.random() * 40 - 20);
        c.nextState = 'eating';
        c.state = 'walking';
        c.bubble = 'Pesta Soto Pak Yono! 🍲😋';
        c.bubbleTimer = 220;
      });
      showToast('Pesta Soto Kudus Pak Yono dimulai! 🍲🎉');
    }

    // MAIN GAME LOOP
    function gameLoop() {
      updateAI();
      drawOffice();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
