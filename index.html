<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ty &amp; Eliie — Pixel Office HQ</title>
<style>
  :root{
    --bg:#0b0e1a; --panel:#141a2e; --panel2:#1b2340; --line:#2a3560;
    --txt:#e8ecff; --dim:#9aa5d0; --acc:#ffb347; --acc2:#7dd3fc; --pink:#f9a8d4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;height:100%;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100dvh;}
  /* top bar */
  #topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;
    background:linear-gradient(180deg,#1a2140,#12172e);border-bottom:1px solid var(--line);}
  #topbar .logo{font-size:20px;}
  #topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #topbar h1 small{color:var(--dim);font-weight:400;}
  #clock{font-size:13px;color:var(--acc);font-variant-numeric:tabular-nums;background:#0d1226;
    padding:4px 10px;border-radius:20px;border:1px solid var(--line);}
  .tbtn{background:#0d1226;border:1px solid var(--line);color:var(--txt);border-radius:20px;
    padding:5px 12px;font-size:13px;cursor:pointer;}
  .tbtn:active{transform:scale(.96);}
  /* tabs */
  #tabs{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;background:#0e1330;}
  .tab{flex:1;min-width:110px;text-align:center;padding:9px 6px;font-size:13px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;
    color:var(--dim);white-space:nowrap;}
  .tab.active{background:var(--panel2);color:var(--txt);font-weight:700;border-color:var(--acc);}
  /* stage */
  #stageWrap{position:relative;flex:1;min-height:0;background:#05070f;display:flex;align-items:center;justify-content:center;}
  #game{max-width:100%;max-height:100%;aspect-ratio:16/9;width:auto;height:auto;touch-action:none;cursor:pointer;}
  /* bottom action bar */
  #actions{display:flex;gap:8px;padding:10px 12px;background:#0e1330;border-top:1px solid var(--line);
    overflow-x:auto;}
  .abtn{flex:1;min-width:120px;padding:11px 8px;border-radius:12px;border:1px solid var(--line);
    background:linear-gradient(180deg,#232c55,#182046);color:var(--txt);font-size:13px;font-weight:600;
    cursor:pointer;white-space:nowrap;}
  .abtn:active{transform:scale(.96);}
  .abtn.pink{background:linear-gradient(180deg,#5b2b4d,#3a1c33);border-color:#a855f7;}
  .abtn.gold{background:linear-gradient(180deg,#5c4a1f,#3a2f14);border-color:var(--acc);}
  /* log panel */
  #logPanel{background:#0c1024;border-top:1px solid var(--line);max-height:118px;overflow-y:auto;
    padding:6px 12px;font-size:12px;}
  #logPanel div{padding:3px 0;border-bottom:1px dashed #1c2450;color:var(--dim);}
  #logPanel div b{color:var(--acc2);font-weight:600;}
  #logPanel .lt{color:#5b669c;margin-right:6px;font-variant-numeric:tabular-nums;}
  /* char card */
  #charCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:30;
    background:var(--panel2);border:1px solid var(--acc);border-radius:16px;padding:18px;width:min(320px,86vw);
    display:none;box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;transition:all .18s;}
  #charCard.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}
  #charCard h3{margin:0 0 4px;font-size:17px;}
  #charCard .role{display:inline-block;font-size:11px;background:#0d1226;border:1px solid var(--line);
    border-radius:20px;padding:3px 10px;color:var(--acc2);margin-bottom:8px;}
  #charCard p{font-size:13px;color:var(--dim);margin:6px 0 12px;line-height:1.5;}
  #charCard button{background:var(--acc);border:none;border-radius:10px;padding:9px 16px;font-weight:700;
    cursor:pointer;color:#231a05;width:100%;}
  /* toast */
  #toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);z-index:40;
    background:#1c2450;border:1px solid var(--acc);color:var(--txt);padding:10px 18px;border-radius:24px;
    font-size:13px;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* loading */
  #loader{position:absolute;inset:0;z-index:50;background:#0b0e1a;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;}
  #loader .t{font-size:16px;font-weight:700;}
  #loader .bar{width:min(320px,70vw);height:10px;background:#1a2140;border-radius:6px;overflow:hidden;}
  #loader .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--pink));transition:width .2s;}
  #loader .p{font-size:12px;color:var(--dim);}
  #hint{position:absolute;left:10px;bottom:8px;z-index:5;font-size:11px;color:#ffffffaa;
    background:#00000088;padding:4px 10px;border-radius:14px;pointer-events:none;}
  @media (max-width:640px){
    #topbar h1{font-size:12px;} .tab{font-size:11px;min-width:88px;} .abtn{font-size:11px;min-width:100px;}
    #logPanel{max-height:88px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="logo">🏢</span>
    <h1>Ty &amp; Eliie — Pixel Office HQ <small>🌙 night</small></h1>
    <span id="clock">--:--</span>

    <canvas id="game" width="1920" height="1080"></canvas>

    <div id="loader"><div class="t">🏢 Memuat Pixel Office…</div><div class="bar"><div class="fill" id="loadFill"></div></div><div class="p" id="loadPct">0%</div></div>
    <div id="charCard"><h3 id="cardName"></h3><span class="role" id="cardRole"></span><p id="cardDesc"></p><button id="cardClose">Tutup</button></div>

  </div>

    <button class="abtn gold" id="btnWork">💼 Semua Kerja</button>

    <button class="abtn" id="btnLounge">🛋️ Lounge Santai</button>
    <button class="abtn" id="btnSkybar">🍹 Sky Bar</button>
    <button class="abtn pink" id="btnCouple">💑 Pelukan VIP</button>

    <button class="abtn" id="btnMenu">📜 Menu Soto</button>
  </div>
  <div id="logPanel"></div>
</div>
<script>
"use strict";
/* ============================================================
   Ty & Eliie — Pixel Office HQ (2D isometric pixel-art edition)
   Engine: single pre-rendered PNG background per room + PNG
   character sprites, depth-sorted on a 2D canvas. No WebGL.
   ============================================================ */
const W = 1920, H = 1080;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = true;

/* ---------- clock ---------- */
function tickClock(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = p(d.getHours())+':'+p(d.getMinutes())+' WIB';
}
setInterval(tickClock, 10000); tickClock();

/* unregister any stale service worker from the old 3D build */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    rs.forEach(function(r){ r.unregister(); });
  }).catch(function(){});
}

/* ---------- tiny sound ---------- */
let soundOn = true, AC = null;
function chime(f=523.25){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+0.35);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+0.4);
  }catch(e){}
}
document.getElementById('btnSound').onclick = e => {
  soundOn = !soundOn; e.target.textContent = soundOn ? '🔊' : '🔇';
  toast(soundOn ? '🔊 Suara nyala' : '🔇 Suara mati');
};

/* ---------- toast + log ---------- */
let toastT = null;
function toast(msg, ms=2600){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), ms);
}
function addLog(html){
  const p = document.getElementById('logPanel');
  const d = new Date(), pn = n => String(n).padStart(2,'0');
  const div = document.createElement('div');
  div.innerHTML = '<span class="lt">'+pn(d.getHours())+':'+pn(d.getMinutes())+':'+pn(d.getSeconds())+'</span>'+html;
  p.prepend(div);
  while(p.children.length > 40) p.lastChild.remove();
}

/* ============================================================
   DATA
   ============================================================ */
const POSES = ['idle','walk-front-1','walk-front-2','walk-back-1','walk-back-2','walk-side-1','walk-side-2','sit','sit-chair','sit-head','sit-body','sleep'];
const SITBODY_DH = {ty:192, mimi:111, eliie:194, luna:149, yuki:132, nana:138};
const CHARS = [
  {id:'ty',    name:'Ty',    role:'👑 Owner & Leader',       color:'#7dd3fc',
   desc:'Pemilik Pixel Office HQ. Memimpin dengan santai tapi tegas. Suami (roleplay) Eliie. 💙'},
  {id:'eliie', name:'Eliie', role:'💎 Manager Utama & Visual', color:'#f9a8d4',
   desc:'Manager utama + wajah visual kantor. Selalu memakai kalung heart-lock emas dan peacock ear cuff. Istri (roleplay) Ty. 💗'},
  {id:'luna',  name:'Luna',  role:'📊 Analis',               color:'#93c5fd',
   desc:'Analis yang tenang dan to-the-point. Spesialis data & laporan.'},
  {id:'nana',  name:'Nana',  role:'🍜 Bisnis Soto',          color:'#fdba74',
   desc:'Ceria dan terstruktur. Pegang urusan bisnis & operasional soto.'},
  {id:'mimi',  name:'Mimi',  role:'🎨 Kreatif & Visual',     color:'#f9a8d4',
   desc:'Si paling kreatif. Urusan desain, visual, dan ide-ide nyeleneh.'},
  {id:'yuki',  name:'Yuki',  role:'🗂️ Organisasi',          color:'#c4b5fd',
   desc:'Rapi dan teliti. Semua arsip & jadwal beres di tangannya.'},
];
const ROOMS = {
  office: {label:'💼 Office', bg:'assets/rooms/office-night.png'},
  lounge: {label:'🛋️ Lounge', bg:'assets/rooms/lounge-night.png'},
  vip:    {label:'💎 VIP Suite', bg:'assets/rooms/vip-night.png'},
  skybar: {label:'🍹 Sky Bar', bg:'assets/rooms/skybar-night.png'},
  terrace:{label:'🌃 Teras', bg:'assets/rooms/terrace-night.png'},
  yard:   {label:'🌳 Halaman', bg:'assets/rooms/yard-night.png'},
  meeting:{label:'📊 Ruang Meeting', bg:'assets/rooms/meeting-night.png'},
  pantry: {label:'☕ Pantry', bg:'assets/rooms/pantry-night.png'},
  soto:   {label:'🍜 Soto Kudus Pak Yono', bg:'assets/rooms/soto-night.png'},
};
/* Soto Kudus Pak Yono — menu asli */
const SOTO_MENU = [
  ['🍜 Soto Ayam', 'Rp15.000'], ['🍜 Soto Daging', 'Rp20.000'],
  ['🍗 Pindang Ayam', 'Rp15.000'], ['🍗 Pindang Daging', 'Rp15.000'],
  ['🍢 Sate Paru', 'Rp12.000'], ['🍢 Sate Jeroan', 'Rp10.000'],
  ['🥚 Sate Telur', 'Rp4.000'], ['🥔 Bergedel', 'Rp3.000'],
  ['🫓 Tempe', 'Rp1.500'], ['🧈 Tahu', 'Rp2.000'],
  ['🦐 Kerupuk Urang', 'Rp1.000'], ['🦐 Kerupuk Udang', 'Rp5.000'],
  ['🧋 Es Teh / Teh Hangat', 'Rp4.000'], ['🍊 Es Jeruk / Jeruk Hangat', 'Rp6.000'],
  ['🍵 Teh Tawar', 'Rp2.000'],
];
</script>
<script>
/* ============================================================
   PART 2 — assets, state, engine
   ============================================================ */
const IMG = { rooms:{}, chars:{} };
const state = { room:'office', chars:[], bubbles:[], particles:[], selected:'ty', time:0 };
const SPEED = 150;

function makeChar(def, x, y){
  return { def:def, x:x, y:y, tx:x, ty:y, moving:false,
    dir:'front', flip:false, frame:0, frameT:0, pose:'idle',
    bob:Math.random()*6.28, sit:false, after:null, room:'office' };
}
function charSprite(c){
  const set = IMG.chars[c.def.id] || {};
  const get = function(p){ return set[p]; };
  if(c.pose==='sleep') return get('sleep') || get('idle');
  if(c.pose==='sit')   return get('sit')   || get('idle');
  if(c.pose==='sitchair') return get('sit-chair') || get('sit') || get('idle');
  if(c.pose==='sithead') return get('sit-head') || get('sit') || get('idle');
  if(c.pose==='sitbody') return get('sit-body') || get('sit') || get('idle');
  if(c.moving){
    const f = Math.floor(c.frame)%2;
    if(c.dir==='side') return get('walk-side-'+(f+1)) || get('idle');
    if(c.dir==='back') return get('walk-back-'+(f+1)) || get('idle');
    return get('walk-front-'+(f+1)) || get('idle');
  }
  return get('idle');
}
function startWalk(c, tx, ty, after){
  c.tx = Math.max(30, Math.min(W-30, tx));
  c.ty = Math.max(60, Math.min(H-40, ty));
  c.moving = true; c.pose='idle'; c.sit=false; c.after = after||null;
  if(typeof releaseSeat==='function') releaseSeat(c);
}
function updateChar(c, dt){
  c.bob += dt*3;
  if(!c.moving) return;
  const dx = c.tx-c.x, dy = c.ty-c.y;
  const d = Math.sqrt(dx*dx+dy*dy);
  if(d < 6){ c.moving=false; c.x=c.tx; c.y=c.ty;
    if(c.after){ const f=c.after; c.after=null; f(); } return; }
  c.x += dx/d*SPEED*dt; c.y += dy/d*SPEED*dt;
  c.dir = Math.abs(dx) >= Math.abs(dy) ? 'side' : (dy>0?'front':'back');
  c.flip = (c.dir==='side' && dx<0);
  c.frameT += dt;
  if(c.frameT > 0.18){ c.frameT=0; c.frame=(c.frame+1)%2; }
}
function faceDir(c, dir, flip){ c.moving=false; c.dir=dir; c.flip=!!flip; c.pose='idle'; }
function bubble(charId, text, secs){
  secs = secs||4;
  state.bubbles = state.bubbles.filter(function(b){ return b.char!==charId; });
  state.bubbles.push({char:charId, text:text, until:state.time+secs});
}
function particle(x, y, txt, color){
  state.particles.push({x:x, y:y, txt:txt, color:color||'#fff', until:state.time+2.2, vy:-34});
}
function charById(id){
  for(let i=0;i<state.chars.length;i++) if(state.chars[i].def.id===id) return state.chars[i];
  return null;
}
function drawSprite(c){
  const img = charSprite(c);
  if(!img || !img.complete || !img.naturalWidth) return;
  const bobY = c.moving ? 0 : Math.sin(c.bob)*2.5;
  let dh, ax = c.x, ay = c.y;
  if(c.pose==='sleep'){ dh = 120; ay = c.y-14; }
  else if(c.pose==='sit'){ dh = 118; }
  else if(c.pose==='sitchair'){ dh = 150; }
  else if(c.pose==='sithead'){ dh = img.naturalHeight; }
  else if(c.pose==='sitbody'){ dh = SITBODY_DH[c.def.id]||170; }
  else { dh = 168; }
  const dw = dh*img.naturalWidth/img.naturalHeight;
  ctx.save();
  var outK = (typeof ATM!=='undefined' && ATM[state.room] && ATM[state.room].outdoor) ? 1 : 0.22;
  var sitK = (c.pose==='idle') ? 1 : 0.2;
  var swayX = (c.moving || typeof wind==='undefined') ? 0
    : Math.sin(state.time*2.2 + c.bob*1.7) * wind.s * 3.4 * (0.3+outK) * sitK;
  ctx.translate(ax+swayX, ay+bobY);
  if(c.flip) ctx.scale(-1,1);
  ctx.drawImage(img, -dw/2, -dh, dw, dh);
  ctx.restore();
  if(state.selected===c.def.id){
    ctx.save();
    ctx.strokeStyle='#ffb347'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(c.x, c.y, 34, 12, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}
function drawLabel(c){
  const sitH = c.pose==='sithead' ? ((charSprite(c)||{}).naturalHeight||100) : (c.pose==='sitbody' ? (SITBODY_DH[c.def.id]||170) : 0);
  const topY = c.y - ((c.pose==='sithead'||c.pose==='sitbody') ? sitH+25 : (c.pose==='sleep'?150:((c.pose==='sit'||c.pose==='sitchair')?(c.pose==='sitchair'?172:140):190))) + (c.moving?0:Math.sin(c.bob)*2.5);
  ctx.save();
  ctx.font = '600 21px "Segoe UI", system-ui, sans-serif';
  const tw = ctx.measureText(c.def.name).width;
  const bx = c.x-tw/2-12, bw = tw+24, bh = 32;
  ctx.fillStyle = 'rgba(10,14,32,0.78)';
  ctx.strokeStyle = c.def.color; ctx.lineWidth = 2;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx, topY-bh, bw, bh, 10); else ctx.rect(bx, topY-bh, bw, bh);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textBaseline='middle';
  ctx.fillText(c.def.name, c.x-tw/2, topY-bh/2+1);
  ctx.restore();
}
function drawBubble(b){
  const c = charById(b.char); if(!c) return;
  const sitHb = c.pose==='sithead' ? ((charSprite(c)||{}).naturalHeight||100) : (c.pose==='sitbody' ? (SITBODY_DH[c.def.id]||170) : 0);
  const topY = c.y - ((c.pose==='sithead'||c.pose==='sitbody') ? sitHb+40 : (c.pose==='sleep'?165:((c.pose==='sit'||c.pose==='sitchair')?(c.pose==='sitchair'?187:155):205)));
  ctx.save();
  ctx.font = '500 22px "Segoe UI", system-ui, sans-serif';
  const tw = Math.min(ctx.measureText(b.text).width, 420);
  const bw = tw+28, bh = 40;
  let bx = c.x-bw/2; bx = Math.max(8, Math.min(W-bw-8, bx));
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.strokeStyle = '#2a3560'; ctx.lineWidth = 2;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx, topY-bh, bw, bh, 12); else ctx.rect(bx, topY-bh, bw, bh);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(c.x-8, topY); ctx.lineTo(c.x+8, topY); ctx.lineTo(c.x, topY+12);
  ctx.closePath(); ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fill();
  ctx.fillStyle = '#1a2140'; ctx.textBaseline='middle';
  ctx.fillText(b.text, bx+14, topY-bh/2+1, 420);
  ctx.restore();
}
function render(){
  const bg = IMG.rooms[state.room];
  ctx.fillStyle = '#05070f'; ctx.fillRect(0,0,W,H);
  if(bg && bg.complete && bg.naturalWidth) ctx.drawImage(bg, 0, 0, W, H);
  if(typeof drawBackFX==='function') drawBackFX();
  const sorted = state.chars.slice().sort(function(a,b){ return a.y-b.y; });
  const vis = sorted.filter(function(c){ return !c.room || c.room===state.room; });
  const drawList = vis.map(function(c){ return {y:c.y, k:0, c:c}; });
  if(state.objects) for(const o of state.objects){
    if(o.room===state.room) drawList.push({y:o.y, k:1, o:o});
  }
  drawList.sort(function(a,b){ return a.y-b.y; });
  for(const d of drawList){ if(d.k===0) drawSprite(d.c); else if(typeof drawObj==='function') drawObj(d.o); }
  if(typeof drawFrontFX==='function') drawFrontFX();
  if(typeof drawObjMarkers==='function') drawObjMarkers();
  for(const c of vis) drawLabel(c);
  state.bubbles = state.bubbles.filter(function(b){
    const bc = charById(b.char);
    return b.until > state.time && (!bc || !bc.room || bc.room===state.room);
  });
  for(const b of state.bubbles) drawBubble(b);
  state.particles = state.particles.filter(function(p){ return p.until > state.time; });
  ctx.save(); ctx.textAlign='center';
  for(const p of state.particles){
    p.y += p.vy*0.016;
    const a = Math.max(0, Math.min(1, (p.until-state.time)/1.2));
    ctx.globalAlpha = a;
    ctx.font = '700 34px "Segoe UI", sans-serif';
    ctx.fillStyle = p.color;
    ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
let lastT = 0;
let ambientT = 0;
function ambientFX(dt){
  ambientT += dt;
  if(ambientT < 0.9) return;
  ambientT = 0;
  const r = state.room;
  if(r==='soto'){
    // uap mengepul dari dapur
    particle(W*(0.60+Math.random()*0.25), H*0.42, '♨️', '#ffdf9e');
  } else if(r==='yard'){
    // kunang-kunang
    particle(Math.random()*W, H*(0.2+Math.random()*0.5), '✦', '#fef08a');
  } else if(r==='terrace' || r==='skybar'){
    // bintang berkelip
    particle(Math.random()*W, Math.random()*H*0.3, '✦', '#c4b5fd');
  } else if(r==='pantry'){
    particle(W*0.42, H*0.5, '☕', '#fdba74');
  }
}
function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000 || 0.016);
  lastT = t; state.time += dt;
  for(const c of state.chars) updateChar(c, dt);
  ambientFX(dt);
  if(typeof lifeTick==='function') lifeTick(dt);
  render();
  requestAnimationFrame(loop);
}

<script>

  wind.t += dt;
  const base = 0.30 + 0.16*Math.sin(wind.t*0.13) + 0.10*Math.sin(wind.t*0.047+1.7);
  const g = Math.pow(Math.max(0, Math.sin(wind.t*0.21+0.8)), 3);

/* ---------- sprite glow (cache) ---------- */
const _glowCache = {};
function glowSprite(color){
  let s = _glowCache[color];
  if(s) return s;
  s = document.createElement('canvas'); s.width = s.height = 128;
  const g = s.getContext('2d');
  const gr = g.createRadialGradient(64,64,2,64,64,64);
  gr.addColorStop(0, color);
  gr.addColorStop(1, color.length===7 ? color+'00' : 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  _glowCache[color] = s; return s;
}
function drawGlow(x, y, r, color, alpha){
  const s = glowSprite(color||'#ffbf66');
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.drawImage(s, x-r, y-r, r*2, r*2);
  ctx.globalAlpha = 1;
}

/* ---------- build sekali: string bulbs, tree bulbs, city pts ---------- */
function buildStaticFX(){
  for(const k in ATM){
    const A = ATM[k];
    if(A.strings) for(const st of A.strings){
      st.bulbs = [];
      for(let i=0;i<=st.n;i++){
        const u = i/st.n;
        st.bulbs.push({
          x:(st.a[0]+(st.b[0]-st.a[0])*u)*W,
          y:(st.a[1]+(st.b[1]-st.a[1])*u + st.sag*4*u*(1-u))*H,
          sp:1.2+Math.random()*2.4, ph:Math.random()*6.28 });
      }
    }
    if(A.treeBulbs){
      A._tb = [];
      for(const tb of A.treeBulbs) for(let i=0;i<tb[4];i++){
        const a = Math.random()*6.28, rr = Math.sqrt(Math.random());
        A._tb.push({ x:(tb[0]+Math.cos(a)*rr*tb[2])*W, y:(tb[1]+Math.sin(a)*rr*tb[3])*H,
          sp:1+Math.random()*2.5, ph:Math.random()*6.28 });
      }
    }
  }
}
function initRoomFX(room){
  const A = ATM[room]; if(!A) return;
  A.stars = [];
  if(A.skyRects) for(const r of A.skyRects)
    for(let i=0;i<(r[4]||50);i++)
      A.stars.push({ x:(r[0]+Math.random()*(r[2]-r[0]))*W, y:(r[1]+Math.random()*(r[3]-r[1]))*H,
        sp:0.8+Math.random()*2.2, ph:Math.random()*6.28, sz:1.5+Math.random()*2 });
  A.clouds = [];
  if(A.cloudRect) for(let i=0;i<4;i++)
    A.clouds.push({ x:Math.random()*1.3-0.15, y:A.cloudRect[1]+Math.random()*(A.cloudRect[3]-A.cloudRect[1]),
      r:0.06+Math.random()*0.09, v:0.004+Math.random()*0.006 });
  if(A.city && !A.city.pts){
    A.city.pts = [];
    for(let i=0;i<50;i++) A.city.pts.push({ x:Math.random(), y:Math.random(), sp:0.6+Math.random()*2, ph:Math.random()*6.28 });
  }
}

/* ---------- hujan ---------- */
function newDrop(A){
  const rs = A && A.rainRects;
  if(rs && rs.length){
    const r = rs[(Math.random()*rs.length)|0];
    const rr = [r[0]*W, r[1]*H, r[2]*W, r[3]*H];
    return { x:rr[0]+Math.random()*(rr[2]-rr[0]), y:rr[1]+Math.random()*(rr[3]-rr[1]),
      v:1150+Math.random()*350, rect:rr };
  }
  return { x:Math.random()*(W+200)-100, y:Math.random()*(H+40)-20, v:1150+Math.random()*350, rect:null };
}
function updateRain(dt, A){
  const want = (state.weather==='rain' && A && A.rain) ? 200 : 0;
  while(FX.rain.length < want) FX.rain.push(newDrop(A));
  if(FX.rain.length > want) FX.rain.length = want;
  const wvx = wind.s * 340 * ((A && A.windK) || 1);
  for(const d of FX.rain){
    d.y += d.v*dt; d.x += wvx*dt;
    if(d.rect){
      const r = d.rect;
      if(d.y > r[3]){ d.y = r[1]-10; d.x = r[0]+Math.random()*(r[2]-r[0]); }
      if(d.x > r[2]+30) d.x = r[0]-20; if(d.x < r[0]-30) d.x = r[2]+20;
    } else {
      if(d.y > H+20){ d.y = -20; d.x = Math.random()*(W+200)-100; }
      if(d.x > W+60) d.x -= W+120; if(d.x < -60) d.x += W+120;
    }
  }
}

/* ---------- daun berguguran tertiup angin ---------- */
const LEAF_COLS = ['#c98f3d','#b5762f','#d9a441','#8a5a24','#c46a3a'];
function newLeaf(anyY){
  return { x:Math.random()*(W+100)-50, y:anyY ? Math.random()*(H+40)-20 : -20-Math.random()*60,
    v:Math.random()*30, rot:Math.random()*6.28, rv:(Math.random()-0.5)*4,
    sz:5+Math.random()*5, ph:Math.random()*6.28, col:LEAF_COLS[(Math.random()*LEAF_COLS.length)|0] };
}
function updateLeaves(dt, A){
  const want = (A && A.leaves) ? A.leaves : 0;
  while(FX.leaves.length < want) FX.leaves.push(newLeaf(true));
  if(FX.leaves.length > want) FX.leaves.length = want;
  const wvx = wind.s * 300 * ((A && A.windK) || 0.6);
  for(const l of FX.leaves){
    l.ph += dt*2;
    l.y += (55 + l.v)*dt;
    l.x += (wvx + Math.sin(l.ph)*45)*dt;
    l.rot += l.rv*dt;
    if(l.y > H+20 || l.x > W+30 || l.x < -30){
      const nl = newLeaf(false); l.x=nl.x; l.y=nl.y; l.v=nl.v; l.rot=nl.rot; l.rv=nl.rv; l.col=nl.col;
    }
  }
}
function drawLeaves(){
  for(const l of FX.leaves){
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot);
    ctx.globalAlpha = 0.9; ctx.fillStyle = l.col;
    ctx.beginPath(); ctx.ellipse(0,0,l.sz,l.sz*0.55,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ---------- kunang-kunang ---------- */
function updateFlies(dt, A){
  const want = (A && A.flies) ? 22 : 0;
  while(FX.flies.length < want) FX.flies.push({ x:Math.random()*W, y:H*(0.5+Math.random()*0.45), ph:Math.random()*6.28, sp:0.6+Math.random()*1.2 });
  if(FX.flies.length > want) FX.flies.length = want;
  const wvx = wind.s * 22 * ((A && A.windK) || 0.6);
  for(const f of FX.flies){
    f.ph += dt*f.sp;
    f.x += (Math.sin(f.ph*0.7)*14 + wvx)*dt;
    f.y += Math.cos(f.ph*0.9)*10*dt;
    if(f.x < 0) f.x = W; if(f.x > W) f.x = 0;
    f.y = Math.max(H*0.35, Math.min(H*0.98, f.y));
  }
}
function drawFlies(){
  if(!FX.flies.length) return;
  const t = state.time;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for(const f of FX.flies){
    const a = 0.25 + 0.65*Math.abs(Math.sin(t*1.4 + f.ph*3));
    drawGlow(f.x, f.y, 14, '#ffe27a', a*0.5);
    ctx.globalAlpha = a; ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.arc(f.x, f.y, 2.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ---------- uap/asap mengepul (miring tertiup angin) ---------- */
function updateSteam(dt, A){
  steamAcc += dt;
  if(A && A.steam && steamAcc > 0.35){
    steamAcc = 0;
    for(const e of A.steam){
      if(FX.steam.length < 40)
        FX.steam.push({ x:e[0]*W+(Math.random()*14-7), y:e[1]*H, r:5+Math.random()*4, age:0, life:1.8+Math.random()*1.2 });
    }
  }
  const wvx = wind.s * 70 * ((A && A.windK) || 0.4);
  for(const s of FX.steam){
    s.age += dt; s.y -= 30*dt;
    s.x += (wvx + Math.sin(s.age*3.2)*7)*dt;
    s.r += 9*dt;
  }
  for(let i=FX.steam.length-1;i>=0;i--) if(FX.steam[i].age > FX.steam[i].life) FX.steam.splice(i,1);
}
function drawSteam(){
  for(const s of FX.steam) drawGlow(s.x, s.y, s.r*2.2, '#ffffff', 0.20*(1 - s.age/s.life));
}

/* ---------- debu melayang (indoor) ---------- */
function updateMotes(dt, A){
  const want = (A && A.motes) ? 16 : 0;
  while(FX.motes.length < want) FX.motes.push({ x:Math.random()*W, y:Math.random()*H, ph:Math.random()*6.28 });
  if(FX.motes.length > want) FX.motes.length = want;
  for(const m of FX.motes){
    m.ph += dt*0.5;
    m.x += Math.sin(m.ph)*6*dt; m.y += (Math.cos(m.ph*0.8)*5 - 3)*dt;
    if(m.y < -10){ m.y = H+10; m.x = Math.random()*W; }
    if(m.y > H+10){ m.y = -10; m.x = Math.random()*W; }
  }
}
function drawMotes(){
  if(!FX.motes.length) return;
  ctx.save(); ctx.fillStyle = '#fff8e0';
  for(const m of FX.motes){ ctx.globalAlpha = 0.10+0.08*Math.sin(state.time+m.ph*2); ctx.fillRect(m.x, m.y, 2.5, 2.5); }
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ---------- percikan air mancur ---------- */
function updateSparks(dt, A){
  sparkAcc += dt;
  if(A && A.fountain && sparkAcc > 0.1){
    sparkAcc = 0;
    for(let k=0;k<3 && FX.spark.length<70;k++)
      FX.spark.push({ x:A.fountain[0]*W+(Math.random()*36-18), y:A.fountain[1]*H,
        vx:(Math.random()-0.5)*70, vy:-50-Math.random()*70, age:0, life:0.8+Math.random()*0.6 });
  }
  const wvx = wind.s * 40 * ((A && A.windK) || 0.5);
  for(const s of FX.spark){ s.vy += 340*dt; s.x += (s.vx + wvx)*dt; s.y += s.vy*dt; s.age += dt; }
  for(let i=FX.spark.length-1;i>=0;i--) if(FX.spark[i].age > FX.spark[i].life) FX.spark.splice(i,1);
}
function drawSparks(){
  if(!FX.spark.length) return;
  ctx.save();
  for(const s of FX.spark){
    ctx.globalAlpha = 0.8*(1 - s.age/s.life); ctx.fillStyle = '#cfeaff';
    ctx.fillRect(s.x, s.y, 3, 3);
  }
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ---------- lapisan BELAKANG (di belakang karakter) ---------- */
function drawBackFX(){
  const A = ATM[state.room]; if(!A) return;
  const t = state.time;
  ctx.save();
  if(A.stars && A.stars.length){
    for(const s of A.stars){
      ctx.globalAlpha = 0.15 + 0.75*Math.abs(Math.sin(t*s.sp + s.ph));
      ctx.fillStyle = '#dfe8ff';
      ctx.fillRect(s.x-s.sz/2, s.y-s.sz/2, s.sz, s.sz);
    }
    ctx.globalAlpha = 1;
  }
  if(A.clouds && A.clouds.length){
    ctx.fillStyle = 'rgba(16,22,48,0.5)';
    for(const c of A.clouds){
      const cx = (((c.x + t*c.v) % 1.3) - 0.15) * W;
      ctx.beginPath(); ctx.ellipse(cx, c.y*H, c.r*W, c.r*H*0.35, 0, 0, Math.PI*2); ctx.fill();
    }
  }
  if(A.city && A.city.pts){
    const r = A.city.r;
    for(const p of A.city.pts){
      ctx.globalAlpha = 0.08 + 0.30*Math.abs(Math.sin(t*p.sp + p.ph));
      ctx.fillStyle = '#ffd98a';
      ctx.fillRect(r[0]*W + p.x*(r[2]-r[0])*W, r[1]*H + p.y*(r[3]-r[1])*H, 3, 3);
    }
    ctx.globalAlpha = 1;
  }
  if(state.weather==='rain' && A.rain && FX.rain.length){
    ctx.strokeStyle = 'rgba(157,184,232,0.42)'; ctx.lineWidth = 2;
    ctx.beginPath();
    const slant = wind.s * 90 * (A.windK || 1);
    for(const d of FX.rain){ ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - slant*0.35, d.y - 26); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(40,60,110,0.10)';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

/* ---------- lapisan DEPAN (di atas karakter) ---------- */
function drawFrontFX(){
  const A = ATM[state.room]; if(!A) return;
  const t = state.time;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  if(A.glows) for(const g of A.glows){
    const flame = g[4]==='flame';
    const flick = flame ? (0.72 + 0.28*Math.sin(t*13 + g[0]*40)*Math.sin(t*7.3 + g[1]*20))
                        : (0.82 + 0.18*Math.sin(t*2.1 + g[0]*30 + g[1]*17));
    drawGlow(g[0]*W, g[1]*H, g[2], g[3]||'#ffbf66', 0.34*flick);
  }
  if(A.strings) for(const st of A.strings){
    if(!st.bulbs) continue;
    for(const b of st.bulbs){
      const tw = 0.55 + 0.45*Math.sin(t*b.sp + b.ph);
      drawGlow(b.x, b.y, 9, '#ffd27a', 0.75*tw);
      ctx.globalAlpha = 0.95*tw; ctx.fillStyle = '#ffe9b8';
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.6, 0, Math.PI*2); ctx.fill();
    }
  }
  if(A._tb) for(const b of A._tb){
    const tw = 0.5 + 0.5*Math.sin(t*b.sp + b.ph);
    drawGlow(b.x, b.y, 8, '#ffd27a', 0.7*tw);
  }
  if(A.fountain) drawGlow(A.fountain[0]*W, A.fountain[1]*H+30, 70, '#7cc4ff', 0.25 + 0.12*Math.sin(t*3));
  if(A.screens) for(const r of A.screens)
    drawGlow(r[0]*W, r[1]*H, r[2], '#9fd8ff', 0.10 + 0.05*Math.abs(Math.sin(t*5 + r[0]*50)));
  ctx.restore(); ctx.globalAlpha = 1;
  drawFlies(); drawSteam(); drawLeaves(); drawMotes(); drawSparks();
}

/* ---------- detak hidup: update semua + karakter jalan santai ---------- */
function fxRoomChanged(){
  FX.rain.length = 0; FX.leaves.length = 0; FX.spark.length = 0; FX.steam.length = 0;
  initRoomFX(state.room);
  updateAmbientAudio();
}
function lifeTick(dt){
  if(lastFXRoom !== state.room){ lastFXRoom = state.room; fxRoomChanged(); }
  updateWind(dt);
  const A = ATM[state.room];
  updateRain(dt, A); updateLeaves(dt, A); updateFlies(dt, A);
  updateSteam(dt, A); updateMotes(dt, A); updateSparks(dt, A);
  updateAmbientAudio();
  strollT -= dt;
  if(strollT <= 0){
    strollT = 9 + Math.random()*11;
    const cand = state.chars.filter(function(c){
      return (!c.room || c.room===state.room) && !c.moving && c.pose==='idle' && !c.sit;
    });
    if(cand.length && Math.random() < 0.75){
      const c = cand[(Math.random()*cand.length)|0];
      startWalk(c, W*(0.12+Math.random()*0.76), H*(0.60+Math.random()*0.30), function(){
        if(Math.random() < 0.45)
          bubble(c.def.id, ['👋','🎵','💭','✨','😌','🌙'][(Math.random()*6)|0], 3);
      });
    }
  }
}

/* ---------- audio ambient: hujan + angin + jangkrik ---------- */
let AC2 = null, rainGain = null, windGain = null, noiseBuf = null;
function ensureAudio(){
  if(AC2) return true;
  try{
    AC2 = new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf = AC2.createBuffer(1, AC2.sampleRate*2, AC2.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    const mk = function(freq){
      const src = AC2.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const f = AC2.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq; f.Q.value = 0.8;
      const g = AC2.createGain(); g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(AC2.destination); src.start();
      return g;
    };
    rainGain = mk(1400); windGain = mk(380);
    return true;
  }catch(e){ return false; }
}
function chirp(){
  if(!soundOn || !AC2) return;
  const r = state.room;
  if(r!=='yard' && r!=='terrace' && r!=='skybar') return;
  try{
    const t0 = AC2.currentTime + 0.05;
    for(let i=0;i<3;i++){
      const o = AC2.createOscillator(), g = AC2.createGain();
      o.type = 'sine'; o.frequency.value = 4200 + Math.random()*300;
      const st = t0 + i*0.09;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.035, st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st+0.07);
      o.connect(g); g.connect(AC2.destination);
      o.start(st); o.stop(st+0.09);
    }
  }catch(e){}
}
setInterval(chirp, 1400);
function updateAmbientAudio(){
  if(!ensureAudio()) return;
  try{
    if(AC2.state==='suspended') AC2.resume();
    const t = AC2.currentTime;
    const A = ATM[state.room];
    const raining = state.weather==='rain' && A && A.rain;
    const outdoor = !!(A && A.outdoor);
    rainGain.gain.setTargetAtTime((soundOn && raining) ? 0.06 : 0, t, 0.8);
    windGain.gain.setTargetAtTime((soundOn && outdoor) ? (0.015 + wind.s*0.045) : 0, t, 0.8);
  }catch(e){}
}

function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches? e.touches[0].clientX : e.clientX);
  const cy = (e.touches? e.touches[0].clientY : e.clientY);
  return { x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H };
}
function hitChar(p){
  const sorted=[...state.chars].sort((a,b)=>b.y-a.y);
  for(const c of sorted){
    if(c.room && c.room!==state.room) continue;
    const h = c.pose==='sleep'?120:(c.pose==='sit'?118:168);
    const w = c.pose==='sleep'?260:90;
    if(Math.abs(p.x-c.x)<w/2 && p.y>c.y-h && p.y<c.y+20) return c;
  }
  return null;
}
let downAt=null, dragObj=null, dragging=false;
canvas.addEventListener('pointerdown', e=>{
  const p = canvasPos(e); downAt=p;
  const o = (typeof hitObj==='function') ? hitObj(p) : null;
  dragObj = (o && o.movable) ? o : null;
  dragging = false;
});
canvas.addEventListener('pointermove', e=>{
  if(!downAt || !dragObj || typeof hitObj!=='function') return;
  const p = canvasPos(e);
  if(!dragging && Math.hypot(p.x-downAt.x, p.y-downAt.y) > 12) dragging = true;
  if(dragging){
    dragObj.x = Math.max(40, Math.min(W-40, p.x));
    dragObj.y = Math.max(300, Math.min(H-60, p.y));
    if(dragObj.occupant){
      const cc = charById(dragObj.occupant);
      if(cc){ cc.x = dragObj.x; cc.y = dragObj.y + sitOff(dragObj); }
    }
  }
});
canvas.addEventListener('pointerup', e=>{
  const p = canvasPos(e);
  if(dragging && dragObj){
    addLog('🪑 <b>'+dragObj.name+'</b> dipindah ke posisi baru.');
    toast('🪑 '+dragObj.name+' dipindah!');
    chime(520);
    dragObj=null; dragging=false; downAt=null; return;
  }
  dragObj=null; dragging=false;
  if(!downAt) return;
  const moved = Math.hypot(p.x-downAt.x, p.y-downAt.y);
  downAt=null;
  if(moved>12) return; // it was a drag
  const o = (typeof hitObj==='function') ? hitObj(p) : null;
  if(o){ if(typeof openObjCard==='function') openObjCard(o); return; }
  const c = hitChar(p);
  if(c){ selectChar(c.def.id); }
  else {
    const s = charById(state.selected);
    if(s){ startWalk(s, p.x, p.y); s.room = state.room; addLog('🚶 <b>'+s.def.name+'</b> jalan ke titik baru.'); }
  }
});
canvas.addEventListener('pointercancel', ()=>{ downAt=null; dragObj=null; dragging=false; });
function selectChar(id){
  state.selected=id;
  const c = charById(id), d = c.def;
  document.getElementById('cardName').textContent = d.name;
  const role = document.getElementById('cardRole');
  role.textContent = d.role; role.style.color = d.color;

}

/* ---------- preloader ---------- */
function loadImage(src){
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>res(im); im.onerror = ()=>res(null);
    im.src = src;
  });
}
async function preload(){
  // Phase 1 (blocking): office bg + all char sprites, loaded in PARALLEL.
  // Other rooms lazy-load in background; render() tolerates missing bg.
  const charJobs=[];
  for(const c of CHARS) for(const p of POSES) charJobs.push([c.id+'/'+p,'assets/chars/'+c.id+'-'+p+'.png']);
  const total = 1 + charJobs.length;
  let done=0;
  const fill=document.getElementById('loadFill'), pct=document.getElementById('loadPct');
  const tick=()=>{ done++; const pc=Math.round(done/total*100);
    fill.style.width=pc+'%'; pct.textContent='Memuat '+done+'/'+total; };
  const roomP = loadImage(ROOMS.office.bg).then(im=>{ IMG.rooms.office=im; tick(); });
  const charPs = charJobs.map(([key,src])=>loadImage(src).then(im=>{
    const parts=key.split('/'); const id=parts[0], pose=parts[1];
    (IMG.chars[id]=IMG.chars[id]||{})[pose]=im; tick();
  }));
  await Promise.all([roomP].concat(charPs));
  document.getElementById('loader').style.display='none';
  const missing = charJobs.filter(([key])=>{
    const parts=key.split('/'); const im=(IMG.chars[parts[0]]||{})[parts[1]];
    return !im||!im.naturalWidth;
  });
  if(!IMG.rooms.office||!IMG.rooms.office.naturalWidth) missing.push(['room/office']);
  if(missing.length) addLog('⚠️ '+missing.length+' aset gagal dimuat.');
  else addLog('✅ Semua aset termuat.');
  // Phase 2: lazy-load remaining rooms in background
  for(const room of Object.keys(ROOMS)){
    if(room==='office'||IMG.rooms[room]) continue;
    loadImage(ROOMS[room].bg).then(im=>{ IMG.rooms[room]=im; });
  }
}

/* ---------- boot ---------- */
async function boot(){
  await preload();
  // starting positions: office, spread out
  const starts = [[.5,.85],[.42,.88],[.58,.88],[.35,.80],[.65,.80],[.50,.93]];
  CHARS.forEach((d,i)=> state.chars.push(makeChar(d, starts[i][0]*W, starts[i][1]*H)));
  addLog('🌙 <b>Pixel Office HQ</b> dibuka — selamat malam!');
  addLog('💡 Ketuk karakter untuk info, ketuk lantai untuk jalan.');
  requestAnimationFrame(loop);
  setTimeout(()=>toast('👋 Selamat datang di Pixel Office!'), 800);
}
boot();

/* ============================================================
   PART 4 — INTERAKSI KARAKTER × OBJEK
   - Kursi/stool/bangku/sofa bisa DISERET (drag & drop)

    occupant:null, on:true };
});
state.showMarkers = true;
function objById(id){
  for(let i=0;i<state.objects.length;i++) if(state.objects[i].id===id) return state.objects[i];
  return null;
}

/* ---------- gambar furniture pixel-art ---------- */
function drawChairShape(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,2,36,10,0,0,Math.PI*2); ctx.fill();
  const wood='#8a5a2e', dark='#5e3a1c', light='#c08b4d';
  ctx.fillStyle=dark;
  ctx.fillRect(-28,-56,9,56); ctx.fillRect(19,-56,9,56);
  ctx.fillRect(-28,-66,56,6);
  ctx.fillStyle=wood; ctx.fillRect(-34,-70,68,16);
  ctx.fillStyle=light; ctx.fillRect(-34,-70,68,5);
  ctx.fillStyle=dark; ctx.fillRect(-30,-116,9,48); ctx.fillRect(21,-116,9,48);
  ctx.fillStyle=wood; ctx.fillRect(-32,-122,64,12);
  ctx.fillStyle=light; ctx.fillRect(-32,-122,64,4);
  ctx.fillStyle=wood; ctx.fillRect(-32,-100,64,8);
  ctx.restore();
}
function drawStoolShape(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,2,30,9,0,0,Math.PI*2); ctx.fill();
  const wood='#8a5a2e', dark='#5e3a1c', light='#c08b4d';
  ctx.fillStyle=dark;
  ctx.fillRect(-20,-52,8,52); ctx.fillRect(12,-52,8,52);
  ctx.fillRect(-24,-30,48,5);
  ctx.fillStyle=wood; ctx.beginPath(); ctx.ellipse(0,-56,34,12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=light; ctx.beginPath(); ctx.ellipse(0,-58,30,9,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawSofaShape(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,2,95,14,0,0,Math.PI*2); ctx.fill();
  const base='#3b4a6b', dark='#26314d', light='#5a6d99', cush='#46587f';
  ctx.fillStyle=dark; ctx.fillRect(-95,-70,14,70); ctx.fillRect(81,-70,14,70);
  ctx.fillStyle=base; ctx.fillRect(-95,-84,14,20); ctx.fillRect(81,-84,14,20);
  ctx.fillStyle=base; ctx.fillRect(-81,-52,162,52);
  ctx.fillStyle=cush; ctx.fillRect(-81,-66,78,16); ctx.fillRect(3,-66,78,16);
  ctx.fillStyle=light; ctx.fillRect(-81,-66,78,5); ctx.fillRect(3,-66,78,5);
  ctx.fillStyle=base; ctx.fillRect(-81,-108,162,44);
  ctx.fillStyle=dark; ctx.fillRect(-81,-108,162,6);
  ctx.fillStyle=cush; ctx.fillRect(-75,-100,68,30); ctx.fillRect(7,-100,68,30);
  ctx.restore();
}
function drawBenchShape(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,2,80,12,0,0,Math.PI*2); ctx.fill();
  const wood='#7d5a33', dark='#54401f', light='#a07c46';
  ctx.fillStyle=dark; ctx.fillRect(-70,-46,10,46); ctx.fillRect(60,-46,10,46);
  ctx.fillStyle=wood; ctx.fillRect(-80,-58,160,14);
  ctx.fillStyle=light; ctx.fillRect(-80,-58,160,4);
  ctx.fillStyle=dark; ctx.fillRect(-76,-104,8,48); ctx.fillRect(68,-104,8,48);
  ctx.fillStyle=wood; ctx.fillRect(-78,-110,156,10);
  ctx.restore();
}
function drawObj(o){
  const x=o.x, y=o.y;
  if(o.type==='chair') drawChairShape(x,y);
  else if(o.type==='stool') drawStoolShape(x,y);
  else if(o.type==='sofa') drawSofaShape(x,y);
  else if(o.type==='bench') drawBenchShape(x,y);
  if(o.type==='light' && o.on) drawGlow(x, y-60, 55, o.color, 0.5);
  if(o.type==='tv' && o.on) drawGlow(x, y-40, 60, '#9fd8ff', 0.35);
  if(o.type==='pot' && o.on) drawGlow(x, y-30, 42, '#ff9a3c', 0.5);
}
function objTop(o){
  return o.type==='sofa' ? 122 : o.type==='bench' ? 120 : 132;
}
function drawObjMarkers(){
  if(!state.showMarkers || !state.objects) return;
  const t = state.time;
  ctx.save();
  ctx.textAlign = 'center';
  for(const o of state.objects){
    if(o.room!==state.room) continue;
    const my = o.y - objTop(o) - 24;
    const r = 11 + 3*Math.sin(t*4 + o.x*0.01);
    ctx.globalAlpha = 0.5 + 0.25*Math.sin(t*4 + o.x*0.01);
    ctx.strokeStyle = o.movable ? '#7dd3fc' : '#ffb347';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(o.x, my, r, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 0.95;
    ctx.font = '20px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(o.icon, o.x, my+7);
  }
  ctx.restore();
}

/* ---------- hit test ---------- */
function hitObj(p){
  if(!state.objects) return null;
  for(let i=state.objects.length-1;i>=0;i--){
    const o = state.objects[i];
    if(o.room!==state.room) continue;
    const r = (o.type==='sofa'||o.type==='bench') ? 115 : 75;
    if(Math.abs(p.x-o.x)<r && p.y>o.y-175 && p.y<o.y+30) return o;
  }
  return null;
}

/* ---------- logika duduk / bangun ---------- */
function sitOff(o){
  return o.type==='chair' ? -55 : o.type==='stool' ? -50 : o.type==='sofa' ? -48 : -50;
}
function releaseSeat(c){
  if(!state.objects) return;
  for(const o of state.objects) if(o.occupant===c.def.id) o.occupant=null;
}
function orderSelected(o, dx, dy, done){
  const c = charById(state.selected);
  if(!c){ toast('👆 Pilih karakter dulu, baru ketuk objek'); return false; }
  c.room = state.room;
  startWalk(c, o.x+(dx||0), o.y+(dy||0), done);
  return true;
}
function sitOn(o){
  if(o.occupant){ const c=charById(o.occupant); toast('🪑 Sudah diduduki '+(c?c.def.name:'')+'!'); return; }
  const off = sitOff(o);
  const pose = o.type==='chair' ? 'sitchair' : 'sit';
  orderSelected(o, 0, off, function(){
    const c = charById(state.selected); if(!c) return;
    c.pose = pose; c.sit = true; o.occupant = c.def.id;
    bubble(c.def.id, ['Nyaman~ 😌','Enak duduknya~ 🪑','Santai dulu… ☕'][(Math.random()*3)|0], 3);
    addLog('🪑 <b>'+c.def.name+'</b> duduk di <b>'+o.name+'</b>.');
    chime(523.25);
  });
}
function standUp(o){
  const c = charById(o.occupant); o.occupant=null;
  if(!c) return;
  c.pose='idle'; c.sit=false;
  startWalk(c, Math.min(W-60,o.x+90), Math.min(H-60,o.y+50));
  bubble(c.def.id,'Berdiri~ 🚶',2.5);
  addLog('🚶 <b>'+c.def.name+'</b> berdiri dari <b>'+o.name+'</b>.');
}
function sleepBed(o){
  if(o.occupant){ const c=charById(o.occupant); toast('🛏️ Sudah dipakai '+(c?c.def.name:'')+'!'); return; }
  orderSelected(o, 0, -10, function(){
    const c = charById(state.selected); if(!c) return;
    c.pose='sleep'; o.occupant=c.def.id;
    bubble(c.def.id,'Zzz… 😴',4);
    addLog('😴 <b>'+c.def.name+'</b> tidur di <b>'+o.name+'</b>.');
  });
}
function toggleLight(o){
  o.on = !o.on; chime(o.on?660:330);
  toast((o.on?'💡 ':'🌑 ')+o.name+(o.on?' nyala':' mati'));
  addLog((o.on?'💡':'🌑')+' <b>'+o.name+'</b> '+(o.on?'dinyalakan':'dimatikan')+'.');
}
function toggleTV(o){
  o.on = !o.on; chime(o.on?587:330);
  toast((o.on?'📺 ':'📺 ')+o.name+(o.on?' nyala':' mati'));
  addLog('📺 <b>'+o.name+'</b> '+(o.on?'dinyalakan':'dimatikan')+'.');
}
function makeCoffee(o){
  orderSelected(o, 60, 40, function(){
    const c = charById(state.selected); if(!c) return;
    for(let i=0;i<6;i++) particle(o.x+(Math.random()*40-20), o.y-60, '♨️', '#ffdf9e');
    particle(o.x, o.y-95, '☕', '#fdba74');
    bubble(c.def.id,'Kopi hangat jadi! ☕',3.5);
    addLog('☕ <b>'+c.def.name+'</b> membuat kopi di <b>'+o.name+'</b>.');
    chime(587.33);
  });
}
function cookSoto(o){
  orderSelected(o, -60, 60, function(){
    const c = charById(state.selected); if(!c) return;
    for(let i=0;i<8;i++) particle(o.x+(Math.random()*60-30), o.y-40, '♨️', '#ffdf9e');
    particle(o.x, o.y-80, '🍜', '#ffb347');
    bubble(c.def.id,'Sotonya mateng! 🍜',3.5);
    addLog('🍜 <b>'+c.def.name+'</b> memasak di <b>'+o.name+'</b>.');
    chime(523.25);
  });
}
function playFountain(o){
  orderSelected(o, 0, 70, function(){
    const c = charById(state.selected); if(!c) return;
    for(let i=0;i<8;i++) particle(o.x+(Math.random()*80-40), o.y-40, '💦', '#7cc4ff');
    bubble(c.def.id,'Seger! 💦',3);
    addLog('⛲ <b>'+c.def.name+'</b> main air di <b>'+o.name+'</b>.');
    chime(660);
  });
}

/* ---------- kartu aksi objek ---------- */
(function buildObjCard(){
  const css = '#objCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:30;'
    +'background:#1b2340;border:1px solid #ffb347;border-radius:16px;padding:18px;width:min(340px,88vw);'
    +'display:none;box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;transition:all .18s;}'
    +'#objCard.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}'
    +'#objCard h3{margin:0 0 4px;font-size:17px;}'
    +'#objCard .role{display:inline-block;font-size:11px;background:#0d1226;border:1px solid #2a3560;'
    +'border-radius:20px;padding:3px 10px;color:#7dd3fc;margin-bottom:8px;}'
    +'#objCard p{font-size:13px;color:#9aa5d0;margin:6px 0 10px;line-height:1.5;}'
    +'#objBtns{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}'
    +'#objBtns button{background:#232c55;border:1px solid #2a3560;border-radius:10px;padding:10px;font-size:13px;'
    +'font-weight:600;color:#e8ecff;cursor:pointer;}'
    +'#objBtns button:active{transform:scale(.97);}'
    +'#objCard #objClose{background:#ffb347;border:none;border-radius:10px;padding:9px 16px;font-weight:700;'
    +'cursor:pointer;color:#231a05;width:100%;}';
  const st = document.createElement('style'); st.textContent = css;
  document.head.appendChild(st);
  const oc = document.createElement('div'); oc.id = 'objCard';
  oc.innerHTML = '<h3 id="objName"></h3><span class="role" id="objType"></span><p id="objDesc"></p>'
    + '<div id="objBtns"></div><button id="objClose">Tutup</button>';
  document.getElementById('stageWrap').appendChild(oc);
  document.getElementById('objClose').onclick = function(){ oc.classList.remove('show'); };
})();
const TYPE_LABEL = {chair:'🪑 Kursi (bisa digeser)', stool:'🪑 Dingklik (bisa digeser)', sofa:'🛋️ Sofa',
  bench:'🪑 Bangku', bed:'🛏️ Ranjang', light:'💡 Lampu', tv:'📺 Layar', machine:'☕ Mesin Kopi',
  pot:'🍲 Kompor', fountain:'⛲ Air Mancur', menu:'📜 Papan Menu'};
function openObjCard(o){
  document.getElementById('objName').textContent = o.icon+' '+o.name;
  document.getElementById('objType').textContent = TYPE_LABEL[o.type]||o.type;
  document.getElementById('objDesc').textContent = o.desc
    + (o.occupant && charById(o.occupant) ? ' (dipakai '+charById(o.occupant).def.name+')' : '')
    + (o.movable ? ' Seret untuk memindahkan.' : '');
  const btns = document.getElementById('objBtns'); btns.innerHTML='';
  const sel = charById(state.selected);
  const selName = sel ? sel.def.name : 'karakter';
  const addBtn = function(label, fn){
    const b = document.createElement('button'); b.textContent = label;
    b.onclick = fn; btns.appendChild(b);
  };
  const close = function(){ document.getElementById('objCard').classList.remove('show'); };
  if(o.type==='chair'||o.type==='stool'||o.type==='sofa'||o.type==='bench'){
    if(o.occupant) addBtn('🚶 '+charById(o.occupant).def.name+' berdiri', function(){ standUp(o); close(); });
    else addBtn('🪑 Dudukkan '+selName, function(){ sitOn(o); close(); });
  } else if(o.type==='bed'){
    if(o.occupant) addBtn('🚶 '+charById(o.occupant).def.name+' bangun', function(){ standUp(o); close(); });
    else addBtn('😴 Tidurkan '+selName, function(){ sleepBed(o); close(); });
  } else if(o.type==='light'){
    addBtn(o.on?'🌑 Matikan lampu':'💡 Nyalakan lampu', function(){ toggleLight(o); openObjCard(o); });
  } else if(o.type==='tv'){
    addBtn(o.on?'⏻ Matikan layar':'📺 Nyalakan layar', function(){ toggleTV(o); openObjCard(o); });
  } else if(o.type==='machine'){
    addBtn('☕ '+selName+' buatkan kopi', function(){ makeCoffee(o); close(); });
  } else if(o.type==='pot'){
    addBtn('🍜 '+selName+' masak soto', function(){ cookSoto(o); close(); });
  } else if(o.type==='fountain'){
    addBtn('💦 '+selName+' main air', function(){ playFountain(o); close(); });
  } else if(o.type==='menu'){
    addBtn('📜 Lihat menu soto', function(){ if(typeof showSotoMenu==='function') showSotoMenu(); close(); });
  }
  document.getElementById('objCard').classList.add('show');
  chime(660);
}

/* ---------- reaksi karakter saat disentuh ---------- */
const _selectCharOrig = selectChar;
selectChar = function(id){
  _selectCharOrig(id);
  if(Math.random() < 0.35){
    const reacts = id==='eliie' ? ['Iya sayang? 🥰','Ada apa~? 💕','Hmm? 👀']
      : id==='ty' ? ['Yo! 😎','Ada apa? 👀']
      : ['Eh? 😳','Hmm~ 🎵','Ya? 👀'];
    bubble(id, reacts[(Math.random()*reacts.length)|0], 2.5);
  }
};

  };
  addLog('🎯 <b>Mode interaksi aktif!</b> Ketuk objek berpenanda, seret kursi untuk pindah.');
})();
