    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateClock() {
      const now = new Date();
      const el = document.getElementById('office-time');
      if (el) el.innerText = now.toLocaleTimeString('id-ID');

    setInterval(updateClock, 1000);
    updateClock();

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.remove('-translate-y-12', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        t.classList.add('-translate-y-12', 'opacity-0');
        t.classList.remove('translate-y-0', 'opacity-100');

    }

    // AI BEHAVIOR LOOP
    function updateAI() {
      characters.forEach(c => {
        c.frame += 0.08;

        if (c.bubbleTimer > 0) {
          c.bubbleTimer--;
        } else if (Math.random() < 0.003) {
          if (c.id === 'ty') {
            const list = ['Eliie istriku tercinta ❤️', 'Semua divisi siap deploy! 🚀', 'Soto Pak Yono mantap 🍲', 'Sayang, istirahat yuk 💕'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 220;
          } else if (c.id === 'eliie') {
            const list = ['Sayang Ty banget... 🥰', 'Nana, cek rekap soto ya! 🍲', 'Luna, pastikan VPS 0 bug! 💻', 'Mimi, rilis reels viral! ✨'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 220;
          } else {
            const quotes = {
              nana: ['Soto sapi siap! 🍲', 'Omzet naik terus 📈', 'Ngopi dulu ah ☕', 'Siap Bos!'],
              luna: ['Compiling code... 🚀', '0 Bug di VPS 😎', 'Deploy sukses 💻', 'Siap Bos!'],
              mimi: ['Warna ini estetik 🎨', 'Reels FYP! 🎬', 'Nonton TV di lounge 🛋️', 'Siap Bos!'],
              yuki: ['Obsidian synced 📖', 'Catatan beres 🍵', 'Rapat produktif', 'Siap Bos.']
            };
            const list = quotes[c.id] || ['Semangat!'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 180;
          }
        }

        const dx = c.targetX - c.x;
        const dy = c.targetY - c.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 3) {
          c.x += (dx / dist) * c.speed;
          c.y += (dy / dist) * c.speed;
          c.isWalking = true;
        } else {
          c.x = c.targetX;
          c.y = c.targetY;
          c.isWalking = false;
        }
      });
    }

    // DRAWING SYSTEM (TRUE 2.5D ISOMETRIC VECTOR GATHER.TOWN / HABBO STYLE)
    function drawOffice() {
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, w, h);

      ctx.save();
      ctx.translate(w / 2 + cameraView.x, h / 2 + cameraView.y);
      ctx.scale(cameraView.scale, cameraView.scale);

      // 1. ISOMETRIC FLOOR BLUEPRINT (Large Off-White Square Tiles with Dark Wood Trim)
      ctx.fillStyle = '#12141c';
      ctx.fillRect(-450, -350, 900, 700);

      // 2. ROOMS CONSTRUCTION (2.5D DIMETRIC PROJECTION)
      
      // A. CENTER: MEETING ROOM (Conference Room in TikTok)
      drawIsometricRoom(0, -10, 320, 220, '#efefea', '#e5c298', '📊 CONFERENCE ROOM');
      drawGatherConferenceTable(0, -10);

      // B. TOP-LEFT: VIP MASTER SUITE
      drawIsometricRoom(-280, -190, 220, 160, '#fdf2f8', '#fda4af', '👑 VIP MASTER SUITE');
      drawGatherKingBed(-280, -210);

    // DRAW ISOMETRIC ROOM (OFF-WHITE TILES + WOOD TRIM + ACOUSTIC SLAT WALL)
    function drawIsometricRoom(x, y, w, h, floorColor, trimColor, label) {
      ctx.save();
      
      // Shadow below room
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.beginPath();
      ctx.roundRect(x - w / 2 + 6, y - h / 2 + 6, w, h, 12);
      ctx.fill();

      // Floor Tile Surface
      ctx.fillStyle = floorColor;
      ctx.beginPath();
      ctx.roundRect(x - w / 2, y - h / 2, w, h, 12);
      ctx.fill();

      // Grid Lines on Floor (Tile Grout)
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.06)';
      ctx.lineWidth = 1;
      const step = 28;
      for (let gx = x - w / 2 + step; gx < x + w / 2; gx += step) {
        ctx.beginPath();
        ctx.moveTo(gx, y - h / 2);
        ctx.lineTo(gx, y + h / 2);
        ctx.stroke();
      }
      for (let gy = y - h / 2 + step; gy < y + h / 2; gy += step) {
        ctx.beginPath();
        ctx.moveTo(x - w / 2, gy);
        ctx.lineTo(x + w / 2, gy);
        ctx.stroke();
      }

      // Wooden Trim Border
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Acoustic Slat Wall Backing (Top Border)
      ctx.fillStyle = '#e5c298'; // Light oak wood slat
      ctx.fillRect(x - w / 2 + 2, y - h / 2 + 2, w - 4, 18);
      ctx.fillStyle = '#a66a38';
      for (let sx = x - w / 2 + 6; sx < x + w / 2 - 6; sx += 8) {
        ctx.fillRect(sx, y - h / 2 + 2, 2, 18);
      }

      // Room Header Label
      ctx.font = 'bold 9px "Inter"';
      ctx.fillStyle = '#1e1e1e';
      ctx.textAlign = 'left';
      ctx.fillText(label, x - w / 2 + 12, y - h / 2 + 14);

      ctx.restore();
    }

    // DRAW BLACK MESH SWIVEL CHAIR
    function drawSwivelChair(x, y, dir) {

      ctx.beginPath();
      ctx.arc(x, y + 10, 10, 0, Math.PI * 2);
      ctx.fill();

      // Base Wheels
      ctx.strokeStyle = '#1e1e1e';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 8, y + 8);
      ctx.lineTo(x + 8, y + 8);
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + 12);
      ctx.stroke();

      // Mesh Seat
      ctx.fillStyle = '#2d2d2d';
      ctx.beginPath();
      ctx.roundRect(x - 10, y - 4, 20, 16, 4);

      ctx.strokeStyle = '#1e1e1e';

      // Mesh High Backrest
      ctx.fillStyle = '#1e1e1e';
      if (dir === 'up') {
        ctx.fillRect(x - 9, y + 8, 18, 5);
      } else if (dir === 'down') {
        ctx.fillRect(x - 9, y - 9, 18, 5);
      } else if (dir === 'left') {
        ctx.fillRect(x + 7, y - 7, 5, 14);

    // DRAW HABBO / GATHER.TOWN STYLIZED ISOMETRIC AVATARS (EXACT 1:1 TIKTOK STYLE)
    function drawGatherAvatar(c) {
      const x = Math.round(c.x);
      const y = Math.round(c.y);
      const bob = c.isWalking ? Math.sin(c.frame * 4) * 3 : 0;

      ctx.save();

      // 1. Soft Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath();
      ctx.ellipse(x, y + 16, 12, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 2. Body / Pants & Shirt
      ctx.fillStyle = c.pantsColor;
      ctx.fillRect(x - 6, y + 6 + bob, 12, 10); // Legs/Pants

      ctx.fillStyle = c.shirtColor;
      ctx.beginPath();
      ctx.roundRect(x - 8, y - 4 + bob, 16, 12, 4);
      ctx.fill();
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 3. Head & Face
      ctx.fillStyle = c.skinColor;
      ctx.beginPath();
      ctx.arc(x, y - 12 + bob, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 4. Stylized Hair
      ctx.fillStyle = c.hairColor;
      ctx.beginPath();
      ctx.arc(x, y - 14 + bob, 12, Math.PI * 0.85, Math.PI * 2.15);
      ctx.fill();

      // Special Accessories
      if (c.hasCrown) {
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('👑', x, y - 24 + bob);
      }
      if (c.hasElfEars) {
        ctx.fillStyle = c.skinColor;
        ctx.beginPath();
        ctx.moveTo(x - 11, y - 12 + bob);
        ctx.lineTo(x - 17, y - 15 + bob);
        ctx.lineTo(x - 11, y - 9 + bob);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + 11, y - 12 + bob);
        ctx.lineTo(x + 17, y - 15 + bob);
        ctx.lineTo(x + 11, y - 9 + bob);
        ctx.fill();
        ctx.stroke();
      }

      // Eyes
      ctx.fillStyle = '#1e1e1e';
      ctx.beginPath();
      ctx.arc(x - 4, y - 11 + bob, 1.8, 0, Math.PI * 2);
      ctx.arc(x + 4, y - 11 + bob, 1.8, 0, Math.PI * 2);
      ctx.fill();

      // Blushing Cheeks
      ctx.fillStyle = '#fb7185';
      ctx.beginPath();
      ctx.arc(x - 5, y - 8 + bob, 1.5, 0, Math.PI * 2);
      ctx.arc(x + 5, y - 8 + bob, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // 5. EXACT TIKTOK FLOATING NAME PILL TAG BELOW CHARACTER
      ctx.fillStyle = c.badgeBg;
      ctx.beginPath();
      ctx.roundRect(x - 38, y + 20 + bob, 76, 16, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Colored Status Dot
      ctx.fillStyle = c.dotColor;
      ctx.beginPath();
      ctx.arc(x - 28, y + 28 + bob, 3, 0, Math.PI * 2);
      ctx.fill();

      // Badge Text
      ctx.font = 'bold 8px "Inter"';
      ctx.fillStyle = c.badgeText;
      ctx.textAlign = 'left';
      ctx.fillText(c.badge, x - 22, y + 31 + bob);

      // 6. EXACT TIKTOK WHITE FLOATING SPEECH BUBBLE
      if (c.bubble && c.bubbleTimer > 0) {
        drawTikTokSpeechBubble(x, y - 38 + bob, c.bubble);
      }

      ctx.restore();
    }

    // DRAW EXACT TIKTOK WHITE ROUNDED SPEECH BUBBLE (WITH STATUS ICON)
    function drawTikTokSpeechBubble(x, y, text) {
      ctx.font = '500 10px "Inter"';
      const textWidth = ctx.measureText(text).width;
      const bw = textWidth + 24;
      const bh = 24;

      // Drop Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.roundRect(x - bw / 2 + 2, y - bh / 2 + 2, bw, bh, 6);
      ctx.fill();

      // White Bubble Background
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(x - bw / 2, y - bh / 2, bw, bh, 6);
      ctx.fill();
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Little Pointer Tail
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(x - 4, y + bh / 2);
      ctx.lineTo(x + 4, y + bh / 2);
      ctx.lineTo(x, y + bh / 2 + 5);
      ctx.fill();
      ctx.strokeStyle = '#2a2a2a';
      ctx.beginPath();
      ctx.moveTo(x - 4, y + bh / 2);
      ctx.lineTo(x, y + bh / 2 + 5);
      ctx.lineTo(x + 4, y + bh / 2);
      ctx.stroke();

      // Black Text
      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'center';
      ctx.fillText(text, x, y + 3.5);
    }

    // TOUCH / CLICK INTERACTION
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const clickX = ((e.clientX - rect.left) - (canvas.width / dpr / 2 + cameraView.x)) / cameraView.scale;
      const clickY = ((e.clientY - rect.top) - (canvas.height / dpr / 2 + cameraView.y)) / cameraView.scale;

      let found = null;
      characters.forEach(c => {
        const dist = Math.hypot(c.x - clickX, c.y - clickY);
        if (dist < 32) {
          found = c;
        }
      });

      if (found) {
        selectedChar = found;
        openCard(found);
      } else {
        closeCard();
      }
    });

    function openCard(c) {
      const card = document.getElementById('charCard');
      document.getElementById('cardName').innerText = c.name;
      document.getElementById('cardAvatar').innerText = c.avatar;
      document.getElementById('cardRoleBadge').innerText = c.badge;
      document.getElementById('cardStatus').innerText = `"${c.statusText}"`;
      document.getElementById('cardAction').innerText = `Status: ${c.state.toUpperCase()}`;

      card.classList.remove('translate-y-48', 'opacity-0', 'pointer-events-none');
      card.classList.add('translate-y-0', 'opacity-100');
    }

    function closeCard() {
      const card = document.getElementById('charCard');
      card.classList.add('translate-y-48', 'opacity-0', 'pointer-events-none');
      card.classList.remove('translate-y-0', 'opacity-100');
      selectedChar = null;
    }
