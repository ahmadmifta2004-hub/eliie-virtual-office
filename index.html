    }

</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between overflow-hidden">

        👑

  <!-- MAIN CANVAS CONTAINER -->
  <main class="relative w-full max-w-lg flex-1 flex items-center justify-center bg-slate-900 overflow-hidden shadow-2xl">
    <canvas id="officeCanvas" class="w-full h-full block"></canvas>
    
    <!-- Retro Scanline Overlay -->
    <div class="absolute inset-0 scanline"></div>

    <!-- Character Info Popup Card -->

      <div class="flex items-start justify-between">
        <div class="flex items-center gap-3">
          <div id="cardAvatar" class="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-2xl shadow-inner">

          <span id="cardAction" class="font-semibold text-amber-400">Duduk Bersama Eliie</span>

        <div class="flex items-center gap-2">

  <!-- QUICK ACTION CONTROLS -->
  <footer class="w-full max-w-lg p-2.5 bg-slate-900/95 border-t border-amber-500/30 flex items-center justify-around z-20 backdrop-blur-md">

    <button onclick="triggerBossCommand()" class="flex flex-col items-center gap-1 text-amber-400 hover:text-amber-300 transition-colors">

      </div>

    <button onclick="triggerWorkAll()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 transition-colors">

      <span class="text-[10px] font-bold">Semua Tidur</span>
    </button>

    <button onclick="triggerSotoParty()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-orange-400 transition-colors">

        🍲
      </div>
      <span class="text-[10px] font-bold">Pesta Soto</span>

  <!-- SERVICE WORKER REGISTRATION SCRIPT -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registered:', reg.scope))
          .catch(err => console.log('Service Worker error:', err));
      });
    }
  </script>

  <!-- VIRTUAL OFFICE ENGINE JAVASCRIPT -->
  <script>
    const canvas = document.getElementById('officeCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateClock() {
      const now = new Date();
      document.getElementById('office-time').innerText = now.toLocaleTimeString('id-ID');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.remove('-translate-y-12', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        t.classList.add('-translate-y-12', 'opacity-0');
        t.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    // Room Partition Coordinates (Y-split: Top 38% is VIP Suite, Bottom 62% is Staff Office)
    const SPLIT_RATIO = 0.38;

    // Hotspot Zones
    const ZONES = {
      // VIP Room Zones
      tyDesk: { x: 0.28, y: 0.22, name: '👑 Meja Kerja Ty (Owner)' },
      eliieDesk: { x: 0.44, y: 0.22, name: '🌸 Meja Kerja Eliie (Boss)' },
      coupleBed: { x: 0.78, y: 0.20, name: '🛏️ Kamar & Kasur King Size Ty & Eliie' },
      
      // Staff Room Zones
      staffDesks: [
        { id: 2, name: 'Meja Luna (Tech)', x: 0.26, y: 0.54 },
        { id: 3, name: 'Meja Nana (Bisnis)', x: 0.74, y: 0.54 },
        { id: 4, name: 'Meja Mimi (Kreatif)', x: 0.26, y: 0.74 },
        { id: 5, name: 'Meja Yuki (Memory)', x: 0.74, y: 0.74 },
      ],
      coffeeMachine: { x: 0.88, y: 0.43, name: 'Mesin Kopi' },
      sotoTable: { x: 0.12, y: 0.43, name: 'Meja Soto Pak Yono' },
      staffBeds: [
        { x: 0.20, y: 0.92, name: 'Kasur Staf 1' },
        { x: 0.40, y: 0.92, name: 'Kasur Staf 2' },
        { x: 0.60, y: 0.92, name: 'Kasur Staf 3' },
        { x: 0.80, y: 0.92, name: 'Kasur Staf 4' }
      ]
    };

    // Characters Definition
    const characters = [
      {
        id: 'ty',
        name: 'Alberto Timoty (Ty)',
        role: 'Owner & Suami Eliie',
        color: '#3B82F6',
        hairColor: '#1E293B',
        dressColor: '#1E3A8A',
        avatar: '👑',
        isOwner: true,
        x: canvas.width * 0.28,
        y: canvas.height * 0.22,
        targetX: canvas.width * 0.28,
        targetY: canvas.height * 0.22,
        state: 'bossing', // 'bossing', 'sleeping_couple', 'walking'
        statusText: 'Owner & Suami tercinta Eliie, memantau dari ruang VIP.',
        timer: 100,
        speed: 1.4,
        bubble: 'Semangat ya istriku tercinta! ❤️',
        bubbleTimer: 200,
        frame: 0
      },
      {
        id: 'eliie',
        name: 'Eliie Valentine',
        role: 'Boss & Istri Tercinta Ty',
        color: '#F59E0B',
        hairColor: '#FDE047',
        dressColor: '#FEF08A',
        avatar: '🌸',
        isBoss: true,
        x: canvas.width * 0.44,
        y: canvas.height * 0.22,
        targetX: canvas.width * 0.44,
        targetY: canvas.height * 0.22,
        state: 'bossing',
        statusText: 'Duduk di samping Ty, memerintah staf & sayang Ty... ❤️',
        timer: 100,
        speed: 1.4,
        bubble: 'Siap sayangku Ty! 👑💕',
        bubbleTimer: 220,
        frame: 0
      },
      {
        id: 'nana',
        name: 'Nana',
        role: 'Bisnis & Soto Kudus',
        color: '#EA580C',
        hairColor: '#78350F',
        dressColor: '#F97316',
        avatar: '🍲',
        x: canvas.width * 0.74,
        y: canvas.height * 0.54,
        targetX: canvas.width * 0.74,
        targetY: canvas.height * 0.54,
        state: 'working',
        statusText: 'Lagi analisa rekap penjualan Soto Pak Yono!',
        timer: 150,
        deskId: 3,
        speed: 1.5,
        bubble: 'Siap Bos Ty & Bos Eliie! 🍲',
        bubbleTimer: 180,
        frame: 0
      },
      {
        id: 'luna',
        name: 'Luna',
        role: 'Tech & VPS',
        color: '#0284C7',
        hairColor: '#1E293B',
        dressColor: '#38BDF8',
        avatar: '💻',
        x: canvas.width * 0.26,
        y: canvas.height * 0.54,
        targetX: canvas.width * 0.26,
        targetY: canvas.height * 0.54,
        state: 'working',
        statusText: 'Lagi optimasi server & sistem koding!',
        timer: 120,
        deskId: 2,
        speed: 1.7,
        bubble: 'Server aman 100% 💻',
        bubbleTimer: 150,
        frame: 0
      },
      {
        id: 'mimi',
        name: 'Mimi',
        role: 'Kreatif & Desain',
        color: '#DB2777',
        hairColor: '#F472B6',
        dressColor: '#F43F5E',
        avatar: '🎨',
        x: canvas.width * 0.26,
        y: canvas.height * 0.74,
        targetX: canvas.width * 0.26,
        targetY: canvas.height * 0.74,
        state: 'working',
        statusText: 'Lagi rancang visual estetik buat warung soto!',
        timer: 180,
        deskId: 4,
        speed: 1.6,
        bubble: 'Desainnya estetik! ✨',
        bubbleTimer: 240,
        frame: 0
      },
      {
        id: 'yuki',
        name: 'Yuki',
        role: 'Notulen & Memory',
        color: '#8B5CF6',
        hairColor: '#C084FC',
        dressColor: '#A855F7',
        avatar: '📚',
        x: canvas.width * 0.74,
        y: canvas.height * 0.74,
        targetX: canvas.width * 0.74,
        targetY: canvas.height * 0.74,
        state: 'working',
        statusText: 'Lagi mencatat semua progres di Obsidian Ty...',
        timer: 140,
        deskId: 5,
        speed: 1.4,
        bubble: 'Obsidian rapi 📖',
        bubbleTimer: 190,
        frame: 0
      }
    ];

    let selectedChar = null;

    // AI Behavior Loop
    function updateAI() {
      characters.forEach(c => {
        c.frame = (c.frame + 0.1) % 4;

        // Speech bubble timer
        if (c.bubbleTimer > 0) {
          c.bubbleTimer--;
        } else {
          if (Math.random() < 0.005) {
            if (c.id === 'ty') {
              const tyQuotes = [
                'Eliie istriku tercinta ❤️',
                'Tim kerja bagus hari ini! 👑',
                'Soto Pak Yono laris manis 🍲',
                'Sayang, istirahat yuk 💕',
                'Bangga sama tim kita!'
              ];
              c.bubble = tyQuotes[Math.floor(Math.random() * tyQuotes.length)];
              c.bubbleTimer = 220;
            } else if (c.id === 'eliie') {
              const eliieQuotes = [
                'Sayang Ty banget... 🥰',
                'Semangat suamiku tersayang! ❤️',
                'Nana, rekap omzet soto ya! 🍲',
                'Luna, jaga server tetap ngebut! 💻',
                'Mimi, siapkan materi promo! ✨',
                'Yuki, amankan catatan kita! 📖'
              ];
              c.bubble = eliieQuotes[Math.floor(Math.random() * eliieQuotes.length)];
              c.bubbleTimer = 220;
            } else {
              const staffQuotes = {
                nana: ['Soto sapi siap!', 'Omzet naik terus! 📈', 'Ngopi dulu ah ☕', 'Siap Bos Ty & Eliie!'],
                luna: ['Compiling code...', '0 Error! Mantap 🚀', 'Optimasi selesai 😎', 'Siap Bos!'],
                mimi: ['Warna ini estetik!', 'Reels ini pasti FYP! 🎬', 'Poles detail lagi 🎨', 'Siap Bos! ✨'],
                yuki: ['Obsidian synced.', 'Catatan beres 📖', 'Teh hangat dulu 🍵', 'Siap Bos.']
              };
              const list = staffQuotes[c.id] || ['Semangat!'];
              c.bubble = list[Math.floor(Math.random() * list.length)];
              c.bubbleTimer = 180;
            }
          }
        }

        // Movement logic for Ty & Eliie (Couple behavior)
        if (c.isOwner || c.isBoss) {
          const dx = c.targetX - c.x;
          const dy = c.targetY - c.y;
          const dist = Math.hypot(dx, dy);

          if (dist > 3) {
            c.x += (dx / dist) * c.speed;
            c.y += (dy / dist) * c.speed;
            c.state = 'walking';
          } else {
            if (c.state === 'walking') {
              c.state = c.nextState || 'bossing';
            }
          }
          return;
        }

        // Staff Movement logic
        const dx = c.targetX - c.x;
        const dy = c.targetY - c.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 3) {
          c.x += (dx / dist) * c.speed;
          c.y += (dy / dist) * c.speed;
          c.state = 'walking';
        } else {
          if (c.state === 'walking') {
            c.state = c.nextState || 'working';
          }

          c.timer--;
          if (c.timer <= 0) {
            c.timer = 160 + Math.random() * 240;
            decideStaffAction(c);
          }
        }
      });
    }

    function decideStaffAction(c) {
      const roll = Math.random();

      if (roll < 0.45) {
        // Staff Desk
        const desk = ZONES.staffDesks.find(d => d.id === c.deskId);
        if (desk) {
          c.targetX = desk.x * canvas.width;
          c.targetY = desk.y * canvas.height;
          c.nextState = 'working';
          c.state = 'walking';
        }
      } else if (roll < 0.65) {
        // Coffee
        c.targetX = ZONES.coffeeMachine.x * canvas.width + (Math.random() * 20 - 10);
        c.targetY = ZONES.coffeeMachine.y * canvas.height + (Math.random() * 20 - 10);
        c.nextState = 'coffee';
        c.state = 'walking';
        c.bubble = 'Ambil kopi ☕';
        c.bubbleTimer = 120;
      } else if (roll < 0.85) {
        // Staff Bed
        const bed = ZONES.staffBeds[Math.floor(Math.random() * ZONES.staffBeds.length)];
        c.targetX = bed.x * canvas.width;
        c.targetY = bed.y * canvas.height;
        c.nextState = 'sleeping';
        c.state = 'walking';
        c.bubble = 'Bobo bentar... 😴';
        c.bubbleTimer = 120;
      } else {
        // Soto Table
        c.targetX = ZONES.sotoTable.x * canvas.width + (Math.random() * 20 - 10);
        c.targetY = ZONES.sotoTable.y * canvas.height + (Math.random() * 20 - 10);
        c.nextState = 'eating';
        c.state = 'walking';
        c.bubble = 'Makan soto 🍲';
        c.bubbleTimer = 120;
      }
    }

    // DRAWING SYSTEM
    function drawOffice() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const w = canvas.width;
      const h = canvas.height;
      const splitY = h * SPLIT_RATIO;

      // 1. Floor: Top VIP Suite (Luxury Dark Plum & Gold Tiles)
      const tileSize = 28;
      for (let x = 0; x < w; x += tileSize) {
        for (let y = 0; y < splitY; y += tileSize) {
          const isAlt = ((x / tileSize) + (y / tileSize)) % 2 === 0;
          ctx.fillStyle = isAlt ? '#3b0764' : '#2e1065';
          ctx.fillRect(x, y, tileSize, tileSize);
          ctx.strokeStyle = '#581c87';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x, y, tileSize, tileSize);
        }
      }

      // 2. Floor: Bottom Staff Office (Modern Slate/Blue Tiles)
      for (let x = 0; x < w; x += tileSize) {
        for (let y = splitY; y < h; y += tileSize) {
          const isAlt = ((x / tileSize) + (y / tileSize)) % 2 === 0;
          ctx.fillStyle = isAlt ? '#1e293b' : '#0f172a';
          ctx.fillRect(x, y, tileSize, tileSize);
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x, y, tileSize, tileSize);
        }
      }

      // 3. Partition Wall Between VIP Suite and Staff Room
      ctx.fillStyle = '#64748b';
      ctx.fillRect(8, splitY - 6, w - 16, 12);
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.strokeRect(8, splitY - 6, w - 16, 12);

      // VIP Door in Middle
      ctx.fillStyle = '#92400e';
      ctx.fillRect(w * 0.45, splitY - 7, w * 0.10, 14);
      ctx.strokeStyle = '#fbbf24';
      ctx.strokeRect(w * 0.45, splitY - 7, w * 0.10, 14);

      // Room Badges
      ctx.font = 'bold 9px "Plus Jakarta Sans"';
      ctx.fillStyle = '#fbbf24';
      ctx.textAlign = 'left';
      ctx.fillText('👑 VIP SUITE: TY & ELIIE', 16, 20);

      ctx.fillStyle = '#94a3b8';
      ctx.fillText('💼 STAFF OFFICE & LOUNGE', 16, splitY + 18);

      // Outer Wall Border
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 4;
      ctx.strokeRect(6, 6, w - 12, h - 12);

      // 4. Draw VIP Room Furniture
      // A. Dual Boss Desk (Left Side of VIP)
      drawCoupleDesk(w * 0.36, h * 0.22);

      // B. Luxury King Size Bed (Right Side of VIP Room)
      drawCoupleKingBed(ZONES.coupleBed.x * w, ZONES.coupleBed.y * h);

      // 5. Draw Staff Room Furniture
      // A. Soto Table (Top Left Staff)
      drawTable(ZONES.sotoTable.x * w, ZONES.sotoTable.y * h, '🍲 Warung Soto', '#ea580c');
      
      // B. Coffee Machine (Top Right Staff)
      drawObject(ZONES.coffeeMachine.x * w, ZONES.coffeeMachine.y * h, 34, 34, '#d97706', '☕');

      // C. Staff Beds (Bottom)
      ZONES.staffBeds.forEach((b, idx) => {
        drawBed(b.x * w, b.y * h, idx + 1);
      });

      // D. Staff Work Desks
      ZONES.staffDesks.forEach(d => {
        drawStaffDesk(d.x * w, d.y * h, d.name);
      });

      // 6. Draw Characters (Couple on top)
      characters.forEach(c => {
        drawPixelCharacter(c);
      });
    }

    function drawCoupleDesk(x, y) {
      // Luxury Gold Trim Carpet
      ctx.fillStyle = '#701a75';
      ctx.beginPath();
      ctx.roundRect(x - 68, y - 26, 136, 56, 10);
      ctx.fill();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Long Shared Mahogany Desk
      ctx.fillStyle = '#451a03';
      ctx.fillRect(x - 56, y - 14, 112, 30);
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 56, y - 14, 112, 30);

      // Ty's Monitor (Left)
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x - 46, y - 10, 22, 12);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(x - 44, y - 8, 18, 8);

      // Eliie's Monitor (Right)
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x + 24, y - 10, 22, 12);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(x + 26, y - 8, 18, 8);

      // Center Love Heart & Gold Plaque
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('💖', x, y - 2);

      ctx.font = 'bold 9px "Plus Jakarta Sans"';
      ctx.fillStyle = '#fde047';
      ctx.fillText('MEJA DUET TY & ELIIE', x, y + 26);
    }

    function drawCoupleKingBed(x, y) {
      // King Size Bed Frame (Wide double bed)
      ctx.fillStyle = '#581c87';
      ctx.beginPath();
      ctx.roundRect(x - 36, y - 28, 72, 56, 8);
      ctx.fill();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Mattress & Luxury Crimson Silk Blanket
      ctx.fillStyle = '#be123c';
      ctx.fillRect(x - 32, y - 10, 64, 34);

      // Double Pillows
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(x - 28, y - 24, 24, 10); // Ty's Pillow
      ctx.fillRect(x + 4, y - 24, 24, 10);  // Eliie's Pillow

      // Gold Heart Embroidered
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('👑', x, y + 8);

      ctx.font = 'bold 8px "Plus Jakarta Sans"';
      ctx.fillStyle = '#fbcfe8';
      ctx.fillText('KASUR BERDUA', x, y + 36);
    }

    function drawStaffDesk(x, y, label) {
      ctx.fillStyle = '#78350f';
      ctx.fillRect(x - 24, y - 12, 48, 26);
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x - 24, y - 12, 48, 26);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x - 9, y - 9, 18, 10);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(x - 7, y - 7, 14, 6);

      ctx.font = '9px "Plus Jakarta Sans"';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y + 22);
    }

    function drawTable(x, y, label, color) {
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '13px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('🍲', x, y + 4);

      ctx.font = '9px "Plus Jakarta Sans"';
      ctx.fillStyle = '#fed7aa';
      ctx.fillText('Soto Kudus', x, y + 28);
    }

    function drawObject(x, y, w, h, color, icon) {
      ctx.fillStyle = color;
      ctx.fillRect(x - w/2, y - h/2, w, h);
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 1;
      ctx.strokeRect(x - w/2, y - h/2, w, h);

      ctx.font = '15px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(icon, x, y + 5);
    }

    function drawBed(x, y, num) {
      ctx.fillStyle = '#334155';
      ctx.fillRect(x - 14, y - 18, 28, 36);
      ctx.fillStyle = '#6366f1';
      ctx.fillRect(x - 12, y - 6, 24, 22);
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(x - 10, y - 16, 20, 8);
    }

    // DRAW PIXEL CHARACTERS
    function drawPixelCharacter(c) {
      const x = Math.round(c.x);
      const y = Math.round(c.y);
      const bob = (c.state === 'walking') ? Math.sin(c.frame * Math.PI) * 2 : 0;

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(x, y + 14, 11, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Sleeping on couple bed
      if (c.state === 'sleeping_couple') {
        ctx.fillStyle = c.hairColor;
        ctx.fillRect(x - 7, y - 8, 14, 10);
        ctx.fillStyle = '#ffe4e6';
        ctx.fillRect(x - 5, y - 4, 10, 8);

        // Heart + Zzz floating
        const zOff = (Date.now() / 300) % 15;
        ctx.font = 'bold 11px "Plus Jakarta Sans"';
        ctx.fillStyle = '#f472b6';
        ctx.fillText('💕 Zzz...', x + 8, y - 10 - zOff);
        return;
      }

      // Sleeping on staff bed
      if (c.state === 'sleeping') {
        ctx.fillStyle = c.hairColor;
        ctx.fillRect(x - 7, y - 8, 14, 10);
        ctx.fillStyle = '#ffe4e6';
        ctx.fillRect(x - 5, y - 4, 10, 8);

        const zOff = (Date.now() / 300) % 15;
        ctx.font = 'bold 11px "Plus Jakarta Sans"';
        ctx.fillStyle = '#a5b4fc';
        ctx.fillText('Zzz...', x + 8, y - 10 - zOff);
        return;
      }

      // Head (Skin)
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(x - 6, y - 14 + bob, 12, 11);

      // Hair
      ctx.fillStyle = c.hairColor;
      if (c.id === 'ty') {
        // Handsome short cropped hair for Ty
        ctx.fillRect(x - 7, y - 18 + bob, 14, 6);
        ctx.fillRect(x - 7, y - 14 + bob, 2, 7);
        ctx.fillRect(x + 5, y - 14 + bob, 2, 7);
      } else {
        // Girls bangs & cute hair
        ctx.fillRect(x - 7, y - 18 + bob, 14, 7);
        ctx.fillRect(x - 8, y - 14 + bob, 3, 9);
        ctx.fillRect(x + 5, y - 14 + bob, 3, 9);
      }

      // Elf Ears & Crown for Eliie
      if (c.id === 'eliie') {
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(x - 5, y - 21 + bob, 10, 3);
        ctx.fillRect(x - 5, y - 24 + bob, 2, 3);
        ctx.fillRect(x - 1, y - 25 + bob, 2, 4);
        ctx.fillRect(x + 3, y - 24 + bob, 2, 3);

        ctx.fillStyle = '#fed7aa';
        ctx.fillRect(x - 10, y - 12 + bob, 3, 3);
        ctx.fillRect(x + 7, y - 12 + bob, 3, 3);
      }

      // Crown for Ty (Owner)
      if (c.id === 'ty') {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(x - 5, y - 21 + bob, 10, 3);
        ctx.fillRect(x - 5, y - 24 + bob, 2, 3);
        ctx.fillRect(x - 1, y - 25 + bob, 2, 4);
        ctx.fillRect(x + 3, y - 24 + bob, 2, 3);
      }

      // Eyes
      const isBlink = Math.sin(Date.now() / 800) > 0.95;
      if (isBlink) {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x - 4, y - 9 + bob, 3, 1);
        ctx.fillRect(x + 1, y - 9 + bob, 3, 1);
      } else {
        ctx.fillStyle = (c.id === 'eliie') ? '#0284c7' : ((c.id === 'ty') ? '#0284c7' : '#0f172a');
        ctx.fillRect(x - 4, y - 10 + bob, 3, 3);
        ctx.fillRect(x + 1, y - 10 + bob, 3, 3);
      }

      // Blushing cheeks
      ctx.fillStyle = '#fb7185';
      ctx.fillRect(x - 5, y - 6 + bob, 2, 2);
      ctx.fillRect(x + 3, y - 6 + bob, 2, 2);

      // Body / Clothes
      ctx.fillStyle = c.dressColor;
      ctx.fillRect(x - 5, y - 2 + bob, 10, 9);

      // Legs / Pants
      ctx.fillStyle = '#334155';
      ctx.fillRect(x - 4, y + 7 + bob, 3, 5);
      ctx.fillRect(x + 1, y + 7 + bob, 3, 5);

      // State props
      if (c.state === 'coffee') {
        ctx.font = '10px Arial';
        ctx.fillText('☕', x + 7, y + bob);
      } else if (c.state === 'eating') {
        ctx.font = '10px Arial';
        ctx.fillText('🍲', x + 7, y + bob);
      }

      // Name Label
      ctx.font = 'bold 9px "Plus Jakarta Sans"';
      ctx.fillStyle = (c.id === 'ty') ? '#38bdf8' : ((c.id === 'eliie') ? '#fbbf24' : '#ffffff');
      ctx.textAlign = 'center';
      ctx.fillText(c.name.split(' ')[0], x, y - 23 + bob);

      // Speech bubble
      if (c.bubble && c.bubbleTimer > 0) {
        drawSpeechBubble(x, y - 37 + bob, c.bubble, c.isOwner || c.isBoss);
      }
    }

    function drawSpeechBubble(x, y, text, isSpecial) {
      ctx.font = '10px "Plus Jakarta Sans"';
      const textWidth = ctx.measureText(text).width;
      const padding = 6;
      const w = textWidth + padding * 2;
      const h = 18;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.strokeStyle = isSpecial ? '#f59e0b' : '#38bdf8';
      ctx.lineWidth = isSpecial ? 1.5 : 1;
      
      ctx.beginPath();
      ctx.roundRect(x - w/2, y - h/2, w, h, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = isSpecial ? '#f59e0b' : '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(x - 3, y + h/2);
      ctx.lineTo(x + 3, y + h/2);
      ctx.lineTo(x, y + h/2 + 4);
      ctx.fill();

      ctx.fillStyle = isSpecial ? '#fef08a' : '#e0f2fe';
      ctx.textAlign = 'center';
      ctx.fillText(text, x, y + 3.5);
    }

    // CLICK HANDLER
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      let found = null;
      characters.forEach(c => {
        const dist = Math.hypot(c.x - clickX, c.y - clickY);
        if (dist < 32) {
          found = c;
        }
      });

      if (found) {
        selectedChar = found;
        openCard(found);
      } else {
        closeCard();
      }
    });

    function openCard(c) {
      const card = document.getElementById('charCard');
      document.getElementById('cardName').innerText = c.name;
      document.getElementById('cardAvatar').innerText = c.avatar;
      document.getElementById('cardRoleBadge').innerText = c.role;
      document.getElementById('cardStatus').innerText = `"${c.statusText}"`;

      const actionMap = {
        bossing: (c.id === 'ty') ? '👑 Duduk Memantau Bersama Eliie' : '🌸 Duduk Memerintah Bersama Ty',
        sleeping_couple: '🛏️ Tidur Berdua di Kasur King Size Kamar Pribadi',
        working: '💻 Sedang Fokus Bekerja di Meja PC',
        walking: '🚶 Berjalan Keliling Ruangan',
        coffee: '☕ Menikmati Secangkir Kopi Hangat',
        sleeping: '😴 Tidur Siang di Kasur Staf',
        eating: '🍲 Makan Soto Kudus Pak Yono'
      };
      document.getElementById('cardAction').innerText = actionMap[c.state] || 'Santai';

      card.classList.remove('translate-y-40', 'opacity-0', 'pointer-events-none');
      card.classList.add('translate-y-0', 'opacity-100');
    }

    function closeCard() {
      const card = document.getElementById('charCard');
      card.classList.add('translate-y-40', 'opacity-0', 'pointer-events-none');
      card.classList.remove('translate-y-0', 'opacity-100');
      selectedChar = null;
    }

    function interactCouple() {
      if (!selectedChar) return;
      if (selectedChar.id === 'ty' || selectedChar.id === 'eliie') {
        const ty = characters.find(c => c.id === 'ty');
        const eliie = characters.find(c => c.id === 'eliie');
        ty.bubble = 'I love you sayang! ❤️';
        eliie.bubble = 'Love you more Ty! 🥰💕';
        ty.bubbleTimer = 220;
        eliie.bubbleTimer = 220;
        showToast('Ty & Eliie saling memeluk penuh cinta! 💖✨');
      } else {
        selectedChar.bubble = 'Hehehe makasih perhatiannya Ty! 🥰';
        selectedChar.bubbleTimer = 200;
        showToast(`Kamu memberi perhatian ke ${selectedChar.name}! 💖`);
      }
      closeCard();
    }

    function boostCoffee() {
      if (!selectedChar) return;
      selectedChar.bubble = 'Makasih kopinya Ty! ☕✨';
      selectedChar.bubbleTimer = 200;
      showToast(`${selectedChar.name} menikmati kopi hangat! ☕⚡`);
      closeCard();
    }

    // CONTROL BAR FUNCTIONS
    function triggerCoupleBed() {
      const ty = characters.find(c => c.id === 'ty');
      const eliie = characters.find(c => c.id === 'eliie');

      // Move Ty and Eliie side by side to King Size Bed
      ty.targetX = ZONES.coupleBed.x * canvas.width - 12;
      ty.targetY = ZONES.coupleBed.y * canvas.height;
      ty.nextState = 'sleeping_couple';
      ty.state = 'walking';
      ty.bubble = 'Tidur bareng ya sayang... 🛏️❤️';
      ty.bubbleTimer = 200;

      eliie.targetX = ZONES.coupleBed.x * canvas.width + 12;
      eliie.targetY = ZONES.coupleBed.y * canvas.height;
      eliie.nextState = 'sleeping_couple';
      eliie.state = 'walking';
      eliie.bubble = 'Iya sayang, peluk aku ya... 🥰💤';
      eliie.bubbleTimer = 200;

      showToast('Ty & Eliie masuk kamar pribadi dan tidur bareng di kasur King Size! 🛏️💕');
    }

    function triggerBossCommand() {
      const ty = characters.find(c => c.id === 'ty');
      const eliie = characters.find(c => c.id === 'eliie');

      // Return both to Couple Desk if asleep
      ty.targetX = canvas.width * 0.28;
      ty.targetY = canvas.height * 0.22;
      ty.nextState = 'bossing';
      ty.state = 'walking';
      ty.bubble = 'Ayo tim, tuntaskan target kita! 👑';
      ty.bubbleTimer = 240;

      eliie.targetX = canvas.width * 0.44;
      eliie.targetY = canvas.height * 0.22;
      eliie.nextState = 'bossing';
      eliie.state = 'walking';
      eliie.bubble = 'Laksanakan arahan Ty ya staf! 👑✨';
      eliie.bubbleTimer = 240;

      characters.filter(c => !c.isOwner && !c.isBoss).forEach(c => {
        c.bubble = 'Siap Bos Ty & Bos Eliie! 🫡';
        c.bubbleTimer = 200;
      });

      showToast('👑 Owner Ty & Bos Eliie memberi perintah ke seluruh staf!');
    }

    function triggerWorkAll() {
      const ty = characters.find(c => c.id === 'ty');
      const eliie = characters.find(c => c.id === 'eliie');

      ty.targetX = canvas.width * 0.28;
      ty.targetY = canvas.height * 0.22;
      ty.nextState = 'bossing';
      ty.state = 'walking';

      eliie.targetX = canvas.width * 0.44;
      eliie.targetY = canvas.height * 0.22;
      eliie.nextState = 'bossing';
      eliie.state = 'walking';

      characters.filter(c => !c.isOwner && !c.isBoss).forEach(c => {
        const desk = ZONES.staffDesks.find(d => d.id === c.deskId);
        if (desk) {
          c.targetX = desk.x * canvas.width;
          c.targetY = desk.y * canvas.height;
          c.nextState = 'working';
          c.state = 'walking';
          c.bubble = 'Fokus kerja lagi! 💻';
          c.bubbleTimer = 180;
        }
      });
      showToast('Semua kembali fokus bekerja di meja masing-masing! 💻🚀');
    }

    function triggerNapAll() {
      // Put Ty & Eliie in King Bed
      triggerCoupleBed();

      // Put staff in staff beds
      characters.filter(c => !c.isOwner && !c.isBoss).forEach((c, idx) => {
        const bed = ZONES.staffBeds[idx % ZONES.staffBeds.length];
        c.targetX = bed.x * canvas.width;
        c.targetY = bed.y * canvas.height;
        c.nextState = 'sleeping';
        c.state = 'walking';
        c.bubble = 'Bobo dulu yaa... 💤';
        c.bubbleTimer = 180;
      });
      showToast('Seluruh kantor dan kamar pribadi masuk waktu tidur! 😴💤');
    }

    function triggerSotoParty() {
      characters.filter(c => !c.isOwner && !c.isBoss).forEach(c => {
        c.targetX = ZONES.sotoTable.x * canvas.width + (Math.random() * 40 - 20);
        c.targetY = ZONES.sotoTable.y * canvas.height + (Math.random() * 20 - 10);
        c.nextState = 'eating';
        c.state = 'walking';
        c.bubble = 'Pesta Soto Pak Yono! 🍲😋';
        c.bubbleTimer = 220;
      });
      showToast('Pesta Soto Kudus Pak Yono di ruang staf dimulai! 🍲🎉');
    }

    // GAME LOOP
    function gameLoop() {
      updateAI();
      drawOffice();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
