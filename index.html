<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eliie's 3D Virtual Mansion & HQ — Ty & Eliie</title>
  
  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eliie 3D HQ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f59e0b">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Three.js & OrbitControls & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .title-font {
      font-family: 'Space Grotesk', sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .speech-bubble {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.2s ease;
      z-index: 25;
      white-space: nowrap;
    }
  </style>
</head>
<body class="bg-slate-950 text-white w-screen h-screen flex flex-col justify-between overflow-hidden">

  <!-- 3D WEBGL CANVAS -->
  <div id="canvas-container"></div>

  <!-- FLOATING SPEECH BUBBLE LAYER -->
  <div id="bubble-layer" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>

  <!-- TOP HEADER -->
  <header class="w-full px-3 sm:px-4 py-2 bg-slate-900/90 border-b border-amber-500/30 flex items-center justify-between z-30 backdrop-blur-md shadow-2xl">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-amber-600 via-amber-400 to-yellow-300 flex items-center justify-center text-slate-950 font-bold text-lg shadow-lg shadow-amber-500/30 border border-amber-300">
        👑
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="title-font font-bold text-sm sm:text-base text-amber-400 leading-none">TY & ELIIE 3D MANSION</h1>
          <span id="fpsBadge" class="text-[8px] sm:text-[9px] font-extrabold px-1.5 py-0.5 bg-emerald-500/20 text-emerald-300 rounded border border-emerald-400/40">60 FPS TURBO</span>
        </div>
        <p class="text-[9px] sm:text-[10px] text-slate-400 font-medium">Kamar VIP • 4 Kamar Staf • Dapur Soto • Lounge • Kantor PC</p>
      </div>
    </div>

    <!-- Right Controls: Toggle Performance & Reset Cam -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <button onclick="toggleTurboMode()" id="btnTurbo" class="bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 px-2 py-1 rounded-lg border border-emerald-500/40 text-[9px] sm:text-[10px] font-bold flex items-center gap-1 active:scale-95 transition-all shadow-sm">
        <i class="fa-solid fa-bolt"></i>
        <span>Turbo: ON</span>
      </button>

      <button onclick="resetCamera3D()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs text-amber-400 px-2 sm:px-2.5 py-1 rounded-lg border border-slate-700 flex items-center gap-1 shadow transition-all">
        <i class="fa-solid fa-camera-rotate"></i>
        <span class="text-[9px] sm:text-[10px] font-bold">Reset 3D</span>
      </button>

      <div class="text-right hidden md:block">
        <span class="text-[9px] text-pink-400 block font-bold">● TY & ELIIE + 4 STAF</span>
        <span id="office-time" class="font-mono text-xs text-slate-300">00:00:00</span>
      </div>
    </div>
  </header>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="absolute top-14 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 font-bold px-4 py-1 rounded-full text-xs shadow-2xl transform -translate-y-8 opacity-0 transition-all duration-300 pointer-events-none z-40 flex items-center gap-1.5">
    <span>✨</span>
    <span id="toastMsg">Notifikasi</span>
  </div>

  <!-- CHARACTER CARD -->
  <div id="charCard" class="fixed bottom-24 left-4 right-4 max-w-sm mx-auto bg-slate-900/95 border-2 border-amber-400 rounded-2xl p-4 shadow-2xl backdrop-blur-xl transform translate-y-48 opacity-0 transition-all duration-300 pointer-events-none z-40">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-3">
        <div id="cardAvatar" class="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-2xl shadow-inner">
          👑
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h3 id="cardName" class="font-bold text-sm text-white">Alberto Timoty (Ty)</h3>
            <span id="cardRoleBadge" class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">Owner</span>
          </div>
          <p id="cardStatus" class="text-xs text-slate-300 mt-0.5 italic">"Bersama Eliie di Mansion..."</p>
        </div>
      </div>
      <button onclick="closeCard()" class="text-slate-400 hover:text-white text-sm p-1">✕</button>
    </div>

    <div class="mt-3 pt-3 border-t border-slate-800 flex items-center justify-between text-xs">
      <div class="flex items-center gap-1.5">
        <span class="text-slate-400">Aksi 3D:</span>
        <span id="cardAction" class="font-semibold text-amber-400">Duduk Santai di Kursi</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="interactCouple()" id="btnAction1" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 shadow-md active:scale-95 transition-transform">
          💖 Sayang
        </button>
        <button onclick="boostCoffee()" id="btnAction2" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 shadow-md active:scale-95 transition-transform">
          ☕ Kopi
        </button>
      </div>
    </div>
  </div>

  <!-- BOTTOM 3D ACTION DOCK -->
  <footer class="w-full px-2 sm:px-3 py-2 bg-slate-900/90 border-t border-amber-500/30 flex items-center justify-around z-30 backdrop-blur-md shadow-2xl">
    <button onclick="triggerCoupleBed3D()" class="flex flex-col items-center gap-0.5 sm:gap-1 text-pink-400 hover:text-pink-300 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-pink-500/20 border border-pink-500/40 flex items-center justify-center text-sm sm:text-base shadow-inner">
        💑
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Pelukan Tidur</span>
    </button>

    <button onclick="triggerBossCommand3D()" class="flex flex-col items-center gap-0.5 sm:gap-1 text-amber-400 hover:text-amber-300 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-sm sm:text-base shadow-inner">
        👑
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Perintah Bos</span>
    </button>

    <button onclick="triggerWorkAll3D()" class="flex flex-col items-center gap-0.5 sm:gap-1 text-slate-400 hover:text-emerald-400 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800 flex items-center justify-center text-sm sm:text-base shadow-inner">
        💻
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Semua Kerja</span>
    </button>

    <button onclick="triggerStaffSleepRooms3D()" class="flex flex-col items-center gap-0.5 sm:gap-1 text-slate-400 hover:text-indigo-400 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800 flex items-center justify-center text-sm sm:text-base shadow-inner">
        💤
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Kamar Staf</span>
    </button>

    <button onclick="triggerKitchenCoffee3D()" class="flex flex-col items-center gap-0.5 sm:gap-1 text-slate-400 hover:text-amber-400 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800 flex items-center justify-center text-sm sm:text-base shadow-inner">
        ☕
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Dapur Soto</span>
    </button>

    <button onclick="triggerLoungeChill3D()" class="flex flex-col items-center gap-0.5 sm:gap-1 text-slate-400 hover:text-purple-400 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800 flex items-center justify-center text-sm sm:text-base shadow-inner">
        🛋️
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Lounge TV</span>
    </button>
  </footer>

  <!-- SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('3D SW ready:', reg.scope))
          .catch(err => console.log('SW err:', err));
      });
    }
  </script>

  <!-- HIGH-PERFORMANCE 3D ENGINE -->
  <script>
    function updateClock() {
      const now = new Date();
      const el = document.getElementById('office-time');
      if (el) el.innerText = now.toLocaleTimeString('id-ID');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.remove('-translate-y-8', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        t.classList.add('-translate-y-8', 'opacity-0');
        t.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    // 1. Mobile-Optimized Scene, Camera, Renderer
    let isTurbo = true;
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060913);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 32, 36);

    const renderer = new THREE.WebGLRenderer({
      antialias: window.devicePixelRatio < 2,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.15));
    renderer.shadowMap.enabled = false;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 10;
    controls.maxDistance = 65;
    controls.target.set(0, 0, 0);

    function toggleTurboMode() {
      isTurbo = !isTurbo;
      const btn = document.getElementById('btnTurbo');
      const badge = document.getElementById('fpsBadge');
      if (isTurbo) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.15));
        btn.className = "bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 px-2 py-1 rounded-lg border border-emerald-500/40 text-[9px] sm:text-[10px] font-bold flex items-center gap-1 active:scale-95 transition-all shadow-sm";
        btn.innerHTML = `<i class="fa-solid fa-bolt"></i> <span>Turbo: ON</span>`;
        badge.innerText = "60 FPS TURBO";
        badge.className = "text-[8px] sm:text-[9px] font-extrabold px-1.5 py-0.5 bg-emerald-500/20 text-emerald-300 rounded border border-emerald-400/40";
        showToast('Mode Turbo Aktif: Super Ringan & Lancar di HP! ⚡🚀');
      } else {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
        btn.className = "bg-amber-950/80 hover:bg-amber-900 text-amber-300 px-2 py-1 rounded-lg border border-amber-500/40 text-[9px] sm:text-[10px] font-bold flex items-center gap-1 active:scale-95 transition-all shadow-sm";
        btn.innerHTML = `<i class="fa-solid fa-gem"></i> <span>Ultra HD</span>`;
        badge.innerText = "ULTRA HD";
        badge.className = "text-[8px] sm:text-[9px] font-extrabold px-1.5 py-0.5 bg-amber-500/20 text-amber-300 rounded border border-amber-400/40";
        showToast('Mode Ultra HD: Resolusi Grafis Maksimal! 💎✨');
      }
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function resetCamera3D() {
      gsap.to(camera.position, { x: 0, y: 32, z: 36, duration: 1.0, ease: 'power2.out' });
      gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1.0, ease: 'power2.out' });
      showToast('Kamera 3D kembali ke sudut pandang luas! 🎥✨');
    }

    // 2. Lighting
    const hemiLight = new THREE.HemisphereLight(0xfff5ea, 0x090d16, 0.85);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffedd5, 0.9);
    dirLight.position.set(15, 30, 20);
    scene.add(dirLight);

    const vipLight = new THREE.PointLight(0xf59e0b, 1.2, 24);
    vipLight.position.set(-8, 6, -10);
    scene.add(vipLight);

    const officeLight = new THREE.PointLight(0x38bdf8, 1.1, 24);
    officeLight.position.set(8, 6, -10);
    scene.add(officeLight);

    // 3. ARCHITECTURE & 5 SEPARATE ROOMS
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.8, roughness: 0.2 });

    const baseFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(38, 38),
      new THREE.MeshLambertMaterial({ color: 0x090d16 })
    );
    baseFloor.rotation.x = -Math.PI / 2;
    scene.add(baseFloor);

    function createRoomFloor(x, z, w, d, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, 0.08, d),
        new THREE.MeshLambertMaterial({ color: color })
      );
      mesh.position.set(x, 0.04, z);
      scene.add(mesh);
      return mesh;
    }

    createRoomFloor(-9, -10, 17, 15, 0x4c0519); // VIP Suite
    createRoomFloor(9, -10, 17, 15, 0x0f172a);  // Work Office
    createRoomFloor(-11.5, 9, 12, 16, 0x451a03); // Kitchen
    createRoomFloor(-0.5, 9, 8, 16, 0x2e1065);  // Lounge
    createRoomFloor(10.5, 9, 14, 16, 0x1e293b); // Staff Bedrooms

    function createWall(x, z, w, d, h = 3.6) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      wall.position.set(x, h / 2, z);
      scene.add(wall);
      return wall;
    }

    createWall(0, -18, 38, 0.5);
    createWall(-18, 0, 0.5, 38);
    createWall(18, 0, 0.5, 38);
    createWall(0, 18, 38, 0.5);

    createWall(0, -10, 0.5, 15);
    createWall(0, -2.5, 36, 0.5);
    createWall(-5.5, 9, 0.5, 16);
    createWall(3.5, 9, 0.5, 16);
    createWall(10.5, 9, 14, 0.4, 3.0);
    createWall(10.5, 9, 0.4, 16, 3.0);

    // 4. CHAIRS & FURNITURE (CORRECT ORIENTATION: FACING DESKS & MONITORS)
    const furnitureGroup = new THREE.Group();
    scene.add(furnitureGroup);

    // Chair Builder: Backrest is at -Z local.
    // If chair is placed South of desk (larger Z) and needs to face North (-Z towards desk), rotation.y MUST be 0!
    // If chair backrest was at -Z, rotation.y = 0 puts backrest at South, opening towards North!
    function createChair3D(x, z, rotY = 0, color = 0x1e293b, isExecutive = false) {
      const cGroup = new THREE.Group();
      cGroup.position.set(x, 0, z);
      cGroup.rotation.y = rotY;

      const chairMat = new THREE.MeshLambertMaterial({ color: color });
      const legMat = new THREE.MeshLambertMaterial({ color: 0x0f172a });

      // Seat Cushion
      const seat = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.2, 1.1), chairMat);
      seat.position.y = 0.85;
      cGroup.add(seat);

      // Backrest (Placed at local +Z so chair faces local -Z towards desk!)
      const back = new THREE.Mesh(new THREE.BoxGeometry(1.1, isExecutive ? 1.4 : 1.0, 0.18), chairMat);
      back.position.set(0, isExecutive ? 1.55 : 1.35, 0.45);
      cGroup.add(back);

      // Stand
      const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.85, 8), legMat);
      stand.position.y = 0.42;
      cGroup.add(stand);

      furnitureGroup.add(cGroup);
      return cGroup;
    }

    // Workstation: Desk at (x, z), Chair at (x, z + 1.3) facing North (-Z towards monitor)
    function createWorkstation3D(x, z, monColor = 0x38bdf8) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);

      // Desk
      const deskTop = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.22, 1.8), new THREE.MeshLambertMaterial({ color: 0x475569 }));
      deskTop.position.set(0, 1.4, 0);
      group.add(deskTop);

      [[-1.6, -0.7], [1.6, -0.7], [-1.6, 0.7], [1.6, 0.7]].forEach(([lx, lz]) => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.4, 6), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
        leg.position.set(lx, 0.7, lz);
        group.add(leg);
      });

      // Monitor (facing South towards character)
      const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.08, 0.5, 6), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
      stand.position.set(0, 1.65, -0.4);
      group.add(stand);

      const mon = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 0.06), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
      mon.position.set(0, 2.1, -0.4);
      group.add(mon);

      const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.48, 0.8), new THREE.MeshBasicMaterial({ color: monColor }));
      screen.position.set(0, 2.1, -0.36);
      group.add(screen);

      // Ergonomic Chair placed at z + 1.35 facing North (rotY = 0)
      createChair3D(x, z + 1.35, 0, 0x0284c7);

      furnitureGroup.add(group);
      return { deskX: x, deskZ: z, seatX: x, seatZ: z + 1.35 };
    }

    // 4 Workstations in Work Office
    createWorkstation3D(5, -13, 0x38bdf8); // Luna
    createWorkstation3D(13, -13, 0xf97316); // Nana
    createWorkstation3D(5, -6, 0xf43f5e);  // Mimi
    createWorkstation3D(13, -6, 0xa855f7);  // Yuki

    // VIP Executive Desk
    const vipDeskGroup = new THREE.Group();
    vipDeskGroup.position.set(-10, 0, -6);
    const vipTop = new THREE.Mesh(new THREE.BoxGeometry(7.5, 0.3, 2.4), new THREE.MeshLambertMaterial({ color: 0x3f1d0b }));
    vipTop.position.y = 1.5;
    vipDeskGroup.add(vipTop);

    [-1.8, 1.8].forEach((mx, idx) => {
      const mon = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.1, 0.08), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
      mon.position.set(mx, 2.2, -0.6);
      vipDeskGroup.add(mon);
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.85, 0.95), new THREE.MeshBasicMaterial({ color: idx === 0 ? 0x38bdf8 : 0xf59e0b }));
      scr.position.set(mx, 2.2, -0.55);
      vipDeskGroup.add(scr);
    });
    furnitureGroup.add(vipDeskGroup);

    // Dual Executive Chairs behind VIP Desk facing North
    createChair3D(-11.8, -4.4, 0, 0x1e3a8a, true); // Ty's Armchair
    createChair3D(-8.2, -4.4, 0, 0xd97706, true);  // Eliie's Armchair

    // King Size Luxury Bed
    const kingBedGroup = new THREE.Group();
    kingBedGroup.position.set(-10, 0, -13.5);
    const kFrame = new THREE.Mesh(new THREE.BoxGeometry(7.5, 0.8, 6.5), new THREE.MeshLambertMaterial({ color: 0x2e1065 }));
    kFrame.position.y = 0.4;
    kingBedGroup.add(kFrame);

    const kHead = new THREE.Mesh(new THREE.BoxGeometry(7.5, 2.2, 0.5), goldMat);
    kHead.position.set(0, 1.5, -3.0);
    kingBedGroup.add(kHead);

    const kMattress = new THREE.Mesh(new THREE.BoxGeometry(6.8, 0.7, 5.8), new THREE.MeshLambertMaterial({ color: 0xbe123c }));
    kMattress.position.set(0, 0.85, 0);
    kingBedGroup.add(kMattress);

    [-1.6, 1.6].forEach(px => {
      const p = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.35, 1.3), new THREE.MeshLambertMaterial({ color: 0xfef08a }));
      p.position.set(px, 1.25, -2.0);
      kingBedGroup.add(p);
    });
    furnitureGroup.add(kingBedGroup);

    // 4 Staff Bedrooms
    const staffBedRooms = {
      luna: { x: 7, z: 4.5 },
      nana: { x: 14, z: 4.5 },
      mimi: { x: 7, z: 13.5 },
      yuki: { x: 14, z: 13.5 }
    };
    Object.values(staffBedRooms).forEach(room => {
      const bGroup = new THREE.Group();
      bGroup.position.set(room.x, 0, room.z);
      const bFrame = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.6, 4.8), new THREE.MeshLambertMaterial({ color: 0x334155 }));
      bFrame.position.y = 0.3;
      bGroup.add(bFrame);

    // 7. Animation Loop with Sweet Hugging Pose
    function updateAI3D() {
      characters3D.forEach(c => {
        c.frame += 0.08;

        if (c.bubbleTimer <= 0 && Math.random() < 0.003) {
          if (c.id === 'ty') {
            const list = ['Eliie istriku tercinta ❤️', 'Semangat tim mansion! 👑', 'Soto Pak Yono mantap 🍲', 'Sayang, istirahat pelukan yuk 💕'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 220;
          } else if (c.id === 'eliie') {
            const list = ['Sayang Ty banget... 🥰', 'Nana, cek rekap soto ya! 🍲', 'Luna, jaga VPS tetap aman! 💻', 'Mimi, bikin materi promo viral! ✨'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 220;
          } else {
            const quotes = {
              nana: ['Soto sapi siap! 🍲', 'Omzet naik 📈', 'Ngopi di dapur ☕', 'Siap Bos!'],
              luna: ['Compiling 🚀', '0 Bug di VPS 😎', 'Deploy sukses 💻', 'Siap Bos!'],
              mimi: ['Warna estetik 🎨', 'Reels FYP! 🎬', 'Nonton TV di lounge 🛋️', 'Siap Bos!'],
              yuki: ['Obsidian sync 📖', 'Catatan rapi 🍵', 'Kamar nyaman', 'Siap Bos.']
            };
            const list = quotes[c.id] || ['Semangat!'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 180;
          }
        }

        const dx = c.targetX - c.mesh.position.x;
        const dz = c.targetZ - c.mesh.position.z;
        const dist = Math.hypot(dx, dz);

        if (dist > 0.15) {
          c.mesh.position.x += (dx / dist) * c.speed;
          c.mesh.position.z += (dz / dist) * c.speed;

          const angle = Math.atan2(dx, dz);
          c.mesh.rotation.y = angle;

          c.legL.rotation.x = Math.sin(c.frame * 4) * 0.45;
          c.legR.rotation.x = -Math.sin(c.frame * 4) * 0.45;
          c.mesh.position.y = Math.abs(Math.sin(c.frame * 4)) * 0.08;
        } else {
          // Arrived
          c.legL.rotation.x = 0;
          c.legR.rotation.x = 0;

          if (c.state === 'cuddle_bed') {
            // Sweet cuddle sleeping pose facing each other
            c.mesh.position.y = 1.15;
            if (c.id === 'ty') {
              c.mesh.rotation.x = -Math.PI / 2;
              c.mesh.rotation.z = Math.PI / 3.5; // Ty tilted facing right towards Eliie
            } else if (c.id === 'eliie') {
              c.mesh.rotation.x = -Math.PI / 2;
              c.mesh.rotation.z = -Math.PI / 3.5; // Eliie tilted facing left snuggling Ty
            }
          } else if (c.state === 'sleeping_bed') {
            c.mesh.rotation.x = -Math.PI / 2;
            c.mesh.rotation.z = 0;
            c.mesh.position.y = 0.9;
          } else if (c.state === 'sitting_chair' || c.state === 'sitting_lounge') {
            c.mesh.rotation.x = 0;
            c.mesh.rotation.z = 0;
            c.mesh.position.y = 0.15; // Cleanly placed on chair cushion without clipping
            c.mesh.rotation.y = (c.targetRotY !== undefined) ? c.targetRotY : 0;
            c.head.position.y = 2.0 + Math.sin(c.frame * 2) * 0.02;
          } else {
            c.mesh.rotation.x = 0;
            c.mesh.rotation.z = 0;
            c.mesh.position.y = 0;
            c.head.position.y = 2.0 + Math.sin(c.frame * 2) * 0.02;
          }
        }
      });
    }

    });

      nanaChar.targetRotY = Math.PI;
      nanaChar.state = 'sitting_lounge';
      nanaChar.bubble = 'Santai rileks ✨';

      gsap.to(camera.position, { x: -1, y: 15, z: 20, duration: 1.0, ease: 'power2.out' });
      gsap.to(controls.target, { x: -1, y: 1, z: 9, duration: 1.0, ease: 'power2.out' });

      showToast('Staf bersantai duduk di sofa empuk ruang Lounge! 🛋️🎉');
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateAI3D();
      updateSpeechBubbles3D();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
