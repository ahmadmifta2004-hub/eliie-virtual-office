<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ty & Eliie — AI Headquarters & Meeting Room</title>
  
  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Mansion">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f59e0b">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Three.js & OrbitControls & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .title-font {
      font-family: 'Space Grotesk', sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .speech-bubble {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.2s ease;
      z-index: 25;
      white-space: nowrap;
    }
  </style>
</head>
<body class="bg-slate-950 text-white w-screen h-screen flex flex-col justify-between overflow-hidden">

  <!-- 3D WEBGL CANVAS -->
  <div id="canvas-container"></div>

  <!-- FLOATING SPEECH BUBBLE LAYER -->
  <div id="bubble-layer" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>

  <!-- TOP HEADER & ROOM NAVIGATION TABS -->
  <header class="w-full bg-slate-900/90 border-b border-amber-500/30 z-30 backdrop-blur-md shadow-2xl flex flex-col">
    
    <!-- Top Bar -->
    <div class="px-3 sm:px-4 py-1.5 flex items-center justify-between border-b border-slate-800/80">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-gradient-to-tr from-amber-600 via-amber-400 to-yellow-300 flex items-center justify-center text-slate-950 font-bold text-base shadow-md shadow-amber-500/30 border border-amber-300">
          👑
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="title-font font-bold text-xs sm:text-sm text-amber-400 leading-none">TY & ELIIE AI HQ</h1>
            <span id="fpsBadge" class="text-[8px] font-extrabold px-1.5 py-0.2 bg-emerald-500/20 text-emerald-300 rounded border border-emerald-400/40">60 FPS TURBO</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="toggleTurboMode()" id="btnTurbo" class="bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded-lg border border-emerald-500/40 text-[9px] font-bold flex items-center gap-1 active:scale-95 transition-all shadow-sm">
          <i class="fa-solid fa-bolt"></i>
          <span>Turbo: ON</span>
        </button>

        <button onclick="navRoom('overview')" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs text-amber-400 px-2 py-0.5 rounded-lg border border-slate-700 flex items-center gap-1 shadow transition-all">
          <i class="fa-solid fa-camera-rotate"></i>
          <span class="text-[9px] font-bold">Reset 3D</span>
        </button>

        <div class="text-right hidden sm:block">
          <span id="office-time" class="font-mono text-[11px] text-slate-300">00:00:00</span>
        </div>
      </div>
    </div>

    <!-- ROOM TABS: TIKTOK STYLE NAVIGATION -->
    <div class="px-2 py-1 flex items-center gap-1.5 overflow-x-auto no-scrollbar bg-slate-950/60">
      <button onclick="navRoom('overview')" id="tab-overview" class="room-tab whitespace-nowrap px-2.5 py-1 rounded-md text-[10px] font-bold bg-amber-500 text-slate-950 shadow-md transition-all flex items-center gap-1">
        <span>🏢</span> Overview
      </button>
      <button onclick="navRoom('meeting')" id="tab-meeting" class="room-tab whitespace-nowrap px-2.5 py-1 rounded-md text-[10px] font-bold bg-slate-800/80 text-slate-300 hover:text-amber-300 transition-all flex items-center gap-1 border border-slate-700">
        <span>📊</span> Ruang Rapat
      </button>
      <button onclick="navRoom('vip')" id="tab-vip" class="room-tab whitespace-nowrap px-2.5 py-1 rounded-md text-[10px] font-bold bg-slate-800/80 text-slate-300 hover:text-amber-300 transition-all flex items-center gap-1 border border-slate-700">
        <span>👑</span> VIP Suite
      </button>
      <button onclick="navRoom('office')" id="tab-office" class="room-tab whitespace-nowrap px-2.5 py-1 rounded-md text-[10px] font-bold bg-slate-800/80 text-slate-300 hover:text-amber-300 transition-all flex items-center gap-1 border border-slate-700">
        <span>💻</span> Kantor PC
      </button>
      <button onclick="navRoom('kitchen')" id="tab-kitchen" class="room-tab whitespace-nowrap px-2.5 py-1 rounded-md text-[10px] font-bold bg-slate-800/80 text-slate-300 hover:text-amber-300 transition-all flex items-center gap-1 border border-slate-700">
        <span>☕</span> Dapur Soto
      </button>
      <button onclick="navRoom('lounge')" id="tab-lounge" class="room-tab whitespace-nowrap px-2.5 py-1 rounded-md text-[10px] font-bold bg-slate-800/80 text-slate-300 hover:text-amber-300 transition-all flex items-center gap-1 border border-slate-700">
        <span>🛋️</span> Lounge TV
      </button>
      <button onclick="navRoom('staffbed')" id="tab-staffbed" class="room-tab whitespace-nowrap px-2.5 py-1 rounded-md text-[10px] font-bold bg-slate-800/80 text-slate-300 hover:text-amber-300 transition-all flex items-center gap-1 border border-slate-700">
        <span>🛏️</span> Kamar Staf
      </button>
    </div>

  </header>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="absolute top-20 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 font-bold px-4 py-1 rounded-full text-xs shadow-2xl transform -translate-y-8 opacity-0 transition-all duration-300 pointer-events-none z-40 flex items-center gap-1.5">
    <span>✨</span>
    <span id="toastMsg">Notifikasi</span>
  </div>

  <!-- CHARACTER CARD -->
  <div id="charCard" class="fixed bottom-24 left-4 right-4 max-w-sm mx-auto bg-slate-900/95 border-2 border-amber-400 rounded-2xl p-4 shadow-2xl backdrop-blur-xl transform translate-y-48 opacity-0 transition-all duration-300 pointer-events-none z-40">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-3">
        <div id="cardAvatar" class="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-2xl shadow-inner">
          👑
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h3 id="cardName" class="font-bold text-sm text-white">Alberto Timoty (Ty)</h3>
            <span id="cardRoleBadge" class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">Owner</span>
          </div>
          <p id="cardStatus" class="text-xs text-slate-300 mt-0.5 italic">"Bersama Eliie di Mansion..."</p>
        </div>
      </div>
      <button onclick="closeCard()" class="text-slate-400 hover:text-white text-sm p-1">✕</button>
    </div>

    <div class="mt-3 pt-3 border-t border-slate-800 flex items-center justify-between text-xs">
      <div class="flex items-center gap-1.5">
        <span class="text-slate-400">Status:</span>
        <span id="cardAction" class="font-semibold text-amber-400">Duduk di Meja Rapat</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="interactCouple()" id="btnAction1" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 shadow-md active:scale-95 transition-transform">
          💖 Sayang
        </button>
        <button onclick="boostCoffee()" id="btnAction2" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 shadow-md active:scale-95 transition-transform">
          ☕ Kopi
        </button>
      </div>
    </div>
  </div>

  <!-- BOTTOM 3D ACTION DOCK -->
  <footer class="w-full px-2 sm:px-3 py-2 bg-slate-900/90 border-t border-amber-500/30 flex items-center justify-around z-30 backdrop-blur-md shadow-2xl">
    <button onclick="triggerApprovalDeploy3D()" class="flex flex-col items-center gap-0.5 text-emerald-400 hover:text-emerald-300 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-sm sm:text-base shadow-inner">
        🚀
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Approval Deploy</span>
    </button>

    <button onclick="triggerMeetingRoom3D()" class="flex flex-col items-center gap-0.5 text-amber-400 hover:text-amber-300 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-sm sm:text-base shadow-inner">
        📊
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Rapat Tim</span>
    </button>

    <button onclick="triggerWorkAll3D()" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800 flex items-center justify-center text-sm sm:text-base shadow-inner">
        💻
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Semua Kerja</span>
    </button>

    <button onclick="triggerCoupleBed3D()" class="flex flex-col items-center gap-0.5 text-pink-400 hover:text-pink-300 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-pink-500/20 border border-pink-500/40 flex items-center justify-center text-sm sm:text-base shadow-inner">
        💑
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Pelukan Tidur</span>
    </button>

    <button onclick="triggerStaffSleepRooms3D()" class="flex flex-col items-center gap-0.5 text-indigo-400 hover:text-indigo-300 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800 flex items-center justify-center text-sm sm:text-base shadow-inner">
        💤
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Kamar Staf</span>
    </button>

    <button onclick="triggerKitchenCoffee3D()" class="flex flex-col items-center gap-0.5 text-orange-400 hover:text-orange-300 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800 flex items-center justify-center text-sm sm:text-base shadow-inner">
        ☕
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Dapur Soto</span>
    </button>

    <button onclick="triggerLoungeChill3D()" class="flex flex-col items-center gap-0.5 text-purple-400 hover:text-purple-300 active:scale-95 transition-all">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-800 flex items-center justify-center text-sm sm:text-base shadow-inner">
        🛋️
      </div>
      <span class="text-[8px] sm:text-[9px] font-bold">Lounge TV</span>
    </button>
  </footer>

  <!-- SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('3D SW ready:', reg.scope))
          .catch(err => console.log('SW err:', err));
      });
    }
  </script>

  <!-- 3D THREE.JS SCRIPT -->
  <script>
    function updateClock() {
      const now = new Date();
      const el = document.getElementById('office-time');
      if (el) el.innerText = now.toLocaleTimeString('id-ID');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.remove('-translate-y-8', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        t.classList.add('-translate-y-8', 'opacity-0');
        t.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    // 1. Scene, Camera, Renderer
    let isTurbo = true;
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060913);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 34, 38);

    const renderer = new THREE.WebGLRenderer({
      antialias: window.devicePixelRatio < 2,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.15));
    renderer.shadowMap.enabled = false;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 10;
    controls.maxDistance = 70;
    controls.target.set(0, 0, 0);

    function toggleTurboMode() {
      isTurbo = !isTurbo;
      const btn = document.getElementById('btnTurbo');
      const badge = document.getElementById('fpsBadge');
      if (isTurbo) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.15));
        btn.className = "bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded-lg border border-emerald-500/40 text-[9px] font-bold flex items-center gap-1 active:scale-95 transition-all shadow-sm";
        btn.innerHTML = `<i class="fa-solid fa-bolt"></i> <span>Turbo: ON</span>`;
        badge.innerText = "60 FPS TURBO";
        badge.className = "text-[8px] font-extrabold px-1.5 py-0.2 bg-emerald-500/20 text-emerald-300 rounded border border-emerald-400/40";
        showToast('Mode Turbo Aktif: 60 FPS Super Ringan! ⚡🚀');
      } else {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
        btn.className = "bg-amber-950/80 hover:bg-amber-900 text-amber-300 px-2 py-0.5 rounded-lg border border-amber-500/40 text-[9px] font-bold flex items-center gap-1 active:scale-95 transition-all shadow-sm";
        btn.innerHTML = `<i class="fa-solid fa-gem"></i> <span>Ultra HD</span>`;
        badge.innerText = "ULTRA HD";
        badge.className = "text-[8px] font-extrabold px-1.5 py-0.2 bg-amber-500/20 text-amber-300 rounded border border-amber-400/40";
        showToast('Mode Ultra HD: Resolusi Grafis Maksimal! 💎✨');
      }
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ROOM CAMERA TELEPORT SYSTEM
    function navRoom(room) {
      document.querySelectorAll('.room-tab').forEach(el => {
        el.className = "room-tab whitespace-nowrap px-2.5 py-1 rounded-md text-[10px] font-bold bg-slate-800/80 text-slate-300 hover:text-amber-300 transition-all flex items-center gap-1 border border-slate-700";
      });
      const activeTab = document.getElementById(`tab-${room}`);
      if (activeTab) {
        activeTab.className = "room-tab whitespace-nowrap px-2.5 py-1 rounded-md text-[10px] font-bold bg-amber-500 text-slate-950 shadow-md transition-all flex items-center gap-1";
      }

      if (room === 'overview') {
        gsap.to(camera.position, { x: 0, y: 34, z: 38, duration: 1.0, ease: 'power2.out' });
        gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1.0, ease: 'power2.out' });
        showToast('🏢 Overview Seluruh Denah Mansion 3D');
      } else if (room === 'meeting') {
        gsap.to(camera.position, { x: 0, y: 15, z: 6, duration: 1.0, ease: 'power2.out' });
        gsap.to(controls.target, { x: 0, y: 1, z: -4, duration: 1.0, ease: 'power2.out' });
        showToast('📊 Ruang Rapat Utama (Conference Table)');
      } else if (room === 'vip') {
        gsap.to(camera.position, { x: -11, y: 15, z: -4, duration: 1.0, ease: 'power2.out' });
        gsap.to(controls.target, { x: -11, y: 1, z: -13, duration: 1.0, ease: 'power2.out' });
        showToast('👑 Kamar VIP Suite Ty & Eliie');
      } else if (room === 'office') {
        gsap.to(camera.position, { x: 11, y: 15, z: -4, duration: 1.0, ease: 'power2.out' });
        gsap.to(controls.target, { x: 11, y: 1, z: -13, duration: 1.0, ease: 'power2.out' });
        showToast('💻 Ruang Kantor Komputer Staf');
      } else if (room === 'kitchen') {
        gsap.to(camera.position, { x: -11.5, y: 15, z: 22, duration: 1.0, ease: 'power2.out' });
        gsap.to(controls.target, { x: -11.5, y: 1, z: 9, duration: 1.0, ease: 'power2.out' });
        showToast('☕ Dapur & Warung Soto Pak Yono');
      } else if (room === 'lounge') {
        gsap.to(camera.position, { x: -0.5, y: 15, z: 22, duration: 1.0, ease: 'power2.out' });
        gsap.to(controls.target, { x: -0.5, y: 1, z: 9, duration: 1.0, ease: 'power2.out' });
        showToast('🛋️ Ruang Lounge Santai TV');
      } else if (room === 'staffbed') {
        gsap.to(camera.position, { x: 10.5, y: 15, z: 22, duration: 1.0, ease: 'power2.out' });
        gsap.to(controls.target, { x: 10.5, y: 1, z: 9, duration: 1.0, ease: 'power2.out' });
        showToast('🛏️ 4 Kamar Tidur Privat Staf');
      }
    }

    // 2. Lighting
    const hemiLight = new THREE.HemisphereLight(0xfff5ea, 0x090d16, 0.85);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffedd5, 0.9);
    dirLight.position.set(15, 30, 20);
    scene.add(dirLight);

    const meetLight = new THREE.PointLight(0xf59e0b, 1.4, 22);
    meetLight.position.set(0, 6, -4);
    scene.add(meetLight);

    const vipLight = new THREE.PointLight(0xf43f5e, 1.2, 22);
    vipLight.position.set(-11, 6, -11);
    scene.add(vipLight);

    // 3. ARCHITECTURE (DENAH LENGKAP: RUANG RAPAT TENGAH + VIP + KANTOR + DAPUR + LOUNGE + KAMAR STAF)
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.8, roughness: 0.2 });

    const baseFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshLambertMaterial({ color: 0x090d16 })
    );
    baseFloor.rotation.x = -Math.PI / 2;
    scene.add(baseFloor);

    function createRoomFloor(x, z, w, d, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, 0.08, d),
        new THREE.MeshLambertMaterial({ color: color })
      );
      mesh.position.set(x, 0.04, z);
      scene.add(mesh);
      return mesh;
    }

    // Floors
    createRoomFloor(-11, -10.5, 14, 14, 0x4c0519); // 1. VIP Master Suite (Kiri Atas)
    createRoomFloor(0, -4.5, 10, 11, 0x1e1b4b);    // 2. CENTRAL MEETING ROOM (Tengah Atas)
    createRoomFloor(11, -10.5, 14, 14, 0x0f172a);  // 3. Work Office (Kanan Atas)
    createRoomFloor(-11.5, 9, 13, 16, 0x451a03);  // 4. Kitchen Cafe & Soto (Kiri Bawah)
    createRoomFloor(-0.5, 9, 8, 16, 0x2e1065);   // 5. Lounge TV (Tengah Bawah)
    createRoomFloor(10.5, 9, 14, 16, 0x1e293b);  // 6. Staff Bedrooms Wing (Kanan Bawah)

    function createWall(x, z, w, d, h = 3.6) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      wall.position.set(x, h / 2, z);
      scene.add(wall);
      return wall;
    }

    // Outer Walls
    createWall(0, -18, 40, 0.5);
    createWall(-19, 0, 0.5, 38);
    createWall(19, 0, 0.5, 38);
    createWall(0, 18, 40, 0.5);

    // Inner Partitions
    createWall(-5.2, -10.5, 0.5, 14); // Left wall of Meeting Room
    createWall(5.2, -10.5, 0.5, 14);  // Right wall of Meeting Room
    createWall(0, 1.2, 38, 0.5);      // Main Hallway Divider (North vs South)
    createWall(-5.5, 9.5, 0.5, 16);   // Kitchen / Lounge
    createWall(3.5, 9.5, 0.5, 16);    // Lounge / Staff Wing
    createWall(10.5, 9.5, 14, 0.4, 3.0); // Horizontal Staff
    createWall(10.5, 9.5, 0.4, 16, 3.0); // Vertical Staff

    // 4. FURNITURE SYSTEM
    const furnitureGroup = new THREE.Group();
    scene.add(furnitureGroup);

    // Chair Builder
    function createChair3D(x, z, rotY = 0, color = 0x1e293b, isExecutive = false) {
      const cGroup = new THREE.Group();
      cGroup.position.set(x, 0, z);
      cGroup.rotation.y = rotY;

      const chairMat = new THREE.MeshLambertMaterial({ color: color });
      const legMat = new THREE.MeshLambertMaterial({ color: 0x0f172a });

      const seat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 1.2), chairMat);
      seat.position.y = 0.85;

      characters3D.forEach(c => {
        c.frame += 0.08;

        if (c.bubbleTimer <= 0 && Math.random() < 0.003) {
          if (c.id === 'ty') {
            const list = ['Eliie istriku tercinta ❤️', 'Semangat tim rapat! 👑', 'Soto Pak Yono mantap 🍲', 'Sayang, istirahat pelukan yuk 💕'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 220;
          } else if (c.id === 'eliie') {
            const list = ['Sayang Ty banget... 🥰', 'Nana, cek rekap soto ya! 🍲', 'Luna, pantau server tetap 0 bug! 💻', 'Mimi, rilis promo viral! ✨'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 220;
          } else {
            const quotes = {
              nana: ['Soto sapi laris! 🍲', 'Omzet naik 📈', 'Ngopi di dapur ☕', 'Siap Bos!'],
              luna: ['Compiling 🚀', '0 Bug di VPS 😎', 'Deploy sukses 💻', 'Siap Bos!'],
              mimi: ['Warna estetik 🎨', 'Reels FYP! 🎬', 'Nonton TV di lounge 🛋️', 'Siap Bos!'],
              yuki: ['Obsidian sync 📖', 'Catatan rapi 🍵', 'Rapat produktif', 'Siap Bos.']
            };
            const list = quotes[c.id] || ['Semangat!'];
            c.bubble = list[Math.floor(Math.random() * list.length)];
            c.bubbleTimer = 180;
          }
        }

        const dx = c.targetX - c.mesh.position.x;
        const dz = c.targetZ - c.mesh.position.z;
        const dist = Math.hypot(dx, dz);

        if (dist > 0.15) {
          c.mesh.position.x += (dx / dist) * c.speed;
          c.mesh.position.z += (dz / dist) * c.speed;

          const angle = Math.atan2(dx, dz);
          c.mesh.rotation.y = angle;

          c.legL.rotation.x = Math.sin(c.frame * 4) * 0.45;
          c.legR.rotation.x = -Math.sin(c.frame * 4) * 0.45;
          c.mesh.position.y = Math.abs(Math.sin(c.frame * 4)) * 0.08;
        } else {
          c.legL.rotation.x = 0;
          c.legR.rotation.x = 0;

          if (c.state === 'cuddle_bed') {
            c.mesh.position.y = 1.15;
            if (c.id === 'ty') {
              c.mesh.rotation.x = -Math.PI / 2;
              c.mesh.rotation.z = Math.PI / 2.8;
            } else if (c.id === 'eliie') {
              c.mesh.rotation.x = -Math.PI / 2;
              c.mesh.rotation.z = -Math.PI / 2.8;
            }
          } else if (c.state === 'sleeping_bed') {
            c.mesh.rotation.x = -Math.PI / 2;
            c.mesh.rotation.z = 0;
            c.mesh.position.y = 0.9;
          } else if (c.state === 'sitting_chair') {
            c.mesh.rotation.x = 0;
            c.mesh.rotation.z = 0;
            c.mesh.position.y = 0.2;
            c.mesh.rotation.y = (c.targetRotY !== undefined) ? c.targetRotY : Math.PI;
            c.head.position.y = 2.0 + Math.sin(c.frame * 2) * 0.02;
          } else if (c.state === 'sitting_lounge') {
            c.mesh.rotation.x = 0;
            c.mesh.rotation.z = 0;
            c.mesh.position.y = 0.65;
            c.mesh.rotation.y = Math.PI;
            c.head.position.y = 2.0 + Math.sin(c.frame * 2) * 0.02;
          } else {
            c.mesh.rotation.x = 0;
            c.mesh.rotation.z = 0;
            c.mesh.position.y = 0;
            c.head.position.y = 2.0 + Math.sin(c.frame * 2) * 0.02;
          }
        }
      });

    const mouse = new THREE.Vector2();
    let selectedChar = null;

    window.addEventListener('click', (e) => {
      if (e.target.closest('header') || e.target.closest('footer') || e.target.closest('#charCard')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(charMeshes, false);

      if (intersects.length > 0) {
        const charConfig = intersects[0].object.userData.config;
        selectedChar = characters3D.find(c => c.id === charConfig.id);
        openCard3D(selectedChar);
      } else {
        closeCard();
      }
    });

    function openCard3D(c) {
      const card = document.getElementById('charCard');
      document.getElementById('cardName').innerText = c.name;
      document.getElementById('cardAvatar').innerText = c.avatar;
      document.getElementById('cardRoleBadge').innerText = c.role;
      document.getElementById('cardStatus').innerText = `"${c.bubble}"`;

      const actionMap = {
        sitting_chair: '🪑 Duduk Rapi di Kursi Rapat / Kerja',
        sitting_lounge: '🛋️ Bersantai di Sofa Lounge',
        cuddle_bed: '💑 Tidur Pelukan Hangat di Kasur King Size VIP',
        sleeping_bed: '😴 Tidur Lelap di Kamar Pribadi',
        eating_cafe: '🍲 Menikmati Soto di Meja Dapur'
      };
      document.getElementById('cardAction').innerText = actionMap[c.state] || 'Santai';

      card.classList.remove('translate-y-48', 'opacity-0', 'pointer-events-none');
      card.classList.add('translate-y-0', 'opacity-100');
    }

    function closeCard() {
      const card = document.getElementById('charCard');
      card.classList.add('translate-y-48', 'opacity-0', 'pointer-events-none');
      card.classList.remove('translate-y-0', 'opacity-100');
      selectedChar = null;
    }

      closeCard();
    }
