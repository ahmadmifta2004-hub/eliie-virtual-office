  <!-- SERVICE WORKER & FORCE RELOAD -->
  <script>
    async function forceCleanReload() {
      const icon = document.getElementById('updateIcon');
      if (icon) icon.classList.add('fa-spin');

      showToast('🔄 Memperbarui seluruh data kantor & membersihkan cache...');

      try {
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((reg) => reg.unregister()));
        }
      } catch (err) {
        console.error('Cache flush error:', err);
      }

      setTimeout(() => {
        // Cache-busting reload
        window.location.href = window.location.pathname + '?v=' + Date.now();
      }, 400);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=15')
          .then((reg) => {
            reg.update();
            console.log('SW Ready:', reg.scope);
          })
          .catch((err) => console.log('SW Err:', err));
      });
    }

    // Auto-update checker every 90 seconds
    setInterval(() => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then((reg) => {
          if (reg) reg.update();
        });
      }
    }, 90000);
  </script>

  <!-- HIGH-RISE 3D PENTHOUSE WEBGL ENGINE -->
  <script>
    const container = document.getElementById('webgl-container');
    const labelsContainer = document.getElementById('labels-container');

    // SCENE, CAMERA, RENDERER
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x38bdf8); // Sky daylight
    scene.fog = new THREE.FogExp2(0x93c5fd, 0.008);

    const width = container.clientWidth;
    const height = container.clientHeight;

    const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 1000);
    camera.position.set(0, 24, 32);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 8;
    controls.maxDistance = 65;
    controls.target.set(0, 1.5, 0);

    function updateClock() {
      const el = document.getElementById('office-time');
      if (el) el.innerText = new Date().toLocaleTimeString('id-ID');
    }
    setInterval(updateClock, 1000);
    updateClock();

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.remove('-translate-y-12', 'opacity-0');
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        t.classList.add('-translate-y-12', 'opacity-0');
        t.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    // LIGHTING: DAYLIGHT & SUNLIGHT AT HIGH ALTITUDE
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
    sunLight.position.set(30, 45, 25);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.bias = -0.0003;
    scene.add(sunLight);

    // MATERIALS
    const marbleFloorMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.15, metalness: 0.1 });
    const woodParquetMat = new THREE.MeshStandardMaterial({ color: 0xa66a38, roughness: 0.35, metalness: 0.05 });
    const glassWallMat = new THREE.MeshPhysicalMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.25, roughness: 0.05, transmission: 0.95 });
    const blackSteelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.8 });
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.6 });
    const buildingWindowMat = new THREE.MeshBasicMaterial({ color: 0xbae6fd });

    // 1. SKYLINE CITY PANORAMA OUTSIDE (SKYSCRAPERS SURROUNDING THE PENTHOUSE)
    const cityGroup = new THREE.Group();
    scene.add(cityGroup);

    for (let i = 0; i < 40; i++) {
      const angle = (i / 40) * Math.PI * 2;
      const radius = 55 + Math.random() * 40;
      const bx = Math.cos(angle) * radius;
      const bz = Math.sin(angle) * radius;
      const bHeight = 25 + Math.random() * 50;
      const bWidth = 8 + Math.random() * 8;

      const tower = new THREE.Mesh(new THREE.BoxGeometry(bWidth, bHeight, bWidth), buildingMat);
      tower.position.set(bx, bHeight / 2 - 25, bz);
      cityGroup.add(tower);

      // Windows
      const win = new THREE.Mesh(new THREE.BoxGeometry(bWidth * 1.01, bHeight * 0.8, bWidth * 1.01), buildingWindowMat);
      win.position.set(bx, bHeight / 2 - 25, bz);
      cityGroup.add(win);
    }

    // 2. OPEN-PLAN PENTHOUSE TOP FLOOR (NO PARTITION WALLS, FLOOR-TO-CEILING GLASS)
    const penthouse = new THREE.Group();
    scene.add(penthouse);

    // Luxury Marble Penthouse Floor Base
    const floor = new THREE.Mesh(new THREE.BoxGeometry(46, 0.8, 38), marbleFloorMat);
    floor.position.y = -0.4;
    floor.receiveShadow = true;
    penthouse.add(floor);

    // Hardwood Inlay for Conference Center
    const woodCenter = new THREE.Mesh(new THREE.BoxGeometry(18, 0.02, 12), woodParquetMat);
    woodCenter.position.set(0, 0.01, 0);
    woodCenter.receiveShadow = true;
    penthouse.add(woodCenter);

    // Full Panoramic Glass Curtain Windows around perimeter
    const glassPerimeter = [
      { w: 46, h: 9, d: 0.3, x: 0, y: 4.5, z: -19 }, // Back
      { w: 46, h: 9, d: 0.3, x: 0, y: 4.5, z: 19 },  // Front
      { w: 0.3, h: 9, d: 38, x: -23, y: 4.5, z: 0 }, // Left
      { w: 0.3, h: 9, d: 38, x: 23, y: 4.5, z: 0 }   // Right
    ];

    glassPerimeter.forEach(gp => {
      const g = new THREE.Mesh(new THREE.BoxGeometry(gp.w, gp.h, gp.d), glassWallMat);
      g.position.set(gp.x, gp.y, gp.z);
      penthouse.add(g);
    });

    // Steel Pillars / Mullions
    [[-23, -19], [23, -19], [-23, 19], [23, 19], [-23, 0], [23, 0], [0, -19], [0, 19]].forEach(([px, pz]) => {
      const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.8, 9, 0.8), blackSteelMat);
      pillar.position.set(px, 4.5, pz);
      penthouse.add(pillar);
    });

    // 3. PENTHOUSE INTERIOR ZONES (OPEN-SPACE)
    // A. CENTER: GRAND CONFERENCE SUITE
    const confTable = new THREE.Mesh(new THREE.BoxGeometry(13, 0.5, 6), woodParquetMat);
    confTable.position.set(0, 2.7, 0);
    confTable.castShadow = true;
    penthouse.add(confTable);

    const confGlass = new THREE.Mesh(new THREE.BoxGeometry(11, 0.52, 3), new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.1, metalness: 0.8 }));
    confGlass.position.set(0, 2.7, 0);
    penthouse.add(confGlass);

    // Plant centerpiece
    const plant = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8), new THREE.MeshStandardMaterial({ color: 0x16a34a }));
    plant.position.set(0, 3.8, 0);
    penthouse.add(plant);

    // TV Dashboard
    const tv = new THREE.Mesh(new THREE.BoxGeometry(10, 3.5, 0.2), new THREE.MeshBasicMaterial({ color: 0x0284c7 }));
    tv.position.set(0, 5.5, -6.5);
    penthouse.add(tv);

    // 6 Laptops on Desk
    [[-4.5, 0, -1.2], [4.5, 0, 1.2], [-1.8, 0, -1.8], [1.8, 0, -1.8], [-1.8, 0, 1.8], [1.8, 0, 1.8]].forEach(([lx, ly, lz]) => {
      const lap = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.9), blackSteelMat);
      lap.position.set(lx, 3.0, lz);
      penthouse.add(lap);
      const scr = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.05), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
      scr.position.set(lx, 3.4, lz - 0.4);
      scr.rotation.x = -0.2;
      penthouse.add(scr);
    });

    // Chairs
    function createOfficeChair() {
      const chair = new THREE.Group();
      const seat = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.25, 1.3), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
      seat.position.y = 1.6;
      chair.add(seat);
      const back = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.8, 0.2), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
      back.position.set(0, 2.5, -0.55);
      chair.add(back);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.6, 8), blackSteelMat);
      leg.position.y = 0.8;
      chair.add(leg);
      return chair;
    }

    [[-6.5, 0, 0, Math.PI / 2], [6.5, 0, 0, -Math.PI / 2], [-1.8, 0, -3.2, 0], [1.8, 0, -3.2, 0], [-1.8, 0, 3.2, Math.PI], [1.8, 0, 3.2, Math.PI]].forEach(([cx, cy, cz, rot]) => {
      const c = createOfficeChair();
      c.position.set(cx, 0, cz);
      c.rotation.y = rot;
      penthouse.add(c);
    });

    // B. LEFT ZONE: VIP EXECUTIVE SUITE & KING BED
    const vipDesk = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, 2.5), woodParquetMat);
    vipDesk.position.set(-15, 2.4, -4);
    penthouse.add(vipDesk);

    const kingBed = new THREE.Mesh(new THREE.BoxGeometry(6.5, 1.2, 7.5), new THREE.MeshStandardMaterial({ color: 0x9f1239 }));
    kingBed.position.set(-15, 0.6, -12);
    penthouse.add(kingBed);

    // C. RIGHT ZONE: OPEN WORKSTATION PODS
    [[-4, -3], [4, -3], [-4, 3], [4, 3]].forEach(([ox, oz]) => {
      const desk = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.4, 2.2), woodParquetMat);
      desk.position.set(15 + ox * 0.7, 2.4, -6 + oz * 0.7);
      penthouse.add(desk);
    });

    // D. FRONT-LEFT: SKY BAR & SOTO KITCHEN
    const barCounter = new THREE.Mesh(new THREE.BoxGeometry(8, 2.5, 2.2), woodParquetMat);
    barCounter.position.set(-14, 1.25, 11);

      chin.position.set(0, -0.32, 0.15);
      headGroup.add(chin);

      [[-0.18, 0.05, 0.48], [0.18, 0.05, 0.48]].forEach(([ex, ey, ez]) => {

        headGroup.add(eyeWhite);

        // Pupil / Iris (Blue/Dark)
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), eyePupilMat);
        pupil.position.set(ex, ey, ez + 0.05);
        headGroup.add(pupil);

        // Eyebrows
        const brow = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.03, 0.04), hairMat);
        brow.position.set(ex, ey + 0.12, ez - 0.02);

        headGroup.add(brow);

      // 3D Human Nose
      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.18, 8), skinMat);

          ear.rotation.z = rz;

          ear.position.set(ex, ey, ez);
          ear.scale.set(0.4, 1.0, 0.7);
          headGroup.add(ear);

    // 5. FLOATING HTML LABELS & SPEECH BUBBLES
    function updateOverlayLabels() {
      labelsContainer.innerHTML = '';

      characterMeshes.forEach(({ data, mesh }) => {
        const headPos = new THREE.Vector3();
        mesh.getWorldPosition(headPos);
        headPos.y += 4.8;

        headPos.project(camera);
        if (headPos.z > 1) return;

        const screenX = (headPos.x * 0.5 + 0.5) * container.clientWidth;
        const screenY = (-(headPos.y * 0.5) + 0.5) * container.clientHeight;

        const pill = document.createElement('div');
        pill.className = "badge-pill absolute -translate-x-1/2 -translate-y-1/2 bg-black/80 border border-white/20 px-2.5 py-1 rounded-full text-[10px] font-bold text-white flex items-center gap-1.5 pointer-events-auto cursor-pointer shadow-lg";
        pill.style.left = `${screenX}px`;
        pill.style.top = `${screenY + 28}px`;
        pill.onclick = () => openCard(data);
        pill.innerHTML = `
          <span class="w-2 h-2 rounded-full" style="background-color: ${data.dotColor}"></span>
          <span>${data.badge}</span>
        `;
        labelsContainer.appendChild(pill);

        if (data.bubble && data.bubbleTimer > 0) {
          const bubble = document.createElement('div');
          bubble.className = "bubble-popup absolute -translate-x-1/2 -translate-y-full bg-white text-slate-900 px-3 py-1.5 rounded-lg text-xs font-semibold shadow-2xl border border-slate-300 pointer-events-none whitespace-nowrap animate-bounce";
          bubble.style.left = `${screenX}px`;
          bubble.style.top = `${screenY - 8}px`;
          bubble.innerHTML = `
            <div class="relative">
              <span>${data.bubble}</span>
              <div class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-white"></div>
            </div>
          `;
          labelsContainer.appendChild(bubble);
        }
      });
    }

      for (let i = 2; i < 6; i++) characterMeshes[i].mesh.rotation.y = 0;

      characters[2].bubble = 'Lihat pemandangan kota 50th floor 🏙️';
      characters[4].bubble = 'Santai di sofa merah mewah 🛋️';
      characters[3].bubble = 'Suasana langit cerah ✨';
      characters[5].bubble = 'Teh hangat di lounge 🍵';
      for (let i = 2; i < 6; i++) characters[i].bubbleTimer = 240;
      showToast('🛋️ Staf santai di Panorama Glass Lounge!');
    }

    // POPUP CARD
    let selectedChar = null;
    function openCard(c) {
      selectedChar = c;
      const card = document.getElementById('charCard');
      document.getElementById('cardName').innerText = c.name;
      document.getElementById('cardAvatar').innerText = c.avatar;
      document.getElementById('cardRoleBadge').innerText = c.badge;
      document.getElementById('cardStatus').innerText = `"${c.statusText}"`;
      document.getElementById('cardAction').innerText = `Status: ${c.state.toUpperCase()}`;

      card.classList.remove('translate-y-48', 'opacity-0', 'pointer-events-none');
      card.classList.add('translate-y-0', 'opacity-100');
    }

    function closeCard() {
      const card = document.getElementById('charCard');
      card.classList.add('translate-y-48', 'opacity-0', 'pointer-events-none');
      card.classList.remove('translate-y-0', 'opacity-100');
      selectedChar = null;
    }

    function interactCouple() {
      if (!selectedChar) return;
      const ty = characters.find(c => c.id === 'ty');
      const eliie = characters.find(c => c.id === 'eliie');
      if (selectedChar.id === 'ty' || selectedChar.id === 'eliie') {
        ty.bubble = 'I love you sayang! ❤️';
        eliie.bubble = 'Love you more Ty! 🥰💕';
        ty.bubbleTimer = 220;
        eliie.bubbleTimer = 220;
        showToast('Ty & Eliie saling memeluk penuh cinta! 💖✨');
      } else {
        selectedChar.bubble = 'Makasih perhatiannya Ty! 🥰';
        selectedChar.bubbleTimer = 200;
        showToast(`Kamu memberi perhatian ke ${selectedChar.name}! 💖`);
      }
      closeCard();
    }

    function boostCoffee() {
      if (!selectedChar) return;
      selectedChar.bubble = 'Makasih kopinya Ty! ☕⚡';
      selectedChar.bubbleTimer = 200;
      showToast(`${selectedChar.name} menikmati kopi hangat! ☕✨`);
      closeCard();
    }

    // RESIZE EVENT
    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // RENDER LOOP (60 FPS FLUID 3D)
    function animate() {
      requestAnimationFrame(animate);

      characters.forEach(c => {
        if (c.bubbleTimer > 0) c.bubbleTimer--;
      });

      controls.update();
      renderer.render(scene, camera);
      updateOverlayLabels();
    }

    animate();
  </script>
</body>
</html>
